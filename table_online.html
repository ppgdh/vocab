<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>专升本英语 4496 单词学习表</title>
<meta name="description" content="专升本英语 4496 核心单词 · 卡片速记 · 计划学习 · 难点生词 · 进度记忆">
<meta property="og:title" content="专升本英语 4496 单词学习表">
<meta property="og:description" content="卡片式背单词：滑动下一个、难点标记、学习计划、进度自动保存">
<meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f1f5f9;color:#0f172a;overflow:hidden;}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#fff;position:relative;box-shadow:0 0 40px rgba(15,23,42,.06);}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:#fff;border-bottom:1px solid #eef2f7;}
  header .logo{font-size:15px;font-weight:800;color:#0f766e;}
  header .logo small{font-weight:400;color:#94a3b8;font-size:11px;margin-left:6px;}
  .gear{font-size:20px;background:#f1f5f9;border:none;width:36px;height:36px;border-radius:10px;cursor:pointer;color:#334155;display:flex;align-items:center;justify-content:center;}
  .planbar{padding:10px 16px 6px;font-size:12px;color:#64748b;display:flex;justify-content:space-between;align-items:center;}
  .planbar b{color:#0f766e;}
  .progress{height:6px;background:#e2e8f0;border-radius:99px;margin:6px 16px 4px;overflow:hidden;}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#0ea5e9);border-radius:99px;transition:width .3s;}
  .roundline{padding:0 16px 10px;font-size:11px;color:#94a3b8;}
  .stage{flex:1;display:flex;flex-direction:column;padding:6px 14px 10px;overflow:hidden;}
  .card{flex:1;background:linear-gradient(165deg,#ffffff,#f8fafc);border:1px solid #e8eef5;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;position:relative;cursor:pointer;user-select:none;touch-action:pan-y;box-shadow:0 8px 30px rgba(15,23,42,.06);transition:transform .18s,opacity .18s;}
  .card.swiping{transition:none;}
  .card .tag{position:absolute;top:14px;left:14px;font-size:11px;color:#0ea5e9;background:#e0f2fe;padding:3px 10px;border-radius:99px;}
  .card .num{position:absolute;top:14px;right:14px;font-size:11px;color:#94a3b8;}
  .word{font-size:44px;font-weight:800;color:#0f172a;letter-spacing:.5px;text-align:center;word-break:break-all;}
  .ipa{font-size:18px;color:#64748b;margin-top:10px;}
  .speaker{margin-top:16px;background:#14b8a6;color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 6px 16px rgba(20,184,166,.3);display:flex;align-items:center;justify-content:center;}
  .speaker:active{transform:scale(.94);}
  .meaning{margin-top:22px;width:100%;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#0f172a;line-height:1.6;}
  .meaning.hidden{color:#cbd5e1;cursor:pointer;}
  .meaning .hint{font-size:13px;color:#94a3b8;}
  .hintbar{text-align:center;font-size:12px;color:#94a3b8;padding:8px 0 4px;}
  .hintbar span{display:inline-block;background:#f8fafc;border:1px solid #e8eef5;padding:3px 12px;border-radius:99px;margin:0 3px;}
  .actions{display:flex;gap:12px;padding:10px 4px 12px;}
  .actions button{flex:1;height:52px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s;}
  .actions button:active{transform:scale(.96);}
  .btn-diff{background:#fff7ed;color:#ea580c;border:1.5px solid #fdba74!important;}
  .markbtns{display:flex;gap:6px;flex:1;flex-wrap:wrap;}
  .markbtns button{flex:1;min-width:60px;height:44px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#64748b;padding:0 4px;transition:all .15s;}
  .markbtns button:active{transform:scale(.95);}
  .markbtns button.active{background:#f0fdfa;border-color:#14b8a6;color:#0f766e;}
  .markbtns button[data-tag=star].active{background:#fefce8;border-color:#eab308;color:#a16207;}
  .markbtns button[data-tag=new].active{background:#f0f9ff;border-color:#3b82f6;color:#1d4ed8;}
  .markbtns button[data-tag=confuse].active{background:#fef2f2;border-color:#ef4444;color:#b91c1c;}
  .markbtns button[data-tag=master].active{background:#f0fdf4;border-color:#22c55e;color:#15803d;}
  .btn-next{background:linear-gradient(90deg,#14b8a6,#0ea5e9);color:#fff;box-shadow:0 6px 18px rgba(14,165,233,.28);}
  .stats{display:flex;justify-content:space-around;padding:10px 6px 14px;background:#f8fafc;border-top:1px solid #eef2f7;font-size:12px;color:#64748b;}
  .stats div{text-align:center;}
  .stats b{display:block;font-size:18px;color:#0f172a;margin-bottom:2px;}

  /* 弹窗 */
  .mask{position:absolute;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .mask.show{display:flex;}
  .sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:18px 20px 26px;max-height:86%;overflow:auto;animation:up .22s ease;}
  @keyframes up{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
  .sheet h3{font-size:17px;margin-bottom:14px;color:#0f172a;}
  .field{margin-bottom:16px;}
  .field label{font-size:13px;color:#64748b;display:block;margin-bottom:6px;}
  .field input[type=number]{width:100%;height:46px;border:1.5px solid #e2e8f0;border-radius:12px;padding:0 14px;font-size:16px;color:#0f172a;}
  .field input[type=number]:focus{outline:none;border-color:#14b8a6;}
  .radios{display:flex;gap:10px;}
  .radios label{flex:1;text-align:center;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 4px;font-size:13px;color:#475569;cursor:pointer;}
  .radios input{display:none;}
  .radios input:checked + span{color:#0f766e;font-weight:700;}
  .radios label:has(input:checked){border-color:#14b8a6;background:#f0fdfa;}
  .rowbtns{display:flex;gap:10px;margin-top:6px;}
  .rowbtns button{flex:1;height:48px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-save{background:linear-gradient(90deg,#14b8a6,#0ea5e9);color:#fff;}
  .btn-reset{background:#fef2f2;color:#dc2626;}
  .btn-cancel{background:#f1f5f9;color:#475569;}
  .desc{font-size:12px;color:#94a3b8;margin-top:6px;line-height:1.6;}

  /* 完成页 */
  .done{position:absolute;inset:0;background:#fff;display:none;align-items:center;justify-content:center;z-index:15;text-align:center;padding:30px;}
  .done.show{display:flex;}
  .done .icon{font-size:60px;margin-bottom:14px;}
  .done h2{font-size:24px;color:#0f766e;margin-bottom:8px;}
  .done p{color:#64748b;font-size:14px;line-height:1.8;margin-bottom:18px;}
  .done .big{font-size:34px;font-weight:800;color:#0f172a;}
  .done button{height:50px;border:none;border-radius:14px;font-size:15px;font-weight:700;padding:0 26px;cursor:pointer;margin:6px;}
  .toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(15,23,42,.85);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;white-space:nowrap;}
  .toast.show{opacity:1;}
  /* 底部导航 */
  .bottomnav{display:flex;background:#fff;border-top:1px solid #eef2f7;padding:6px 0 calc(6px + env(safe-area-inset-bottom));flex-shrink:0;}
  .bottomnav button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:#94a3b8;font-size:11px;font-family:inherit;}
  .bottomnav button .ic{font-size:20px;}
  .bottomnav button.active{color:#0f766e;font-weight:700;}
  .bottomnav button.active .ic{transform:scale(1.1);}
  /* 词表面板 */
  .wl-panel{position:absolute;inset:0;background:#fff;z-index:20;display:none;flex-direction:column;}
  .wl-panel.show{display:flex;}
  .wl-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #eef2f7;flex-shrink:0;}
  .wl-header button{background:#f1f5f9;border:none;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0;}
  .wl-header .title{font-size:16px;font-weight:700;color:#0f172a;flex:1;}
  .wl-search{padding:10px 14px;flex-shrink:0;}
  .wl-search input{width:100%;height:42px;border:1.5px solid #e2e8f0;border-radius:12px;padding:0 14px;font-size:15px;}
  .wl-search input:focus{outline:none;border-color:#14b8a6;}
  .wl-letters{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 8px;flex-shrink:0;}
  .wl-letters span{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:6px;background:#f1f5f9;color:#64748b;cursor:pointer;font-weight:600;}
  .wl-letters span.active{background:#14b8a6;color:#fff;}
  .wl-list{flex:1;overflow-y:auto;padding:4px 14px 20px;}
  .wl-item{display:flex;align-items:baseline;gap:10px;padding:10px 4px;border-bottom:1px solid #f1f5f9;}
  .wl-item .w{font-size:16px;font-weight:700;color:#0f172a;min-width:110px;}
  .wl-item .p{font-size:12px;color:#94a3b8;min-width:70px;}
  .wl-item .m{font-size:13px;color:#64748b;flex:1;}
  .wl-item .diff{color:#ea580c;font-size:14px;flex-shrink:0;}
  .wl-empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:14px;}
  .wl-count{font-size:12px;color:#94a3b8;padding:6px 14px;flex-shrink:0;}
  .review-badge{background:#fff7ed;color:#ea580c;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;margin-left:8px;}
  /* 标记选择面板 */
  .tag-picker{position:absolute;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:25;}
  .tag-picker.show{display:flex;}
  .tag-picker .sheet{background:#fff;width:88%;max-width:360px;border-radius:18px;padding:20px;}
  .tag-picker h3{font-size:17px;margin-bottom:14px;color:#0f172a;}
  .tag-picker .tag-list{display:flex;flex-direction:column;gap:8px;}
  .tag-picker .tag-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;cursor:pointer;font-size:15px;}
  .tag-picker .tag-opt.active{border-color:#14b8a6;background:#f0fdfa;}
  .tag-picker .tag-opt .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
  .tag-picker .tag-opt .name{flex:1;}
  .tag-picker .tag-opt .check{color:#14b8a6;font-weight:700;}
  .tag-picker .rowbtns{display:flex;gap:10px;margin-top:16px;}
  .tag-picker .rowbtns button{flex:1;height:44px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .tag-picker .btn-confirm{background:linear-gradient(90deg,#14b8a6,#0ea5e9);color:#fff;}
  .tag-picker .btn-cancel{background:#f1f5f9;color:#475569;}
  /* 词表标记标签 */
  .wl-tags{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
  .wl-tag{font-size:10px;padding:2px 6px;border-radius:6px;color:#fff;font-weight:600;}
  /* 卡片标记显示 */
  .card-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:10px;min-height:20px;}
  .card-tag{font-size:11px;padding:3px 10px;border-radius:99px;color:#fff;font-weight:600;}
  /* ===== 测验系统 ===== */
  .quiz-config{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:30;}
  .quiz-config.show{display:flex;}
  .quiz-config .sheet{background:#fff;width:90%;max-width:380px;border-radius:18px;padding:22px 20px;}
  .quiz-config h3{font-size:18px;margin-bottom:16px;color:#0f172a;text-align:center;}
  .quiz-config .q-group{margin-bottom:14px;}
  .quiz-config .q-label{font-size:13px;color:#64748b;margin-bottom:8px;font-weight:600;}
  .quiz-config .q-opts{display:flex;gap:8px;flex-wrap:wrap;}
  .quiz-config .q-opt{flex:1;min-width:70px;padding:10px 8px;border:1.5px solid #e2e8f0;border-radius:10px;text-align:center;font-size:14px;cursor:pointer;background:#fff;color:#475569;}
  .quiz-config .q-opt.active{border-color:#6366f1;background:#eef2ff;color:#4f46e5;font-weight:700;}
  .quiz-config .q-start{width:100%;height:48px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
  .quiz-config .q-cancel{width:100%;height:40px;border:none;border-radius:10px;background:#f1f5f9;color:#64748b;font-size:14px;cursor:pointer;margin-top:8px;}
  /* 测验界面 */
  .quiz-panel{position:fixed;inset:0;background:linear-gradient(160deg,#667eea,#764ba2);display:none;flex-direction:column;z-index:35;padding:20px;}
  .quiz-panel.show{display:flex;}
  .quiz-top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:16px;}
  .quiz-top .q-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
  .quiz-top .q-progress{font-size:15px;font-weight:600;}
  .quiz-card{background:#fff;border-radius:18px;padding:24px 20px;flex:1;display:flex;flex-direction:column;overflow-y:auto;}
  .quiz-word{font-size:32px;font-weight:800;color:#0f172a;text-align:center;margin-bottom:6px;}
  .quiz-ipa{font-size:15px;color:#94a3b8;text-align:center;margin-bottom:20px;}
  .quiz-meaning{font-size:18px;color:#334155;text-align:center;margin-bottom:20px;line-height:1.6;}
  .quiz-options{display:flex;flex-direction:column;gap:10px;}
  .quiz-opt{padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;cursor:pointer;background:#fff;color:#334155;text-align:left;transition:all .15s;}
  .quiz-opt:active{transform:scale(.98);}
  .quiz-opt.correct{border-color:#10b981;background:#ecfdf5;color:#065f46;font-weight:600;}
  .quiz-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b;}
  .quiz-opt.disabled{pointer-events:none;opacity:.6;}
  .quiz-spell-input{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:18px;text-align:center;outline:none;margin-bottom:12px;}
  .quiz-spell-input:focus{border-color:#6366f1;}
  .quiz-spell-btn{width:100%;height:46px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
  .quiz-feedback{text-align:center;padding:12px;border-radius:10px;margin-top:12px;font-weight:600;font-size:15px;display:none;}
  .quiz-feedback.show{display:block;}
  .quiz-feedback.ok{background:#ecfdf5;color:#065f46;}
  .quiz-feedback.no{background:#fef2f2;color:#991b1b;}
  .quiz-next-btn{width:100%;height:46px;border:none;border-radius:12px;background:#f1f5f9;color:#475569;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;display:none;}
  .quiz-next-btn.show{display:block;}
  /* 测验结果 */
  .quiz-result{text-align:center;}
  .quiz-result .score{font-size:56px;font-weight:800;color:#6366f1;}
  .quiz-result .score-label{font-size:16px;color:#64748b;margin-bottom:20px;}
  .quiz-result .result-detail{font-size:14px;color:#475569;margin-bottom:20px;}
  .quiz-result .result-btns{display:flex;gap:10px;}
  .quiz-result .result-btns button{flex:1;height:44px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
  .quiz-result .btn-retry{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;}
  .quiz-result .btn-wrong{background:#fef3c7;color:#92400e;}
  .quiz-result .btn-close{background:#f1f5f9;color:#64748b;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">专升本英语 · 卡片速记<small>4496 词</small></div>
    <button class="gear" onclick="openSettings()">⚙️</button>
  </header>

  <div class="planbar">
    <div id="planText">自由学习</div>
    <div id="planDate"></div>
  </div>
  <div class="progress"><i id="progFill"></i></div>
  <div class="roundline" id="roundText"></div>

  <div class="stage">
    <div class="card" id="card" onclick="toggleMeaning()">
      <span class="tag" id="cardTag">NEW</span>
      <span class="num" id="cardNum"></span>
      <div class="word" id="word"></div>
      <div class="ipa" id="ipa"></div>
      <button class="speaker" id="speakBtn" onclick="playSound(event)">🔊</button>
      <div class="meaning hidden" id="meaning"><span class="hint">轻点显示释义</span></div>
      <div class="card-tags" id="cardTags"></div>
    </div>
    <div class="hintbar"><span>👈左滑=下一个  👉右滑=上一个</span><span>点击卡片看释义</span></div>
    <div class="actions">
      <div class="markbtns" id="markBtns">
  <button class="btn-mark" onclick="toggleHardTag()" style="background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:none">🏷️ 标记难点</button>
</div>
      <button class="btn-next" onclick="next(true)">下一个 ✓</button>
      <button class="btn-reset" onclick="resetStudy()" style="background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;height:40px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0">🔄 重学</button>
    </div>
  </div>

  <div class="stats">
    <div><b id="stStudied">0</b>已学</div>
    <div><b id="stDiff">0</b>难点</div>
    <div><b id="stToday">0</b>今日目标</div>
    <div><b id="stLeft">0</b>剩余</div>
  </div>

  <!-- 完成页 -->
  <div class="done" id="donePage">
    <div>
      <div class="icon">🎉</div>
      <h2 id="doneTitle">本日完成！</h2>
      <p id="doneText"></p>
      <button class="btn-next" id="doneNextBtn" onclick="continueNext()">继续学习</button>
      <button class="btn-cancel" onclick="goHome()">返回首页</button>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="mask" id="settings">
    <div class="sheet">
      <h3>学习设置</h3>
      <div class="field">
        <label>学习计划 · 几天背完全部单词（0 = 自由学习）</label>
        <input type="number" id="inDays" min="0" max="120" placeholder="例如 30">
        <div class="desc">设置天数后，系统自动把 4496 词均衡分配到每天（每天混合 A–Z 各首字母），并自动算每天单词数。</div>
      </div>
      <div class="field">
        <label>每轮背诵单词数</label>
        <input type="number" id="inRound" min="5" max="200" placeholder="例如 20">
        <div class="desc">每一轮（一次连续学习）的单词数量。</div>
      </div>
      <div class="field">
        <label>背诵顺序</label>
        <div class="radios">
          <label><input type="radio" name="order" value="az"><span>A–Z 顺序</span></label>
          <label><input type="radio" name="order" value="random"><span>每日随机</span></label>
        </div>
      </div>
      <div class="field">
        <label>发音口音</label>
        <div class="radios">
          <label><input type="radio" name="accent" value="us"><span>美音</span></label>
          <label><input type="radio" name="accent" value="uk"><span>英音</span></label>
        </div>
      </div>
      <div class="rowbtns">
        <button class="btn-reset" onclick="resetProgress()">重置进度</button>
        <button class="btn-cancel" onclick="closeSettings()">取消</button>
        <button class="btn-save" onclick="saveSettings()">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 标记选择面板 -->
  <div class="tag-picker" id="tagPicker">
    <div class="sheet">
      <h3 id="tagPickerTitle">标记单词</h3>
      <div class="tag-list" id="tagList"></div>
      <div class="rowbtns">

// ================= 工具 =================
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1500);}

function initProg(){
  if(!prog){
    prog={mode:'free',dayIndex:0,pos:0,studied:[],difficult:[],tags:{},directPos:0,wrongWords:[],directPos:0,perm:[],lastDate:'',finished:false};
  }
  if(!prog.tags) prog.tags={};
  if(!prog.difficult) prog.difficult=[];
  // 迁移旧difficult数据到tags.hard
  if(prog.difficult && prog.difficult.length>0){
    var migrated=false;
    for(var mi=0;mi<prog.difficult.length;mi++){
      var wi=prog.difficult[mi];
      if(!prog.tags[wi]||prog.tags[wi].indexOf('hard')<0){
        if(!prog.tags[wi]) prog.tags[wi]=[];
        if(prog.tags[wi].indexOf('hard')<0) prog.tags[wi].push('hard');
        migrated=true;
      }
    }
    if(migrated) save(LS_PROG,prog);
  }
}
function buildQueue(){
  initProg();
  // 页面刷新后自动恢复：从临时查看/直接学习/复习模式回来时恢复原状态
  if(prog.jumpSaved){
    directMode=prog.jumpSaved.directMode;
    reviewMode=prog.jumpSaved.reviewMode;
    prog.pos=prog.jumpSaved.pos;
    prog.directPos=prog.jumpSaved.directPos;
    prog.directMode=prog.jumpSaved.directMode;
    if(prog.jumpSaved.studyPos!==undefined) prog.studyPos=prog.jumpSaved.studyPos;
    else if(prog.studyPos!==undefined) delete prog.studyPos;
    delete prog.jumpSaved;
    jumpMode=false;
  }else if(prog.directMode){
    // 直接学习模式: pos=directPos, 不恢复studyPos(防止继续学习进度覆盖直接学习进度)
    directMode=true;
    prog.pos=prog.directPos||0;
  }else{
    // 继续学习模式
    if(prog.studyPos!==undefined){
      prog.pos=prog.studyPos;
      delete prog.studyPos;
    }
    if(prog.savedStudyPos!==undefined && prog.savedStudyPos!==null){
      prog.pos=prog.savedStudyPos;
      delete prog.savedStudyPos;
    }
  }
  const n=DATA.length;
  // 继续学习和直接学习都采用全量单词表(全局索引),学习计划仅作每日目标提示,不影响实际队列和pos
  totalDays=cfg.planDays>0?cfg.planDays:0;
  const set=Array.from({length:n},(_,i)=>i);
  prog.mode='free';
  dayLength=set.length;
  // 顺序(仅影响继续学习模式的展示顺序,直接学习模式固定A-Z)
  if(cfg.order==='random' && !directMode && !reviewMode && !jumpMode){
    if(!prog.perm || prog.perm.length!==dayLength){
      prog.perm=shuffle(set.slice());
    }
    queue=prog.perm.slice();
  }else{
    prog.perm=[];
    queue=set.slice();
  }
  if(prog.pos>dayLength) prog.pos=dayLength;
  save(LS_PROG,prog);
}
function dayLengthOf(day){
  if(cfg.planDays<=0) return 0;
  let c=0; for(let i=0;i<DATA.length;i++) if(i%cfg.planDays===day) c++;
  return c;
}

// ================= 渲染 =================
let curIdx=-1; // 当前词在 DATA 中的索引
function currentWordIndex(){
  if(!queue.length) return -1;
  return queue[Math.min(prog.pos,queue.length-1)];
}
function render(){
  if(!queue || queue.length===0) buildQueue();
  const doneAll = queue.length>0 && prog.pos>=queue.length;
  if(doneAll){ showDone(); return; }
  hideDone();
  curIdx=currentWordIndex();
  const w=DATA[curIdx];
  const pos=prog.pos+1, total=queue.length;
  document.getElementById('word').textContent=w[0];
  document.getElementById('ipa').textContent=w[1]||'';
  document.getElementById('cardNum').textContent=pos+' / '+total;
  // 释义重置为隐藏
  const m=document.getElementById('meaning');
  m.classList.remove('hidden'); m.innerHTML=esc(w[2]||'暂无释义'); m.dataset.def=esc(w[2]||'');
  renderCardTags();
  updateMarkBtn();
  // 计划信息
  const planText=document.getElementById('planText');
  if(cfg.planDays>0){
    planText.innerHTML='📅 第 <b>'+(prog.dayIndex+1)+'</b> / '+cfg.planDays+' 天 · 今日 <b>'+total+'</b> 词';
  }else{
    planText.textContent=cfg.order==='random'?'🎲 自由学习（随机）':'📖 自由学习（A–Z）';
  }
  document.getElementById('planDate').textContent=todayStr();
  // 进度条
  const pct=Math.round(pos/total*100);
  document.getElementById('progFill').style.width=Math.min(100,pct)+'%';
  // 轮次
  const rs=cfg.roundSize||20;
  const round=Math.floor(prog.pos/rs)+1;
  const inRound=prog.pos%rs+1;
  const rounds=Math.ceil(total/rs);
  document.getElementById('roundText').textContent='第 '+round+' / '+rounds+' 轮 · 本轮 '+inRound+' / '+rs;
  // 标签
  const tag=document.getElementById('cardTag');
  if(prog.difficult.indexOf(curIdx)>=0){tag.textContent='⚠️ 已标难点';tag.style.background='#ffedd5';tag.style.color='#ea580c';}
  else if(prog.studied.indexOf(curIdx)>=0){tag.textContent='✓ 已学过';tag.style.background='#d1fae5';tag.style.color='#047857';}
  else{tag.textContent='NEW';tag.style.background='#e0f2fe';tag.style.color='#0ea5e9';}
  // 统计
  document.getElementById('stStudied').textContent=new Set(prog.studied).size;
  document.getElementById('stDiff').textContent=new Set(prog.difficult).size;
  document.getElementById('stToday').textContent=total;
  document.getElementById('stLeft').textContent=Math.max(0,total-pos);
  save(LS_PROG,prog);
}
function toggleMeaning(){
  const m=document.getElementById('meaning');
  if(m.classList.contains('hidden')){m.classList.remove('hidden');m.innerHTML=m.dataset.def;}
  else{m.classList.add('hidden');m.innerHTML='<span class="hint">轻点显示释义</span>';}
}

// ================= 交互 =================
function next(learned){
  if(!queue.length) return;
  if(learned!==false) learned=true;
  const wi=currentWordIndex();
  // 仅在正常学习模式(继续/直接)下记录已学,复习和临时查看不影响已学列表
  if(learned && !reviewMode && !jumpMode && prog.studied.indexOf(wi)<0) prog.studied.push(wi);
  if(prog.pos<queue.length){ prog.pos++; } // 修复:最后一词推进到length触发完成页
  if(directMode && !jumpMode) prog.directPos=prog.pos;
  save(LS_PROG,prog);
  render();
}
function prev(){
  if(!queue.length) return;
  if(prog.pos>0){ prog.pos--; }
  if(directMode && !jumpMode) prog.directPos=prog.pos;
  save(LS_PROG,prog);
  render();
}
// ================= 自定义标记 =================
let _tagPickerIdx=-1;
function getTagCfg(){ return (cfg&&cfg.tags)?cfg.tags:[{id:'hard',name:'难点',color:'#dc2626'}]; }
function getWordTags(idx){
  if(!prog.tags) prog.tags={};
  return prog.tags[idx]||[];
}
// 一键切换难点标记(不弹面板)
function toggleHardTag(){
  // 错题库复习模式: 点击"已学会"从错题库移除该单词
  if(wrongReviewMode){
    const wi=currentWordIndex();
    if(wi<0) return;
    if(!prog.wrongWords) prog.wrongWords=[];
    const idx2=prog.wrongWords.indexOf(wi);
    if(idx2>=0){ prog.wrongWords.splice(idx2,1); save(LS_PROG,prog); toast('已从错题库移除 ✓'); }
    // 从复习队列中移除
    const qi=queue.indexOf(wi);
    if(qi>=0) queue.splice(qi,1);
    dayLength=queue.length;
    if(prog.pos>=queue.length) prog.pos=Math.max(0,queue.length-1);
    if(queue.length===0){ toast('错题库已全部学会！'); showStudy(); return; }
    render();
    return;
  }
  // 正常标记难点
  if(!queue.length) return;
  const wi=currentWordIndex();
  if(!prog.tags) prog.tags={};
  if(!prog.difficult) prog.difficult=[];
  const cur=getWordTags(wi);
  const isHard=cur.indexOf('hard')>=0 || prog.difficult.indexOf(wi)>=0;
  if(isHard){
    // 取消难点标记
    prog.tags[wi]=cur.filter(function(t){return t!=='hard';});
    if(prog.tags[wi].length===0) delete prog.tags[wi];
    prog.difficult=prog.difficult.filter(function(x){return x!==wi;});
    toast('已取消难点标记');
  }else{
    // 标记为难点
    if(cur.indexOf('hard')<0) cur.push('hard');
    prog.tags[wi]=cur;
    if(prog.difficult.indexOf(wi)<0) prog.difficult.push(wi);
    if(prog.studied.indexOf(wi)<0) prog.studied.push(wi);
    toast('✓ 已加入难点库');
  }
  save(LS_PROG,prog);
  updateMarkBtn();
  renderCardTags();
}

// 更新标记按钮状态
function updateMarkBtn(){
  const btn=document.querySelector('.btn-mark');
  if(!btn) return;
  const wi=currentWordIndex();
  if(wi<0){ btn.textContent='🏷️ 标记难点'; btn.style.background='linear-gradient(135deg,#8b5cf6,#6366f1)'; return; }
  // 错题库复习模式: 按钮显示"已学会"
  if(wrongReviewMode){
    btn.textContent='✓ 已学会';
    btn.style.background='linear-gradient(135deg,#10b981,#059669)';
    return;
  }
  const cur=getWordTags(wi);
  const isHard=cur.indexOf('hard')>=0 || (prog.difficult && prog.difficult.indexOf(wi)>=0);
  if(isHard){
    btn.textContent='✓ 已标记';
    btn.style.background='linear-gradient(135deg,#10b981,#059669)';
  }else{
    btn.textContent='🏷️ 标记难点';
    btn.style.background='linear-gradient(135deg,#8b5cf6,#6366f1)';
  }
}

function openTagPicker(){
  if(!queue.length) return;
  _tagPickerIdx=currentWordIndex();
  document.getElementById('tagPickerTitle').textContent='标记: '+DATA[_tagPickerIdx][0];
  renderTagList();
  document.getElementById('tagPicker').classList.add('show');
}
function renderTagList(){
  const tags=getTagCfg();
  const cur=getWordTags(_tagPickerIdx);
  const box=document.getElementById('tagList');
  box.innerHTML=tags.map(function(t){
    const active=cur.indexOf(t.id)>=0;
    return '<div class="tag-opt'+(active?' active':'')+'" data-id="'+t.id+'" onclick="toggleTagOpt(this)">'+
      '<span class="dot" style="background:'+t.color+'"></span>'+
      '<span class="name">'+t.name+'</span>'+
      (active?'<span class="check">✓</span>':'')+
    '</div>';
  }).join('');
}
function toggleTagOpt(el){
  el.classList.toggle('active');
  const check=el.querySelector('.check');
  if(el.classList.contains('active')){
    if(!check){const s=document.createElement('span');s.className='check';s.textContent='✓';el.appendChild(s);}
  }else if(check){check.remove();}
}
function confirmTags(){
  const tags=getTagCfg();
  const selected=[];
  document.querySelectorAll('#tagList .tag-opt.active').forEach(function(el){selected.push(el.dataset.id);});
  if(!prog.tags) prog.tags={};
  if(!prog.difficult) prog.difficult=[];
  if(selected.length>0){ prog.tags[_tagPickerIdx]=selected; }
  else{ delete prog.tags[_tagPickerIdx]; }
  // 难点标记与难点库同步: 有hard标记则加入difficult
  const wi=_tagPickerIdx;
  if(selected.indexOf('hard')>=0 && prog.difficult.indexOf(wi)<0) prog.difficult.push(wi);
  if(selected.indexOf('hard')<0){ prog.difficult=prog.difficult.filter(function(x){return x!==wi;}); }
  if(prog.studied.indexOf(wi)<0) prog.studied.push(wi);
  save(LS_PROG,prog);
  closeTagPicker();
  render();
  toast('标记已保存');
}
function closeTagPicker(){ document.getElementById('tagPicker').classList.remove('show'); }
function renderCardTags(){
  const idx=currentWordIndex();
  const tags=getWordTags(idx);
  const cfg=getTagCfg();
  const box=document.getElementById('cardTags');
  if(!box) return;
  box.innerHTML=tags.map(function(tid){
    const t=cfg.find(function(x){return x.id===tid;});
    return t?'<span class="card-tag" style="background:'+t.color+'">'+t.name+'</span>':'';
  }).join('');
}

function markDifficult(){
  if(!queue.length) return;
  const wi=currentWordIndex();
  if(prog.difficult.indexOf(wi)<0) prog.difficult.push(wi);
  if(prog.studied.indexOf(wi)<0) prog.studied.push(wi);
  prog.pos++;
  save(LS_PROG,prog);
  toast('已加入难点生词 ⚠️');
  render();
}

// 发音
function playWord(w){
  if(!w) return;
  const type=cfg.accent==='uk'?2:1;
  try{
    const a=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(w)+'&type='+type);
    a.play().catch(function(){
      const b=new Audio('https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent(w)+'&spd=3&source=web');
      b.play().catch(function(){});
    });
  }catch(e){}
}
function playSound(e){
  if(e) e.stopPropagation();
  const wi=currentWordIndex(); if(wi<0) return;
  const w=DATA[wi][0];
  const type=cfg.accent==='uk'?2:1;
  const url='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(w)+'&type='+type;
  const a=new Audio(url);
  a.play().catch(()=>{
    const b=new Audio('https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent(w)+'&spd=3&source=web');
    b.play().catch(()=>toast('发音加载失败，请联网重试'));
  });
}

// ================= 完成页 =================
function showDone(){
  document.getElementById('donePage').classList.add('show');
  const s=new Set(prog.studied).size, d=new Set(prog.difficult).size;
  if(cfg.planDays>0){
    document.getElementById('doneTitle').textContent='第 '+(prog.dayIndex+1)+' 天完成！';
    document.getElementById('doneText').innerHTML='今日 <b class="big">'+dayLength+'</b> 词已学完<br>累计已学 '+s+' 词 · 难点 '+d+' 词';
    document.getElementById('doneNextBtn').style.display= prog.dayIndex<totalDays-1 ? 'inline-block':'none';
  }else{
    document.getElementById('doneTitle').textContent='全部单词学完！';
    document.getElementById('doneText').innerHTML='共 <b class="big">'+DATA.length+'</b> 词已学完<br>难点 '+d+' 词 · 可重置后复习';
    document.getElementById('doneNextBtn').style.display='none';
  }
}
function hideDone(){ document.getElementById('donePage').classList.remove('show'); }
function continueNext(){
  if(cfg.planDays>0 && prog.dayIndex<totalDays-1){ prog.dayIndex++; prog.pos=0; prog.perm=[]; }
  save(LS_PROG,prog); render();
}
function goHome(){
  save(LS_PROG,prog);
  window.location.href='index.html';
}

// ================= 滑动 =================
(function(){
  const card=document.getElementById('card');
  let sx=0,sy=0;
  card.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},false);
  card.addEventListener('touchend',function(e){
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0){ next(true); }      // 左滑 → 下一个
      else{ prev(); }                // 右滑 → 上一个
    }
  },false);
  // 键盘
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next(true);}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  });
})();

// ================= 设置 =================
function openSettings(){
  if(!queue || queue.length===0) buildQueue();
  document.getElementById('inDays').value=cfg.planDays||0;
  document.getElementById('inRound').value=cfg.roundSize||20;
  document.querySelectorAll('input[name=order]').forEach(r=>r.checked=(r.value===cfg.order));
  document.querySelectorAll('input[name=accent]').forEach(r=>r.checked=(r.value===cfg.accent));
  document.getElementById('settings').classList.add('show');
}
function closeSettings(){ document.getElementById('settings').classList.remove('show'); goHome(); }
function saveSettings(){
  const days=parseInt(document.getElementById('inDays').value)||0;
  const round=parseInt(document.getElementById('inRound').value)||20;
  const order=document.querySelector('input[name=order]:checked').value;
  const accent=document.querySelector('input[name=accent]:checked').value;
  cfg.planDays=Math.max(0,Math.min(120,days));
  cfg.roundSize=Math.max(5,Math.min(200,round));
  cfg.order=order; cfg.accent=accent;
  save(LS_CFG,cfg);
  // 配置变化：重置当日进度位置
  prog.dayIndex=0; prog.pos=0; prog.perm=[]; prog.finished=false;
  save(LS_PROG,prog);
  closeSettings();
  toast('设置已保存');
  render();
}
function resetProgress(){
  if(!confirm('确定清空所有学习进度吗？（已学/难点记录都会被清除）')) return;
  localStorage.removeItem(LS_PROG);
  prog=null; initProg(); save(LS_PROG,prog);
  closeSettings();
  toast('进度已重置');
  render();
}

// ================= 启动 =================

// ================= 视图切换 =================
let reviewMode=false; let wrongReviewMode=false; wrongReviewMode=false;
let directMode=false;  // 难点库模式
let jumpMode=false;  // 临时查看模式(从词表点击跳转)
let wlFilter='all';
let wlTagFilter='all';    // 词表过滤: all / difficult / 字母
function setActiveNav(id){
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}
function showStudy(){
  // 从临时查看模式回来,完全恢复原状态(jumpSaved包含完整状态,直接恢复并返回)
  if(prog.jumpSaved){
    directMode=prog.jumpSaved.directMode;
    reviewMode=prog.jumpSaved.reviewMode;
    prog.pos=prog.jumpSaved.pos;
    prog.directPos=prog.jumpSaved.directPos;
    prog.directMode=prog.jumpSaved.directMode;
    delete prog.jumpSaved;
    // 不删除studyPos/savedStudyPos:它们是独立的恢复机制(直接学习→继续学习),与jumpSaved无关
    jumpMode=false;
    save(LS_PROG,prog);
    document.getElementById('wlPanel').classList.remove('show');
    document.getElementById('donePage').classList.remove('show');
    setActiveNav('navStudy');
    // directMode时手动构建全量队列,避免buildQueue中studyPos检查覆盖prog.pos
    if(directMode){
      queue=Array.from({length:DATA.length},function(_,i){return i;});
      dayLength=queue.length;
    }else{
      buildQueue();
    }
    render();
    return;
  }
  // 从复习模式回来,优先恢复完整状态快照(确保directMode/pos/directPos/studyPos全部回到复习前)
  if(prog.reviewSnapshot){
    directMode=prog.reviewSnapshot.directMode;
    prog.directMode=prog.reviewSnapshot.directMode;
    prog.pos=prog.reviewSnapshot.pos;
    prog.directPos=prog.reviewSnapshot.directPos;
    if(prog.reviewSnapshot.studyPos!==undefined) prog.studyPos=prog.reviewSnapshot.studyPos;
    else if(prog.studyPos!==undefined) delete prog.studyPos;
    delete prog.reviewSnapshot;
    if(prog.savedStudyPos!==undefined) delete prog.savedStudyPos;
  }
  // 兼容旧数据: 只有savedStudyPos时恢复pos
  else if(prog.savedStudyPos!==undefined && prog.savedStudyPos!==null){
    prog.pos=prog.savedStudyPos;
    delete prog.savedStudyPos;
  }
  // 从直接学习回来,恢复继续学习进度
  if(prog.studyPos!==undefined){
    prog.pos=prog.studyPos;
    delete prog.studyPos;
    directMode=false;
    prog.directMode=false;
  }else{
    // 用户主动点击继续学习: 总是切回继续学习模式
    reviewMode=false; wrongReviewMode=false;
    directMode=false;
    prog.directMode=false;
  }
  document.getElementById('wlPanel').classList.remove('show');
  document.getElementById('donePage').classList.remove('show');
  setActiveNav('navStudy');
  buildQueue(); render();
}
function showWordList(){
  wlFilter='all';
  document.getElementById('wlModeLabel').textContent='';
  document.getElementById('wlSearch').value='';
  document.getElementById('wlPanel').classList.add('show');
  document.getElementById('donePage').classList.remove('show');
  setActiveNav('navList');
  buildLetters(); renderWordList();
}
function setTagFilter(id){
  wlTagFilter=id;
  renderWordList();
}

function showDifficult(){
  // 收集所有有标记的词
  const allTagged=[];
  if(prog && prog.tags){
    for(var k in prog.tags){ if(prog.tags[k] && prog.tags[k].length>0) allTagged.push(parseInt(k)); }
  }
  // 兼容旧difficult
  if(prog && prog.difficult){
    for(var di=0;di<prog.difficult.length;di++){
      if(allTagged.indexOf(prog.difficult[di])<0) allTagged.push(prog.difficult[di]);
    }
  }
  if(allTagged.length===0){
    toast('还没有标记难点词，学习时点「🏷️标记」选择"难点"即可加入');
    return;
  }
  wlFilter='difficult';
  wlTagFilter='all';
  document.getElementById('wlModeLabel').textContent='· 难点库 ('+allTagged.length+')';
  document.getElementById('wlSearch').value='';
  document.getElementById('wlPanel').classList.add('show');
  setActiveNav('navDiff');
  // 添加入口: 错题库和测验
  var extraBtns='<div style="display:flex;gap:8px;justify-content:center;margin:8px 0 4px">'+
    '<button onclick="showWrongList()" style="background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;border:none;height:38px;padding:0 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">❌ 错题库</button>'+
    '<button onclick="openQuizConfig()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;height:38px;padding:0 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">📝 测验</button>'+
    '</div>';
  document.getElementById('wlList').innerHTML=extraBtns;
  buildLetters(); renderWordList();
}
function startDifficultReview(){
  // 收集当前筛选的词
  const tagCfg=getTagCfg();
  const reviewList=[];
  for(let i=0;i<DATA.length;i++){
    const wtags=getWordTags(i);
    const hasHard=prog.difficult.indexOf(i)>=0;
    const hasAnyTag=wtags.length>0 || hasHard;
    if(!hasAnyTag) continue;
    if(wlTagFilter!=='all'){
      if(wlTagFilter==='hard'){
        if(!hasHard && wtags.indexOf('hard')<0) continue;
      }else if(wtags.indexOf(wlTagFilter)<0) continue;
    }
    reviewList.push(i);
  }
  if(reviewList.length===0){ toast('当前分类没有难点词'); return; }
  reviewMode=true;
  // 保存完整状态快照(退出复习时完整恢复,不依赖studyPos是否存在)
  prog.reviewSnapshot={directMode:directMode,pos:prog.pos,directPos:prog.directPos,studyPos:prog.studyPos};
  directMode=false;
  prog.directMode=false;
  queue=reviewList.slice();
  dayLength=queue.length;
  prog.pos=0;
  document.getElementById('wlPanel').classList.remove('show');
  document.getElementById('donePage').classList.remove('show');
  setActiveNav('navDiff');
  save(LS_PROG,prog);  // 保存原进度到localStorage
  render();
  toast('开始复习 · 共 '+queue.length+' 词');
}
function closeWordList(){
  document.getElementById('wlPanel').classList.remove('show');
  goHome();
}
// ================= 总词表 =================
function buildLetters(){
  if(wlFilter==='wrong'){
    document.getElementById('wlLetters').innerHTML='';
    return;
  }
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const box=document.getElementById('wlLetters');
  box.innerHTML=`<span class="active" data-l="all" onclick="filterLetter('all')">全部</span>`+
    letters.map(l=>`<span data-l="${l}" onclick="filterLetter('${l}')">${l}</span>`).join('');
}
function filterLetter(l){
  wlFilter=l;
  document.querySelectorAll('#wlLetters span').forEach(s=>{
    s.classList.toggle('active', s.dataset.l===l);
  });
  renderWordList();
}
function renderWordList(){
  // 错题库模式
  if(wlFilter==='wrong'){
    const q=document.getElementById('wlSearch').value.trim().toLowerCase();
    const list=document.getElementById('wlList');
    const wrongSet=new Set(prog.wrongWords||[]);
    let items=[];
    for(let i=0;i<DATA.length;i++){
      if(!wrongSet.has(i)) continue;
      const w=DATA[i][0],ipa=DATA[i][1],mean=DATA[i][2];
      if(q&&w.toLowerCase().indexOf(q)<0&&mean.toLowerCase().indexOf(q)<0) continue;
      items.push({i,w,ipa,mean,tags:getWordTags(i)});
    }
    document.getElementById('wlCount').textContent='共 '+items.length+' 词';
    let header='<div style="padding:10px 0;text-align:center"><button onclick="startWrongReview()" style="background:linear-gradient(90deg,#ef4444,#f97316);color:#fff;border:none;height:44px;padding:0 28px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer">🎯 开始复习错题 ('+items.length+')</button></div>';
    if(items.length===0){ list.innerHTML=header+'<div class="wl-empty">没有找到匹配的错题</div>'; return; }
    const show=items.slice(0,500);
    const tagCfg=getTagCfg();
    list.innerHTML=header+show.map(function(it){
      var wsafe=esc(it.w).replace(/'/g,"&#39;");
      var tagHtml=it.tags.map(function(tid){var t=tagCfg.find(function(x){return x.id===tid;});return t?'<span class="wl-tag" style="background:'+t.color+'">'+t.name+'</span>':'';}).join('');
      return '<div class="wl-item">'+
      '<span class="w" onclick="playWord(\''+wsafe+'\')" style="cursor:pointer">'+esc(it.w)+' 🔊</span>'+
      '<span class="p">'+esc(it.ipa)+'</span>'+
      '<span class="m">'+esc(it.mean)+'</span>'+
      (tagHtml?'<span class="wl-tags">'+tagHtml+'</span>':'')+
      '<span onclick="jumpToWord('+it.i+')" style="color:#0ea5e9;font-size:12px;cursor:pointer;flex-shrink:0;padding:3px 10px;border:1px solid #7dd3fc;border-radius:8px;white-space:nowrap">学习</span>'+
      '</div>';
    }).join('')+(items.length>500?'<div class="wl-empty">仅显示前 500 条</div>':'');
    return;
  }
  const q=document.getElementById('wlSearch').value.trim().toLowerCase();
  const list=document.getElementById('wlList');
  const tagCfg=getTagCfg();
  let items=[];
  for(let i=0;i<DATA.length;i++){
    const w=DATA[i][0], ipa=DATA[i][1], mean=DATA[i][2];
    const wtags=getWordTags(i);
    const hasHard=prog.difficult.indexOf(i)>=0;
    if(wlFilter==='difficult'){
      // 难点库: 显示有任意标记的词(含旧difficult)
      const hasAnyTag=wtags.length>0 || hasHard;
      if(!hasAnyTag) continue;
      // 按标记类型筛选
      if(wlTagFilter!=='all'){
        if(wlTagFilter==='hard'){
          if(!hasHard && wtags.indexOf('hard')<0) continue;
        }else if(wtags.indexOf(wlTagFilter)<0) continue;
      }
    } else if(wlFilter!=='all' && w[0].toUpperCase()!==wlFilter){
      continue;
    }
    if(q && w.toLowerCase().indexOf(q)<0 && mean.toLowerCase().indexOf(q)<0) continue;
    items.push({i,w,ipa,mean,tags:wtags,hasHard:hasHard});
  }
  document.getElementById('wlCount').textContent='共 '+items.length+' 词';
  let header='';
  if(wlFilter==='difficult'){
    // 标记分类筛选按钮
    var filterBtns='<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px">'+
      '<button onclick="setTagFilter(\'all\')" style="padding:6px 14px;border-radius:99px;border:1.5px solid '+(wlTagFilter==='all'?'#14b8a6':'#e2e8f0')+';background:'+(wlTagFilter==='all'?'#f0fdfa':'#fff')+';color:'+(wlTagFilter==='all'?'#0d9488':'#64748b')+';font-size:13px;font-weight:600;cursor:pointer">全部</button>';
    for(var fi=0;fi<tagCfg.length;fi++){
      var t=tagCfg[fi];
      var active=(wlTagFilter===t.id);
      filterBtns+='<button onclick="setTagFilter(\''+t.id+'\')" style="padding:6px 14px;border-radius:99px;border:1.5px solid '+(active?t.color:'#e2e8f0')+';background:'+(active?t.color+'22':'#fff')+';color:'+(active?t.color:'#64748b')+';font-size:13px;font-weight:600;cursor:pointer">'+t.name+'</button>';
    }
    filterBtns+='</div>';
    if(items.length>0){
      header=filterBtns+'<div style="padding:6px 0 10px;text-align:center"><button onclick="startDifficultReview()" style="background:linear-gradient(90deg,#f59e0b,#f97316);color:#fff;border:none;height:42px;padding:0 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">🎯 开始复习 ('+items.length+'词)</button></div>';
    }else{
      header=filterBtns;
    }
  }
  if(items.length===0){
    list.innerHTML=header+'<div class="wl-empty">没有找到匹配的单词</div>';
    return;
  }
  const show=items.slice(0,500);
  list.innerHTML=header+show.map(function(it){
    var wsafe=esc(it.w).replace(/'/g,"&#39;");
    var wtags=it.tags;
    // 兼容旧difficult: 如果有hard但tags中没有,显示难点标签
    if(it.hasHard && wtags.indexOf('hard')<0) wtags=wtags.concat(['hard']);
    var tagHtml=wtags.map(function(tid){
      var t=tagCfg.find(function(x){return x.id===tid;});
      return t?'<span class="wl-tag" style="background:'+t.color+'">'+t.name+'</span>':'';
    }).join('');
    return '<div class="wl-item">'+
    '<span class="w" onclick="playWord(\''+wsafe+'\')" style="cursor:pointer">'+esc(it.w)+' 🔊</span>'+
    '<span class="p">'+esc(it.ipa)+'</span>'+
    '<span class="m">'+esc(it.mean)+'</span>'+
    (tagHtml?'<span class="wl-tags">'+tagHtml+'</span>':'')+
    '<span onclick="jumpToWord('+it.i+')" style="color:#0ea5e9;font-size:12px;cursor:pointer;flex-shrink:0;padding:3px 10px;border:1px solid #7dd3fc;border-radius:8px;white-space:nowrap">学习</span>'+
    '</div>';
  }).join('')+(items.length>500?'<div class="wl-empty">仅显示前 500 条，请用搜索缩小范围</div>':'');
}
// 重新学习: 重置当前模式进度
function resetStudy(){
  if(reviewMode){ prog.pos=0; }
  else if(directMode){ prog.directPos=0; prog.pos=0; }
  else{ prog.pos=0; prog.perm=[]; if(prog.studyPos) delete prog.studyPos; }
  save(LS_PROG,prog);
  render();
  updateMarkBtn();
  toast('已重置,从头开始学习');
}

function startFromWordList(){
  // 如果从复习模式直接切入,先完整恢复复习前状态(防止复习进度覆盖studyPos)
  if(prog.reviewSnapshot){
    directMode=prog.reviewSnapshot.directMode;
    prog.directMode=prog.reviewSnapshot.directMode;
    prog.pos=prog.reviewSnapshot.pos;
    prog.directPos=prog.reviewSnapshot.directPos;
    if(prog.reviewSnapshot.studyPos!==undefined) prog.studyPos=prog.reviewSnapshot.studyPos;
    else if(prog.studyPos!==undefined) delete prog.studyPos;
    delete prog.reviewSnapshot;
    if(prog.savedStudyPos!==undefined) delete prog.savedStudyPos;
  }
  reviewMode=false; wrongReviewMode=false;
  if(!directMode) prog.studyPos=prog.pos;  // 保存继续学习进度
  directMode=true;
  prog.directMode=true;
  if(!prog.difficult) prog.difficult=[];
  if(!prog.directPos) prog.directPos=0;
  queue=Array.from({length:DATA.length},function(_,i){return i;});
  dayLength=queue.length;
  prog.mode='free';
  prog.pos=Math.min(prog.directPos, queue.length-1);
  document.getElementById('wlPanel').classList.remove('show');
  document.getElementById('donePage').classList.remove('show');
  setActiveNav('navStudy');
  save(LS_PROG,prog);
  render();
  updateMarkBtn();
  if(prog.directPos>0){ toast('接续直接学习进度 · 第 '+(prog.pos+1)+' / '+queue.length+' 词'); }
  else{ toast('从词首开始学习 · 共 '+queue.length+' 词'); }
}

function jumpToWord(idx){
  // 临时查看模式：保存原状态(继续学习/直接学习/复习),完全不影响原有进度
  if(!jumpMode){
    prog.jumpSaved={directMode:directMode,reviewMode:reviewMode,pos:prog.pos,directPos:prog.directPos||0,studyPos:prog.studyPos};
  }
  jumpMode=true;
  directMode=false;
  prog.directMode=false;
  reviewMode=false; wrongReviewMode=false;
  if(!prog.difficult) prog.difficult=[];
  // 构建全量队列(按A-Z顺序),不受学习计划限制
  queue=Array.from({length:DATA.length},function(_,i){return i;});
  dayLength=queue.length;
  prog.mode='free';
  prog.pos=idx;  // 队列是[0,1,2,...],pos=idx即定位到该词
  document.getElementById('wlPanel').classList.remove('show');
  document.getElementById('donePage').classList.remove('show');
  setActiveNav('navStudy');
  save(LS_PROG,prog);
  render();
  updateMarkBtn();
  toast('已定位到: '+DATA[idx][0]);
}
// ================= 哈希路由 =================
function handleHash(){
  const h=location.hash.replace('#','').toLowerCase();
  if(h==='wordlist'){ showWordList(); }
  else if(h==='difficult'){ showDifficult(); }
  else if(h==='wrong'){ showWrongList(); }
  else if(h==='quiz'){ if(!queue.length) buildQueue(); render(); openQuizConfig(); }
  else if(h==='settings'){ if(!queue.length) buildQueue(); render(); openSettings(); }
  else if(h==='direct'){ startFromWordList(); }
  else if(h==='study'){ showStudy(); }  // 明确切回继续学习模式
  else if(prog.directMode){
    // 直接学习模式: 保持当前状态,不切回继续学习(防止studyPos覆盖直接学习进度)
    directMode=true;
    if(!queue || queue.length===0) buildQueue();
    setActiveNav('navStudy');
    render();
  }
  else { showStudy(); }
}
window.addEventListener('hashchange',handleHash);

// 初始化队列（确保 render 时有数据）
if(prog && prog.directMode) directMode=true;
if(!queue || queue.length===0) buildQueue();
handleHash();

// ==================== 测验系统 ====================
let quizState=null;
let _quizType='all', _quizCount=10, _quizMode='choice';

function openQuizConfig(){
  document.getElementById('quizConfig').classList.add('show');
}
function closeQuizConfig(){
  document.getElementById('quizConfig').classList.remove('show');
}
// 配置选项点击
document.addEventListener('click',function(e){
  const opt=e.target.closest('.q-opt');
  if(!opt) return;
  const group=opt.parentElement;
  group.querySelectorAll('.q-opt').forEach(function(o){o.classList.remove('active');});
  opt.classList.add('active');
  if(group.id==='quizTypeOpts') _quizType=opt.dataset.type;
  if(group.id==='quizCountOpts') _quizCount=parseInt(opt.dataset.count);
  if(group.id==='quizModeOpts') _quizMode=opt.dataset.mode;
});

function getQuizPool(type){
  let pool=[];
  if(type==='all'){
    for(let i=0;i<DATA.length;i++) pool.push(i);
  }else if(type==='learned'){
    pool=(prog.studied||[]).slice();
  }else if(type==='hard'){
    pool=(prog.difficult||[]).slice();
  }
  return pool.filter(function(i){return DATA[i]&&DATA[i][2];});
}



function startQuiz(){
  const pool=getQuizPool(_quizType);
  if(pool.length<3){ toast('题库单词不足，至少需要3个'); return; }
  const count=Math.min(_quizCount,pool.length);
  const questions=shuffle(pool).slice(0,count);
  quizState={type:_quizType,count:count,mode:_quizMode,questions:questions,current:0,correct:0,wrongList:[]};
  closeQuizConfig();
  document.getElementById('quizPanel').classList.add('show');
  document.getElementById('quizResult').style.display='none';
  renderQuiz();
}

function renderQuiz(){
  if(!quizState) return;
  const q=quizState.questions[quizState.current];
  const w=DATA[q];
  document.getElementById('quizProgress').textContent=(quizState.current+1)+' / '+quizState.count;
  document.getElementById('quizFeedback').className='quiz-feedback';
  document.getElementById('quizFeedback').textContent='';
  document.getElementById('quizNextBtn').classList.remove('show');

  if(quizState.mode==='choice'){
    // 选择题: 显示单词,4个释义选项
    document.getElementById('quizWord').textContent=w[0];
    document.getElementById('quizWord').style.display='';
    document.getElementById('quizIpa').textContent=w[1]||'';
    document.getElementById('quizIpa').style.display='';
    document.getElementById('quizMeaning').style.display='none';
    document.getElementById('quizSpellArea').style.display='none';
    // 生成选项
    const correctMean=w[2];
    const distractors=[];
    const allIdx=[];
    for(let i=0;i<DATA.length;i++) if(i!==q&&DATA[i][2]) allIdx.push(i);
    const shuffled=shuffle(allIdx);
    for(let i=0;i<shuffled.length&&distractors.length<3;i++){
      const m=DATA[shuffled[i]][2];
      if(m!==correctMean&&distractors.indexOf(m)<0) distractors.push(m);
    }
    const options=shuffle([correctMean].concat(distractors));
    const box=document.getElementById('quizOptions');
    box.innerHTML=options.map(function(m,idx){
      return '<div class="quiz-opt" data-mean="'+esc(m).replace(/"/g,'&quot;')+'" onclick="checkQuizChoice(this)">'+String.fromCharCode(65+idx)+'. '+esc(m)+'</div>';
    }).join('');
    box.style.display='flex';
  }else{
    // 拼写题: 显示释义,输入单词
    document.getElementById('quizWord').style.display='none';
    document.getElementById('quizIpa').style.display='none';
    document.getElementById('quizMeaning').textContent=w[2];
    document.getElementById('quizMeaning').style.display='';
    document.getElementById('quizOptions').style.display='none';
    document.getElementById('quizSpellArea').style.display='';
    const input=document.getElementById('quizSpellInput');
    input.value=''; input.disabled=false;
    input.focus();
  }
}

function checkQuizChoice(el){
  if(!quizState) return;
  const q=quizState.questions[quizState.current];
  const correctMean=DATA[q][2];
  const chosen=el.dataset.mean;
  const opts=document.querySelectorAll('.quiz-opt');
  opts.forEach(function(o){
    o.classList.add('disabled');
    if(o.dataset.mean===correctMean) o.classList.add('correct');
  });
  const fb=document.getElementById('quizFeedback');
  if(chosen===correctMean){
    quizState.correct++;
    el.classList.add('correct');
    fb.className='quiz-feedback ok show';
    fb.textContent='✓ 回答正确！';
  }else{
    el.classList.add('wrong');
    fb.className='quiz-feedback no show';
    fb.textContent='✗ 回答错误！正确答案: '+correctMean;
    if(quizState.wrongList.indexOf(q)<0) quizState.wrongList.push(q);
    // 立即加入错题库
    if(!prog.wrongWords) prog.wrongWords=[];
    if(prog.wrongWords.indexOf(q)<0){ prog.wrongWords.push(q); save(LS_PROG,prog); }
  }
  document.getElementById('quizNextBtn').classList.add('show');
  if(quizState.current>=quizState.count-1){
    document.getElementById('quizNextBtn').textContent='查看结果 →';
  }
}

function checkQuizSpell(){
  if(!quizState) return;
  const q=quizState.questions[quizState.current];
  const correct=DATA[q][0].toLowerCase().trim();
  const input=document.getElementById('quizSpellInput');
  const chosen=input.value.toLowerCase().trim();
  input.disabled=true;
  const fb=document.getElementById('quizFeedback');
  if(chosen===correct){
    quizState.correct++;
    fb.className='quiz-feedback ok show';
    fb.textContent='✓ 拼写正确！';
  }else{
    fb.className='quiz-feedback no show';
    fb.textContent='✗ 拼写错误！正确答案: '+DATA[q][0];
    if(quizState.wrongList.indexOf(q)<0) quizState.wrongList.push(q);
    // 立即加入错题库
    if(!prog.wrongWords) prog.wrongWords=[];
    if(prog.wrongWords.indexOf(q)<0){ prog.wrongWords.push(q); save(LS_PROG,prog); }
  }
  document.getElementById('quizNextBtn').classList.add('show');
  if(quizState.current>=quizState.count-1){
    document.getElementById('quizNextBtn').textContent='查看结果 →';
  }
}

function nextQuiz(){
  if(!quizState) return;
  if(quizState.current>=quizState.count-1){
    showQuizResult();
    return;
  }
  quizState.current++;
  document.getElementById('quizNextBtn').textContent='下一题 →';
  renderQuiz();
}

function showQuizResult(){
  if(!quizState) return;
  // 错题加入错题库
  if(!prog.wrongWords) prog.wrongWords=[];
  quizState.wrongList.forEach(function(i){
    if(prog.wrongWords.indexOf(i)<0) prog.wrongWords.push(i);
  });
  save(LS_PROG,prog);
  const pct=Math.round(quizState.correct/quizState.count*100);
  document.getElementById('quizScore').textContent=pct+'%';
  document.getElementById('quizResultDetail').innerHTML='答对 <b>'+quizState.correct+'</b> / '+quizState.count+' 题<br>错题 <b>'+quizState.wrongList.length+'</b> 道已加入错题库';
  document.getElementById('quizResult').style.display='block';
  document.getElementById('quizWord').style.display='none';
  document.getElementById('quizIpa').style.display='none';
  document.getElementById('quizMeaning').style.display='none';
  document.getElementById('quizOptions').style.display='none';
  document.getElementById('quizSpellArea').style.display='none';
  document.getElementById('quizFeedback').className='quiz-feedback';
  document.getElementById('quizNextBtn').classList.remove('show');
}

function retryQuiz(){
  if(quizState){
    _quizType=quizState.type; _quizCount=quizState.count; _quizMode=quizState.mode;
  }
  startQuiz();
}

function closeQuiz(){
  document.getElementById('quizPanel').classList.remove('show');
  quizState=null;
  if(typeof goHome==='function') goHome();
  else window.location.href='index.html';
}

function showWrongListFromQuiz(){
  // 修复:只关测验面板,closeQuiz()内部goHome会跳首页
  document.getElementById('quizPanel').classList.remove('show');
  quizState=null;
  showWrongList();
}

// ==================== 错题库 ====================
function showWrongList(){
  if(!prog.wrongWords) prog.wrongWords=[];
  if(prog.wrongWords.length===0){
    toast('还没有错题，测验答错的词会自动加入');
    return;
  }
  wlFilter='wrong';
  wlTagFilter='all';
  document.getElementById('wlModeLabel').textContent='· 错题库 ('+prog.wrongWords.length+')';
  document.getElementById('wlSearch').value='';
  document.getElementById('wlPanel').classList.add('show');
  setActiveNav('navList');
  buildLetters(); renderWordList();
}

function startWrongReview(){
  if(!prog.wrongWords||prog.wrongWords.length===0){ toast('错题库为空'); return; }
  reviewMode=true;
  wrongReviewMode=true;
  // 保存完整状态快照(退出复习时完整恢复)
  prog.reviewSnapshot={directMode:directMode,pos:prog.pos,directPos:prog.directPos,studyPos:prog.studyPos};
  directMode=false;
  prog.directMode=false;
  queue=prog.wrongWords.slice();
  dayLength=queue.length;
  prog.pos=0;
  document.getElementById('wlPanel').classList.remove('show');
  document.getElementById('donePage').classList.remove('show');
  setActiveNav('navList');
  save(LS_PROG,prog);
  render();
  toast('错题复习 · 共 '+queue.length+' 词');
}
