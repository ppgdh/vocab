const EXAM_DATA = {"zk1704":{"sections":{"section1":"The Thinking Habit That Changed My Life\n\nI remember one evening three years ago, when my life was very different. I was overweight. I was deeply in debt. I was a smoker. I felt hopeless and helpless. I couldn\u0027t change anything. Then I looked up at the sky and thought what a miracle life is. And I resolved to list the good things in my life. I had a wonderful wife. I had five amazing children. I could see and appreciate the beauty of the world around me. The list went on, but you get the idea. Even when things seemed terrible for me, actually I was OK.\n\nThat night I resolved to be grateful for what I had, and for the people in my life. I started the habit of gratitude. Now many people consider it unimportant. I\u0027m here to tell you that it\u0027s very important. It changes lives.\n\nNow I appreciate my wife even more. I feel good about having her in my life. And we have deepened our relationship. I also appreciate my kids more. Instead of criticizing them, I tend to notice their loveliness, curiosity and humor. To others around me, at work and everywhere else, because instead of seeing the faults in everyone, I see the good, and I am grateful for them. I need less, because instead of thinking about what I don\u0027t have, I am grateful for what I do have. Each and every moment becomes cause for gratitude, and life becomes easier. Without the habit of gratitude, we tend to complain and see the bad in people and things. We can\u0027t change that at once, but you can do something. For example, you can start with a small action. Really feel the happiness that something or someone brings to your life, or take a moment to make a list of the things in your life that you\u0027re thankful for.\n1. I was unhappy with my life three years ago.\nA. True\nB. False\nC. Not Given\n2. I drank every day and couldn\u0027t stop it.\nA. True B. False\nC. Not Given\n3. I was unable to support my family.\nA. True\nB. False\nC. Not Given\n4. One evening I came to a new understanding of my life.\nA. True B. False\nC. Not Given\n5. Many people value the habit of gratitude nowadays.\nA. True\nB. False\nC. Not Given\n6. Now I have a closer relationship with my wife.\nA. True B. False C. Not Given\n7. I am now more strict with my kids.\nA. True B. False C. Not Given\n8. I like making friends with people around me.\nA. True B. False C. Not Given\n9. I now try to see the good in others.\nA. True B. False C. Not Given\n10. A small action doesn\u0027t work to change one\u0027s bad habit.\nA. True B. False C. Not Given","section2":"Dog Training\nDog training is a must for all dogs. It is more than just telling your dog to stop\ndoing what he\u0027s doing; it is the process of teaching a dog to exhibit certain desired\nbehaviors in specific circumstances. Proper dog training is not a \"quick—it is an\nongoing process.\nDog training also involves teaching the owner. Going through dog training is\nsomething that every dog owner should do. It is like going to school over again. It is\nall about communication, and you need to lear to communicate with your dog.\nTraining your dog to \"sit\" is probably the first thing you will train your dog to do.\nWhen you want your dog to sit, hold a treat above his head and say \"sit\". As the dog\nsits, say \"sit\" again and then immediately give him the treat. Your dog should drop\ninto a \"sit\" position in order to reach the food.\nTeaching your dog to fetch promotes bonding. To do this, first throw a ball, and\ngive the command \"fetch\". As he starts to run towards it, yell \"fetch\" again. Instead of\na ball, you may use the object your dog loves most. Do not play fetch with heavy\nitems or sticks, however, as this can damage the dog\u0027s teeth or injure the dog.\nA well-trained dog should remain where his owner commands, so \"stay\" is an\nimportant command in dog training as well. Since it is more involved, that will be the\nsubject of another article.\nDog training is a very physical activity, so be prepared to be tired. And dog\ntraining is never without risk of injury, especially with more aggressive dogs. One\nmajor mistake many dog owners make is to think that the dog training is over.\nTraining your dog continues throughout your dog\u0027s life.\n11. What does the author say about dog training?\nA. It requires professional guidance. B. It is necessary for every dog.\nC. It gives dogs\u0027 good exercise.\nD. It is an easy job for trainers.\n12. What is the most important thing for dog trainers to do?\nA. Lear to communicate with dogs.\nB. Give dogs timely encouragement.\nC. Create right circumstances for dogs.\nD. Teach dogs desired behaviors.\n13. Dog trainers usually train their dogs first to\nA. jump\nB. slay\nC. fetch\nD. sit\n14.To train dogs to fetch, trainers often start with a_\nA. stick\nB. ball\nC. treat\nD. trick\n15. Many dog owners tend to think that dog training _\nA. can be dangerous\nB. costs much money\nC. takes a short time\nD. can be very tiring","section3":"Ancient Greek Values\nAncient Greek civilization has greatly helped the building of today\u0027s society. Many\ncountries now still base their laws and ethics (1 JI) on the teachings and doings of\nancient Greeks. In everyday life, ancient Greeks valued loyalty, glory intelligence and\nhospitality (2f).These may seem simple values, but they did effectively shape\nancient Greece into a most referenced culture in history.\n2 During ancient Greece, men were required to go to school and learn. Boys were\ntaught at home until they were 6\nyears old and then sent off to school Ancient Greek\nschools featured a structure that had boys in school from the age of six until fourteen\nand then an optional additional four years. The boys were trained in arts and in citizen\ntraining. Citizen training prepared Greek boys for two aspects of adult life, which\nwere peace and war.\n3Glory for young men in ancient Greece was the same as fame to young people\ntoday. Stories of war glories and battles were handed down to young men so that they\ndesired to make their names along with the victory of a battle.\nHelping your fellow man was an important aspect oflife in ancient Greece. Ancient\nGreeks were kind and generous. They offered food, shelter and protection travelers\nwithout question. They believed that helping others was their brotherly duty.\n5 Loyalty is perhaps the most important value of ancient Greek civilization. It was\nstressed in everything the Greeks did. They believed in loyalty to the family, the\ncommunity and most importantly to the gods. The gods of ancient Greece often sent\ntests to citizens. Keeping faith through the tests was a sign of loyalty and belief.\n#4F#176F\nTask 1\n\n16. Paragraph O:\n17. Paragraph 2:\n18. Paragraph 3) :\n19. Paragraph 4:\n20. Paragraph 5:\nA. Education in ancient Greece\nB. Friendliness of ancient Greeks\nC. Wars in ancient Greece\nD. Impact of ancient Greek values\nE. Top value of ancient Greeks\nF. Sense of honor of ancient Greeks\nTask 2\n21. Ancient Greek values arc held\n-\n22. Young men in ancient Greece were required\n23. Young Greeks had a strong desire\n24. Ancient Greeks saw it as a duty.\n25. Ancient Greeks stressed loyalty _\nA.to go to school\nB.in many countries\nC.to achieve honor\nD.in whatever they did\nE.to study law\nF.to help others","section4":"The Power of Positive Thinking\nHuman emotion is one of those factors that cannot he defined exactly. The reason\nis that it is quite uncertain. We cannot change the feelings that are roused when we\nexperience different things. 26\nSome people forget that they are in control. They make their choices based on\ntheir emotions. They experience failure and loss and let their emotions rule their\ndecisions. They are trapped in their sadness and thus experience more failure.\nSome people say they need a lucky break to recover from their failures. 27\nThey need to get over their failures on their own. But how do they do that? The\nanswer is: positive thinking.\n$55 $ 1765\nPeople often fail to realize the power of positive thinking. 28 They fail to\nrealize that they only need to overcome their fears in order to truly succeed in life.\nThey just have too much pride and are blinded of their own shortcomings.\nThe power of positive thinking lies in belief. 29 You make the decisions that\naffect your life. You may not be able to change your environment, but you are able to\nchange the way you react to it.\nThe power of positive thinking lies beyond false courage. You need to take\nanother look at the world around you. 30 You can\u0027t rest on your success or foolish\npride will cause you to make wrong decisions.\nA. They fail to realize that their worst enemy lies within themselves.\nB. However, we must always remember that we can control our reactions.\nC. You can\u0027t just take a look at your failures, or you will lose hope.\nD. We can benefit a lot from positive thinking.\nE. However, life rarely gives people a break.\nF. You need to believe that you are in control.","section5":"第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌。\n\n## Meet Famous People in London\n\nMany people like to see famous people. But famous people don\u0027t 31 like to be\nlooked at. At least, they don\u0027t like to be looked at all day every day! However, there is\none 32 in England where you can look at lots of famous people every day. That is\nMadame Tussaud\u0027s, the most popular 33 attraction in London.\nOn most days of the year, 34 of visitors can be seen outside Madame Tussaud\u0027s.\nThey want to 35 in and see some of the most famous people in the world. If you like,\nyou can 36 to those film stars, sports stars or politicians in Madame Tussaud\u0027s, but\nthey won\u0027t 37 anything to you, because they can\u0027t! Madame Tussaud\u0027s is a\nwaxworks (蜡像馆), and the \"famous people, in the building are made out of wax.\nBut, this doesn\u0027t 38 to be a problem. Ordinary people like looking at 39 people, even\nif they are only 40. It\u0027s better than nothing!\n\n|   |   |   |\n|---|---|---|\n| A. seem | E. statues | I. get |\n| B. give | F. tourist | J. rarely |\n| C. place | G. extraordinary | K. say |\n| D. talk | H. lines | L. usually |\n\n第6页共176页","section6":"第六部分:完型补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌。\n\nDon\u0027t Be Afraid of Making Mistakes\nLots of people don\u0027t dare to make mistakes (mistake). They fear that they will be\nridiculed or 41 (blame) by others. They fear that they will lose their money and\nbelongings or be under a lot of stress. But risks are 42 (actual) unavoidable and they\ndo pave the way towards success. Have you ever 43 (hear) of someone who achieves\nsuccess without making any mistakes before?\nSo it is 44 (nature) that making mistakes in your effort to reach your dreams is\n45 (consider) a must, and you shouldn\u0027t worry about that as you may get a lot of 46\n(advantage) out of your mistakes. By making mistakes you then can distinguish\nbetween the correct and the 47(correct) portions of what you did. Anthony D\u0027Angelo\nsaid: \"In order to succeed you must fail, so that you know what to do the next time.\"\nAnd Robert Louis Stevenson even 48 (go) to the extreme as to say: \"Our business in\nlife is not to succeed, but to continue to fail in good 49 (spirit).\"\nYou needn\u0027t worry about anything as long as you keep on going by 50 (wise)\nlearning from your mistakes and trying even harder."},"title":"2017年4月自考英语二"},"zk1710":{"sections":{"section1":"第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。\n\nMy Writing Teacher\nEnglish writing was always easy for me, but that changed on the first day I walked\ninto Mrs. Johnson\u0027s class. Before that, I\u0027d heard rumors from former students. They\nsaid she was strict and her class was hard to pass. So I was very nervous.\nThe first time we met, Mrs. Johnson told us her class would be difficult, but she\nwould give us new \"tools\" and guide us through. She explained that her grading\nsystem was different, and that we would not see high scores soon. \"Everything you do\nin class matters,\" she said. \"As writing is an art, it takes a long time to perfect.\"\nMrs. Johnson scared me. I was afraid of what she would say if I asked a question.\nSo in class I kept silent most of the time and couldn\u0027t follow her. When I got my first\nessay back, my grade was terrible. I was annoyed with Mrs. Johnson. I disliked going\nto her class.\nThen I realized I needed to find out what I could do to improve my grade and how\nto use the \"tools\" in my writing. As I still didn\u0027t dare to talk to Mrs. Johnson in person,\nI e-mailed her. In this way, she and I worked together to improve my writing. By and\nby, I could talk to her both online and in person. She walked me through every step to\nunderstand how to write an essay. Together we saw improvement in my work.\nFrom this I discovered that asking for help could actually\nwork. Behind everything Mrs. Johnson was saying, she actually cared about me and\nwhere I would be in the future. She knocked me down so that I could climb back\nstronger.\n\n1. I was worried when I was in Mrs. Johnson\u0027s first class.\nA. True B. False C. Not Given\n2. Mrs. Johnson used the same grading system as other teachers.\nA. True B. False C. Not Given\n\n第18页共176页\n3. Mrs. Johnson regards writing as an art.\nA. True\nB. False\nC. Not Given\n4. I was active in class in the beginning.\nA. True\nB. False\nC. Not Given\n5. Most students enjoyed Mrs. Johnson\u0027s class.\nA. True\nB. False\nC. Not Given\n6. I got a high score for my first essay.\nA. True\nB. False\nC. Not Given\nA. True\nB. False\nC. Not Given\n7. Mrs. Johnson preferred to email students.\n8. Mrs. Johnson let me improve my writing by myself.\nA. True\nB. False\nC. Not Given\n9. I finally became a top student in the writing class.\nA. True\nB. False\nC. Not Given\nC. Not Given\n10. Mrs. Johnson cared about my future.\nA. True\nB. False","section2":"第二部分:阅读选择(第11~15题,每题2分,共10分)\n阅读下面短文,请从短文后所给各题的4个选项(A、B、C、D)中选出一\n个最佳选项。\n\nThe kilt\nWhenever people from Scotland live in foreign countries, they are always asked:\n\"Is Scotland that place where men wear skirts?\" The short answer is yes, but there is\nmore about the myths of \"Scottish\" skirts.\nThe \"skirt\" that Scotsmen (苏格兰男子)\nsometimes wear is called a kilt. It is\npart of the traditional dress of Scotland. The kilt is clearly very famous across the\nworld. It seems that everybody has heard of it, and that most people have seen a\npicture of a man wearing one. People\u0027s knowledge and ideas about Scotsmen wearing\nthese funny kilts come from films and television. Every time people from other\ncountries ask about the kilt, they mention Mel Gibson\u0027s film, Braveheart. In many\ncountries, there are television programs about Scotland. These programs always\ninclude information or images of men in kilts.\nOf course, in Scotland, you will often see the kilt. The reality is, though, that you\nwill most commonly see it in tourist areas. The main streets and tourist areas\nof Scotland always have a Scotsman wearing a kilt and all tourist shops in the country\nsell kilts in different colors.\nBut kilts are not something that Scottish people see every day. Kilts are for special\noccasions, such as weddings, funerals and other big and important events. Scotsmen\n第19页共176页\ndo not put on their kilt just to buy a bottle of milk and a loaf of bread at the local\nsupermarket.\nThe reason for this may be that kilts are very expensive. When a man wears a\nkilt, he normally wears it with a special shirt, jacket, socks and shoes. This is\nobviously not cheap. In fact, an average kilt outfit (全套服装) costs around £500.\n11. According to the text, Scotsmen\nA. like foreign culture\nB. sometimes wear kilts\nC. enjoy talking about kilts\nD. often visit foreign countries\n12. Mel Gibson is probably a\nA. painter\nB. musician\nC. movie star\nD. fashion designer\n13. In Scotland, kilts are more often seen\nA. in tourist shops\nB. in public schools\nC. on the stage\nD. at local markets\n14. People do not wear kilts every day probably because of their\nA. funny designs\nB. dull colors\nC. poor quality\nD. high prices\n15. This text is mainly about the\nA. history of kilts\nB. production of kilts\nC. myths of kilts\nD. styles of kilts\n","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①⑤段每段选择1个正确的段落大意;(2)从第21~25题\n后所给的6个选项中选择5个正确选项,分别完成每个句子。\n\nA Fighting Lady\nDeborah Sampson was born in 1760. There were many children in her family and\nthey were poor. When Deborah was just a young girl, her father left and went off to\nsea. Being in poor health, her mother could not care for her children. So she sent them\nto live with different relatives, hoping these people would take care of her children.\nYoung Deborah, less than seven years old, had to work for a farmer. On the farm,\nshe learned to ride and hunt. She did housework as well. Life was difficult, but\nDeborah worked hard and grew strong. The farmer had ten sons, and Deborah helped\nto take care of them. In the evening, she had the boys talk about their lessons with her.\nBy this she learned what they leamed. She also borrowed their school books to read\nevery night. When she was 18, Deborah became a teacher.\nSoon after she started her new career, the American revolution began. She wanted\nto fight for her country, but women could not be soldiers at that time. Deborah had a\nplan. She was tall fora woman of that time. She made herself a man\u0027s suit and\nsecretly practiced walking and talking like a man. Finally, she joined the army using\nthe name Robert.\n\"Robert\" was a brave soldier. He fought with courage in every battle, and\nother soldiers respected him. They never suspected that their fellow soldier was a\nwoman. Once he caught a fever and had to go to the hospital. There a doctor found\n第20页共176页\nout that Robert was actually a woman. Deborah then had to leave the army but she\nwas not punished. Some people said she even met General George Washington before\nshe left.\nLater, Deborah married a farmer and had three children. She taught in school\nand gave lectures about her time in the army till retirement. Deborah died at the age of\n66. She was a true American hero.\n\nTask 1\n16. Paragraph ①:\n17. Paragraph ②:\n18. Paragraph ③:\n19. Paragraph ④:\n20. Paragraph ⑤:\n\nA. Deborah\u0027s marriage.\nB. Deborah\u0027s life on the farm.\nC. Deborah\u0027s life after leaving the army.\nD. Deborah\u0027s military life.\nE. Deborah\u0027s joining the army.\nF. Deborah\u0027s family background.\n\nTask 2\n21. Deborah was sent to others home because _______.\n22. Deborah became a teacher by _______.\n23. Deborah went into the army by _______.\n24. Deborah left the army after _______.\n25. Deborah was a hero _______.\n\nA. teaching herself on the farm.\nB. for her unusual courage\nC. a doctor discovered her secret\nD. her family couldn\u0027t support her\nE. dressing and behaving like a man\nF. for her excellent teaching","section4":"第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据\n短文内容将其分别放回原有位置,以恢复文章原貌。\n\nMy Major Problem\nDecision-making is something I struggle with. In fact, I\u0027d rather have someone\nelse make decisions for me.\n\n第21页共176页\nAs I sat in a crowded information session (咨询会) at a college last summer,\nI was again faced with the pressure of making a decision. 26. He then asked each of\nus to give our intended major. I looked at my mother with panic.\n“A major?” I said. “I can\u0027t even decide what socks to wear to school!” I wanted\nto say I was undecided. But as my turn to speak approached, my confidence\ndecreased. 27.\nI watched the girl in front of me. She was searching for some obscure (鲜为人知\n的) major. I realized I couldn\u0027t just say undecided. So, when my turn came, I uneasily\nsaid, “I want to major in business”, I could feel “liar” written all over my face.\n28. I felt ashamed. “Why couldn\u0027t I have said that?” I thought. The admissions\nadviser even said that a lot of people were uncertain. That was why students have to\ndecide until the end of the second year.\nI have no idea what I want to do with my life. All I know is that I don\u0027t want to do\nanything that involves blood. 29.\nThis isn\u0027t really narrowing it down. I\u0027ve been told many people start college with\none major, and graduate with a degree in something totally different.\nAfter my experience at the information session, I\u0027ve learned not to be afraid of\nsaying I\u0027m “undecided.” I know now that I am not the only one uncertain\nabout future studies. I\u0027m still experiencing a “major” problem. 30.\n\nA. Everyone before me had declared a major.\nB. So I\u0027ve narrowed my list down to anything but medicine.\nC. The admissions officer asked us to introduce ourselves briefly.\nD. In the end, only one brave person said she was undecided.\nE. Admissions advisors help you to make decisions.\nF. However, I\u0027m confident I\u0027ll find a solution.","section5":"第五部分:填词补文 (第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌。\n\nChoosing Friends\nIn our daily life, it\u0027s nice to have friends, while family is 31 important; friends\nare a different support system of your choosing. As the 32 goes, “You can\u0027t choose\nyour family, but you can choose your friends. Choosing them wisely can 33 your life\nmore exciting and inspiring.\nDeciding whom you choose as your friends says as much about you as it does\nthem. You may choose your friends 34 on similar interests. You may choose them\nbecause you\u0027re opposites of each other and find this interesting. Often, friends become\n“friends” because they are naturally attracted towards each other due to 35\npersonalities. Sometimes it\u0027s just circumstances that bring two individuals together\nwho then become friends.\nWhatever prompts a friendship, developing one is a very 36 experience. This is\n\n第22页共176页\nespecially true when, before you know it, a certain 37 turns into a unique lifelong\nclose friendship. Again, it\u0027s been said that a person 38 has only a couple of very close\nfriends in their life. Think of whom you 39 as truly close friends. These arc those few\nindividuals you can 40 and share deep thoughts and concerns with.\n\n|   |   |   |\n|---|---|---|\n| A. saying | E. trust | I. speech |\n| B. make | F. relied | J. rewarding |\n| C. normally | G. consider | K. based |\n| D. similar | H. relationship | L. extremely |","section6":"第六部分:完型补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌。\n\nBats\nMany people think bats look frightening (frighten). But research has 41 (show)\nus that bats are kind animals. The way they live 42 (provide) a great deal of help to\nhumans and other 43 (live) things.\nBats are gentle and loving. Mother bats sleep with their wings around their 44\n(baby) to protect them, and will move them to 45 (safe) if they seem to be 46\n(threaten) in any way. Just like other animals, adult bats help their children find\n47(suit) food to eat.\nBats are 48 (help), too. Some bats eat insects. Just one brown bat can eat 49\n(near) 600 insects in one hour! Besides, many species are even dependent on bats for\ntheir 50 (survive). Therefore, bats are really friendly animals!"},"title":"2017年10月自考英语二"},"zk1804":{"sections":{"section1":"Life on the Farm\n\nLife on a farm is always changing. New technologies and a rising interest in healthier and organic eating have had a huge impact on how farms do business. At the same time, a growing population has put more demands on farmers. They need to find ways to increase their production levels. The small family farms that used to produce most of the products have been largely replaced by factory farms. Small family farms that are still operating are struggling to keep up.\n\nTechnology has made most aspects of farm life easier than it has ever been before. Bigger and more efficient equipment makes work such as plowing up fields and sowing the seeds easier. Such tasks used to take two or three times as long. These advances have allowed farmers to work faster and more efficiently than ever before.\n\nIn addition to newer technology, factory farms produce more products for less money than traditional farming would require.\n\nModern farm life, despite the introduction of new technologies, has not changed much from what it has always been. Farmers still wake up early, and spend their days doing hard work. There are still animals to feed, cows to be milked, and fields to be plowed. Farm life still requires a lot of hard work and sacrifice.\n\nThe main change in modern farm life is in the way farms are run. It is common for even small farms to have several hired workers and even an animal manager. Family farms are becoming rare. Factory farms, with other large farm corporations, are becoming the norm. Although there are still many traditional family farms, they are quickly disappearing as modern practices change farm life forever.\n1. Factory farms now produce most of the products.\nA. True\nB. False\n2. Farmers prefer to grow healthy and organic food.\nA. True\nB. False\nC. Not Given\nC. Not Given\n3. Small family farms find it hard to survive.\nA. True\nB. False\nC. Not Given\n4. Plowing and sowing by machines are advances in modem farming.\nA. True\nB. False\nC. Not Given\n5. Moder farm products cost more than those from traditional farming.\nA. True\nB. False\nC. Not Given\n6. Most farmers cannot afford new machines.\nA. True\nB. False\nC. Not Given\n7. Moder farmers do not have to work hard\nA. True\nB. False\nC. Not Given\n8. New technologies have not changed farm management\nA. True\nB. False\nC. Not Given\n9. There are fewer and fewer family-run farms now.\nA. True\nB. False\nC. Not Given\n10. Modem farms are hiring workers from cities.\nA. True\nB. False\nC. Not Given","section2":"Christmas Gift\nMary didn\u0027t know what to send to her grandparents for Christmas. It was always\nhard to choose a good Christmas present for them. They didn\u0027t need much, and it was\nhard for her to be creative every year.\nOne year, she sent them a big wooden elephant. It sat on the counter for a year,\nbut then it disappeared, probably into a closet somewhere. Another year, she made\nhandmade soaps with nice smells, but they probably weren\u0027t any better than\nstore-bought soaps. Last year, she sent lots of nice pictures of herself in frames, but\ngrandparents\u0027 house was small, and they couldn\u0027t hang up very many.\nThis year, she decided on fruit. She lived where it was warm and there was lots\nof nice fruit. Her grandparents lived up north, where it was colder and they couldn\u0027t\nget fresh fruit all year, or at least not oranges and grapefruit. Fresh fruit was healthy\nfor her grandparents, too.\nMary went to a fruit store and sampled the red oranges. She really liked them and\nbought a kilogram. Then she tried three kinds of grapefruit. The white ones were sour.\nThe star grapefruit were interesting, but the dark red grapefruit were great. So she got\na kilogram.\nMary carefully packed the fruit in a box to keep them safe and dry in case one\ngot smashed and its juice got everywhere. Then she wrote the address on the box and\nmailed it from the store. She felt happy with what she bought.\nA few days later, Mary got a phone call from her grandparents, thanking her for\nthe lovely fruit. They said it was a healthy, tasty, and very thoughtful gift. Mary had\nnever felt so good before.\n11. Mary was troubled because she\nA. had no idea for a holiday gift\nB. was not creative in her work\nC. could not afford Christmas gifts D. found her grandma hard to please\n12. What did Mary send her grandparents last year?\nA. A wooden elephant.\nB. Handmade soaps.\nC. Her own pictures.\nD. A store-bought closet.\n13. In selecting the gifts, Mary was\nA. excited\nB. impatient\nC. exhausted D. thoughtful\n14. Which of the following did Mary buy for her grandparents this year?\nA. Yellow oranges.\nB. Dark red grapefruit.\nC. White grapefruit\nD. Star grapefruit.\n15. Mary\u0027s grandparents,\nA. loved her gift\nB. sent her a card\nC. wrote her a letter\nD. put her gift away","section3":"Team work in sports\nTeams that win in team sports are often those that work well together. Leaming to\ncooperate with others towards a common goal in sports is what builds character,\nfriendship and important life skills for players.\n2) Working towards a common goal will keep the team firmly together. Entering into\na new season in sports, you might only know a few of the players on your team. Some\nof the players may be people you do not like. But when your team decides to be the\nwinner of the season, personal differences are often set aside for the common good of\nthe team. By the end of the season, players who have fought through the whole season\nmay become good friends, much like brothers.\n3) For kids and young adults, team sports offer a way for them to get out and meet\nwith friends. This can help them avoid spending too much time at home watching\ntelevision and playing video games. Team work teaches people how to help each other\nand encourage each other. It can also give players a greater respect for one another\nand can build friendships that last a lifetime.\n•Team work in sports offers a way for people to compete for something together. It\nis important to know that winning is not everything in sports and healthy competition\ncan be good for people. Working towards a goal can teach people the value of hard\nwork, commitment and devotion. Team sports are a great way to leam these values.\n•Team work in sports can help young people develop stronger communication skills.\nAs every member must work for the same goal, they leam hor to work with one\nanother successfully.\nTask 1\n\n16. Paragraph O:\n17. Paragraph 2:\n18. Paragraph 3:\n19. Paragraph :\n20. Paragraph S:\nA. The common goal\nB. Healthy competition\nC. Team cooperation\nD. Exercising and friendship\nE. Problems between team members\nF. Building communication skills\nTask 2\n21. Cooperation in team sports help build_\n22. When your team decides to win the season, you set aside\n23. In team sports, kids learn to\n24. In team sports people lear the value of\n25. A long-lasting friendship can be built\nA. set a goal\nB. character\nC. help each other\nD. in team sports\nE. your personal differences\nF. hard work and devotion","section4":"Homeschooling vs School\nMany kids find it hard to concentrate in school. Classmates, bells, and even\ncheerful decorations in school can make it hard for some children to concentrate. 26\nIn some schools, conditions are bad for children\u0027s safety and health. 27\nHomeschooling parents can control their children\u0027s environment to make sure it is\nsafe and healthy.\nWhen students sit in a classroom surrounded by classmates, under the tight\ncontrol of adults, they find it very hard to function in a normal way. Homeschooling\nchildren don\u0027t have to stay in the school. 28 They can interact with people in familiar\nsituations, and they feel they can interact with people as adults.\nSchool bullying (235 35) is a serious problem. 29 Although schools are\nstarting to deal with this problem, many kids are still afraid of going to school.\nHomeschooling kids can choose who they associate with and walk away from an\nuncomfortable situation.\nSchools are cutting field trips. 30 On the contrary, homeschooling can move\noutdoors, to the beach or the zoo. For homeschooling families, the whole world is a\nclassroom. Leaming takes place everywhere and it never ends.\nA. Instead, they are out in the community.\nB. In this case, homeschooling offers fewer interruptions.\nC. Children usually sit at desks or around the kitchen tables.\nD. Some children do not treat their classmates appropriately.\nE. Many students go to class in old or poorly-designed buildings.\nF. Even a short trip to the countryside is controversial in some places.","section5":"Planting potatoes\nWhen I was a boy we had several gardens around our old house. The largest one\nof all was used just for growing potatoes.\nI can still remember those potato planting days. All the family 31 helped. After\nmy Dad had 32 the soil, my Mom, brothers, and I went to work. It was my 33 to drop\nthe little seed potatoes in the 34 while my Mom dropped handfuls of fertilizer beside\nthem. My brothers then covered them all with the 35 turmed earth.\nFor months 36 I would glance over at the garden while I played outside and\nwonder what was going on undemeath the 31. When the harvest time came I was\namazed at the huge size of the potatoes my Dad 38 out of the soil. Those little seed\npotatoes had grown into big potatoes. They would be turned into meal after meal of\n39 food. They would keep the 40 family well fed throughout the whole year. It truly\nwas a miracle.\nA. true\nB. ground\nC. members\nD. job\nE. delicious\nF. prepared\nGrows\nH. afterward\nI. freshly\nJ. entire\nK. tools\nL. pulled\n# 38 # 176F\nWorkplace English learning\nEnglish plays","section6":"(play) an important role in the workplace. When 41 (use) correctly\nand appropriately, it will be 42 (help) in developing a career or a business. Some may\nneed or want to study business English before they start their 43 (career). Those who\nare already 44 (work) have the opportunity to see what they can and cannot do 45\n(effective) with English in their current job.\nA 46 (value) skill to have in business is how to negotiate. You need to know what\nyou want, as well as how to bargain and make concessions (iL*F). Being able to deal\nwith a conflict and 47 (know) how to end negotiations can make a big 48 (different) to\nthe outcome.\nWorkplace English leaming will encourage 49 (profession) and efficient\ncommunication. It can better serve customers, business partners and 50 (supplier), and\nit will be a positive push for any business.\n* 0051(5120,3053)"},"title":"2018年4月自考英语二"},"zk1810":{"sections":{"section1":"*a (=)\n(i*E/7:00015)\nThe British Summer\nBritain is well known for its rainy climate. People joke that even in the summer\ntime the country never gets any sun and that the skies stay disappointingly grey even\nduring the months of July and August.\nLast summer though, it was so hot that people could hardly believe it. British\npeople weren\u0027t used to such high temperatures,so every day on the news there were\nstories about people struggling to work in such unusual weather conditions Radio and\ntelevision programmes also reminded everyone to drink more water and not to stay\ntoo long in the sun.\nWhen the sun comes out,British people tend to spend time in their garden if they\nhave one. It\u0027s common to invite friends and neighbours around for a barbecue, where\neveryone sits outside and eats food like grilled meat (*$*) and salads.There\u0027s always\na back-up plan in case of rain though, and the meal sometimes has to be cooked in the\nkitchen and eaten indoors.\nPeople also spend a lot of time in parks during the summer, having picnics or\nplaying sports. In every green area, there\u0027s always at least one ice cream van, a kind of\ncar that plays children\u0027s music and sells ice creams.\nTowns like Blackpool and Brighton are popular for their beaches and amusement\narcades\n(itt) People go there to sivim, sunbathe and eat fish and chips. The\nwater can be quite cold, though, and that\u0027s why quite a lot of people prefer to go\n5 51 F # 176 F\nabroad for their summer holiday instead. Popular destinations include Spain, Germany\nand France: all countries that promise a lot of sunshine!\n1. There is little sunshine in Britain in summer.\nA. True\nB.False\n2. British people like to tell jokes about each other.\nA.True\nB. False\nC. Not Given\nC. Not Given\n3.It was unusually hot last summer in Britain.\nA. True\nB. False\nC. Not Given\n4. British people enjoyed the high temperatures of last summer.\nA.True\nB. False\nC. Not Given\n5. The media advised people to enjoy the sunshine.\nA.True\nB. False\nC. Not Given\n6. Most British people have a garden of their own.\nA. True\nB.False\nC. Not Given\n7.People having a barbecue often have a plan against the rain.\nA.True\nB.False\nC. Not Given\n8. Children like the music from the ice cream vans.\nA.True\nB.False\nC. Not Given\n9.Blackpool and Brighton are known for their beaches.\nA.True\nB.False\nC. Not Given\n10. People go to Spain in summer to enjoy the cooler sea water.\nA. True\nB.False\nC. Not Given","section2":"Horse Talk\nDo you know horses talk? You can lear to understand \"horse talk\u0027if you pay\nclose attention to them.\nWhen horses live in the wild, other animals try to eat them, so a lot of horse talk\nis about staying alive. Even now, when most horses live on farms, they watch for\ndanger. For this reason, never walk behind a horse. If you surprise it, the horse might\nmistake you for a lion or wolf and give a dangerous kick.\nBy watching the ears, you can get clues to what the horse is hearing. A horse can\ntur each ear in a different direction. For a wild horse, this skill is important for\nsurvival. The horse can hear something creeping up behind it while also checking out\na threatening noise in front. When a horse lets its ears down, it\u0027s feeling safe and\nrelaxed. Though these actions may be natural responses and not deliberate\ncommunications, they help you know what the horse is thinking.\nSometimes horses can send definite messages. For example, they know they are\nsafer when they\u0027re with other horses. If they become isolated, they\"whinny (0499),\n\"calling for company. They\u0027re saying. \"Where are you? I\u0027m over here!\"Domestic\nhorses use the same sounds to stay in touch with other horses.\nIf a horse snorts (FT *)L) , it\u0027s not communicating anything.It\u0027s just clearing\ndust or grass seed out of its nose But if it snorts while holding its head high and\nstaring at something, it\u0027s saying. \"That looks dangerous. Get ready to run!\"When two\nhorses meet, they put their noses together and smell each other\u0027s breath. It\u0027s their way\nof asking, \"Are you a friend?\u0027Horses also\"blow, \"breathing out the air loudly through\nthe nose, when they meet something strange. They are asking, \"Is this safe?\"\nHorses have a language of their own. Now you know a bit of what they might be\nsaying!\n11. Horses in the wild \"talk\" mainly to\nA.stay alive\nB. make friends\nC. find food\nD. keep awake\n12. It is dangerous to\nA. touch a horse\u0027s ears\nB. ride a horse on farms\nC. surprise a horse from behind D.stare at a horse from front\n13. A horse\u0027s ears are special because they can_\nA.send messages\nB. tur to different directions\nC. sense temperatures\nD. clear out the dust\n14. When a horse\u0027s ears are down, weknow that it is_\nA. isolated\nB. relaxed\nC.angry\nD.anxious\n15. From the text, we know that horses\nA. are dangerous animals\nC. prefer to stay in groups\nB. can hardly survive in the wild\nD. have different language systems","section3":"# 53 # 176F\nHawaii, the Aloha State\n(Hawaii is sometimes called\"the Aloha State.\"Aloha is a word in the Hawaiian\nlanguage meaning love and peace. It is often used as a way to\nsay\"hello\" or\" goodbye. \"Hawaii is like the word aloha, because it is a state that has two\nviewpoints: it remembers its history and looks toward the future.\n¿Hawaii is a U.S.state made up of a group of islands in the Pacific Ocean.It is\nmade up of eight large islands and over 100 other smaller islands. It is the only state\nthat is not in North America. The islands were formed by volcanoes that erupted (Uf\nB) and rose above the ocean. There are still active volcanoes in Hawaii.\nBecause of its location, Hawaii has a tropical climate.It is warm, but usually\nnot hot, all year long. Rarely does the temperature drop below 60 degrees Fahrenheit\n(17 [E), although it may occasionally snow at the top of some of the mountains.\n4) Once called the Sandwich Islands by Europeans, Hawaii is thought to have\nbeen settled by ancient sailors from other islands in the Pacific. The British explorer\nCaptain Cook was thought to be the first European to find the islands in 1778.\nBecause of its location. Hawaii became a frequent stop for European traders and ships.\nHawaii was an independent country before it became part of the United States in\n1893.It was governed by either a king or a queen. It is one of the only four U.S. states\nto have been a country before statehood.It was admitted into the Union in 1959 as the\n50th state.\nToday Hawaii is important as a vacation destination. Each year over 6 million\npeople visit Hawaii to enjoy the beaches, the beautiful ocean, and the historical\nHawaiian culture. Come and visit Hawaii. You are sure to love it!\nTaskl\n\n16. Paragraph D:\n17. Paragraph 2):\n18. Paragraph 3):\n19. Paragraph 4:\n20. Paragraph 5:\nA. Mild climate\nB. Local customs\nC. Tourist attraction\nD. Long history\nE. Meaning of Aloha\nF. Geographic features\n# 54 #176\nTask2\n21. Aloha is often used as\n22. Hawaii islands are formed by_\n23. Visitors can see snow on\n24.Hawaii used to be ruled by_\n25. People visit Hawaii for_\nA. European explorers\nB. mountain peaks\nC. its scenery and culture\nD. volcanic eruptions\nE. a way of greeting\nF. a king or a queen","section4":"George Washington Carver\nGeorge Washington Carver was bor in Missouri between 1861 and 1864.He was\nborn into slavery. It was not until the end of the Civil War that George became fee.As\nhe grew up, George loved to read and lear. Black children were not allowed to go to\nthe same schools as white children. 26 Every early morning, he left home to go to the\nschool. There he studied very hard.\nAfter he finished high school, George wanted to go to college. At that time, few\nblack students could afford the college tuition (*#) He worked for a time until he\ncould borrow money to go to college. In 1890 he went to Simpson College in Iowa.27\nHis drawings of plants were so good that his teacher suggested he study botany, which\nis the science of plants. George went to an agricultural college in Iossa in 1891, where\nhe not only graduated but also taught students.\nGeorge continued to study plants. 28 In 1896, he was invited to teach at the\nTuskegee Institute in Alabama. He worked there as a professor for 47 years. He also\nbecame an important research scientist. He discovered new ways to use plants. 29\nThese include dyes, plastics, paint, and make-up. He also taught farmers how to grow\ncrops to help the soil, and new ways to farm.\nIn 1943 George Washington Carver died. 30 There is a national monument to\nhim in Missouri where he grew up He has had a ship named after him. In 1990 he was\nadmitted to the National Inventors Hall of Fame. The boy who wanted to leam\nbecame a great inventor and scientist.\nA. There he studied art and music.\nB. He found about 100 new ways to use peanuts.\nC. He has been honored all over the world for his achievements.\nD. He became very famous for his work.\nE. After graduation, George began working for a law firm.\nF. The schools for black children were far from where George lived.","section5":"Warmth at Midnight\nCanberra winters are extremely cold, and 2014 brought some of our coldest days.\nOne weekday night I walked to the 31 supermarket before it closed at midnight.\nAs I approached, I noticed a group of six or seven people 32 by the supermarket\nentrance. Aware of the 33 of late-night walking, I made sure I paid attention. The\nscene ahead looked unusual.\nAnd unusual it was.Expecting to see a group of 34 troublemakers,I found a\nweak, well-dressed old man distributing items of food to a group of homeless people.\nRather than just feeding them, he was also engaging them in a 35 of warm\ndiscussion.\nThe homeless people were rough-looking and 36 dressed. But they listened to\nthe man 37, not just with gratitude for the food they had been 38. With no charity\nvehicle in sight, this old man was only representing himself\nAfter I finished shopping, the group was still there, food 39, but all laughing. If\na weak old man can give to others in the 40 cold at midnight, what excuse do we\nhave?\nA dangers\nB.local\nC.happy\nDreading\nE. freezing\nF. attentively\nK. consumed\nH. sitting\nI poorly\nJ. given\nG. potential\nL. circle\nKeeping Friendship Alive\nIt\u0027s so easy to take good friends","section6":"(friend) for granted Like a 41 (comfort) pair\nof gloves, old friends wear well. But friendships that suffer from busyness and 42\n(familiar)can\u0027t afford to be neglected too long. They need to be 43_ (renew).If you\nwant and need to keep true friendship alive and 44 (health), please consider and\nthink over a list of the most important qualities. 45 (Probable) it will help you to\nunderstand why you and your best friend haven\u0027t 46 (call) up for ages, why you\u0027re\ngetting embarrassed while 47 (be) asked\" Whom are you 48 (go) to have fun with\nthis weekend?\"You may neglect your intimate friends from time to time, but if you\nfail to cultivate these 49 (virtue) —loyalty, forgiveness, dedication (*li) ,\nand 50 (honest) you can\u0027t expect to keep true friends."},"title":"2018年10月自考英语二"},"zk1904":{"sections":{"section1":"My Brother\n\nMy brother is away at college, and at age 14, I miss him terribly. My brother is a rare kind of guy. He\u0027s smart and kind. And my friends say he\u0027s lovely. But it\u0027s how he handles things and how he treats his friends and his family that make me feel more proud. He applied to 14 colleges. He was accepted by all but one, the one he wanted, Brown University. So he took his second choice, and off he went to a first year. When he came home for summer vacation, he said he\u0027d move to Rhode Island near Brown, find a job, and do whatever he could to become known in the area. He\u0027d work his heart out and do his best at everything. Someone, he was sure, would notice. This was a big deal for my parents as it meant agreeing to a year without college. But they trusted him and encouraged him to do whatever he thought it would take to realize his dream. It wasn\u0027t long before he was hired as an amateur (业余的) play director at Brown. Now was his chance to shine, and shine he did. He put every bit of himself into the job. He met teachers and school officials, talked to everyone about his dream, and never hesitated to tell them what he was after. And, sure enough, at the end of the year, when he reapplied to Brown, he was accepted. We were all happy, but for me the happiness went very deep. I had learned an important lesson—a lesson no one could have taught me with words. If I work hard for what I want, and if I keep going after I\u0027ve been turned down, my dreams can also come true. This is a gift I still hold in my heart.\n1. My brother had many good qualities.\nA.True\nB. False\nC. Not Given\n2. Only one university accepted my brother.\nA.True\nB. False\nC. Not Given\n3. My brother\u0027s first year at college was terrible.\nA.True\nB. False\nC. Not Given\n4.My brother would like to find a job in Rhode Island.\nA.True\nB. False\nC. Not Given\n5. My parents disagreed with my brother\u0027s plan.\nA.True\nB. False\nC. Not Given\n6. My brother took every opportunity to promote himself.\nA.True\nB. False\nC. Not Given\n7.My brother never told anyone what he was after.\nA.True\nB. False\nC. Not Given\n8. My brother applied to Brown University three times.\nA.True\nB. False\nC. Not Given\n9. My brother set a good example for me.\nA.True\nB. False\nC. Not Given\n10.I wanted to go to college, too.\nA.True\nB. False\nC. Not Given","section2":"Garlic (大蒜)\n\nGarlic has a long history of human use of over 7,000 years. It was originally\ngrown in Asia. It finally made its way to Europe and South and North Americas in the\n16th century. It rapidly spread to the world because it was easy to grow and could stay\nalive in poor conditions.\n\nGarlic has also long been used in medicine. Egyptians fed garlic to the slaves to\nkeep up their strength and to defend against diseases. The Romans believed that garlic\ncured many diseases and helped heal wounds. Greeks gave garlic to athletes during\nthe Olympic Games in order to increase their strength.\n\nMore recently, garlic has been mentioned as being used as a treatment for battle\n\n第69页共176页\nwounds in both World Wars. In fact, even today people eat garlic for its supposed\nbenefits. For example,many people eat garlic to help fight colds and coughs. Some\neven claim that garlic can help prevent high blood pressure and cancer.\nA different use for garlic in the past was to keep away bad spirits. In some\ncountries, people believed that if they wore garlic around their necks, bad things\nwould not enter their bodies. And if they hung garlic outside the doors of their homes,\nbad things would go away.\nGarlic is now grown everywhere in the world. China is the largest producer of\ngarlic, followed by India, South Korea, Egypt and Russia. The popularity of garlic has\nincreased over the years. It is now widely used in all types of cooking. Chinese dishes\nuse garlic. Italian dishes include a lot of garlic, too. Garlic is now highly valued for its\ntaste throughout the world.\n11. Garlic was first grown in\nA. North America\nC. Europe\nB. South America\nD.Asia\n12. Garlic was quickly accepted by people everywhere because it was\nA. simple to cook\nC. good for health\nB. easy to grow\nD. tasty in many dishes\n13. Ancient Greeks believed that garlic can help\nA. cure many diseases\nC. increase body strength\nB. heal battle wounds\nD. keep people healthy\n14. Some ancient people hung garlic outside their doors to\nA. frighten bad spirits\nC. keep away insects\nB. decorate their houses\nD. show their wishes\n15. The largest garlic grower in the world now is\nA. Egypt\nB. Korea\nC. China\nD. Russia","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①⑤段每段选择1个正确的段落大意;(2)从第21~25题\n后所给的6个选项中选择5个正确选项,分别完成每个句子。\nEasy Ways to Green up Your Life\n①Eating meat produces greenhouse gas emissions(排放) If you can\u0027t give up\n第70页共176页\nmeat completely, you can reduce your consumption or give up beef. Don\u0027t eat\nout-of-season farm products. They are grown in greenhouses. A lot of energy goes into\nheating the greenhouses. And shipping such out-of-season farm products by air from\nremote places consumes huge amount of energy, too. Just look for local and in-season\nfoods.\n②Spend less time behind the wheel, cycle and walk more, and use public\ntransport more. If you have to drive, the first thing is to choose a car that uses\ncomparatively less fuel. Besides, stick to the speed limit, keep your tires properly\nfilled with air, empty your trunk of heavy items, and accelerate and brake gently.\nWant to take a vacation trip by plane? Don\u0027t hurry. Think again. Air travel has\na big impact on the environment compared with most other forms of travel. You have\nbetter choices. Consider having a vacation within driving distance. Of course, taking\nthe train is the best choice.\nThink about how much \"stuff\"you own. A big part of emissions are linked to\nour consumption. To reduce it we need a change in consumption culture. Do we really\nneed all the things we buy? And do we always need the newest one? Getting fewer\nthings and making the ones you own last longer will reduce energy use.\nYour choices about heating and cooling your home are some of the most\nimportant things you can do in terms of cutting your greenhouse gas emissions.\nKeeping the temperature a little lower in the winter and higher in the summer can\nmake a big difference.\n\nTask 1\n\n16. Paragraph ①:\n17. Paragraph ②:\n18. Paragraph ③:\n19. Paragraph ④:\n20. Paragraph ⑤:\n\nA. Change your shopping habit\nB. Drive less if possible\nC. Take fewer air trips\nD. Use air-conditioning moderately\nE. Take fewer vacations\nF. Eat less meat and more in-season foods\n\n第71页共176页\nTask2\n21.Eating beef can.\n22. One is advised to remove heavy things.\n23. One had better take a train\n24. Buying less is one way to\n25. To save energy, properly control\n\nA. from his car trunk\nB. your room temperature\nC. for a vacation trip\nD. increase greenhouse gas production\nE. reduce energy use\nF. your water consumption\n\n第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据\n短文内容将其分别放回原有位置,以恢复文章原貌。\n\nA","section4":"第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据短文内容将其分别放回原有位置,以恢复文章原貌。\n\nA Lucky Pen\n\"Mommy, I\u0027ve got something for you!\" George ran through the door after school one day. He waved something above his head. \"See, it\u0027s a lucky pen!\" 26 I looked at the pen in my hand. There was nothing special about it. But I didn\u0027t realize how special it was at that moment.\nI had made the decision to pursue a career in writing. 27 I had dreamed about it for a long time but I was afraid to take a chance. I was scared of rejection.\nThe night before, I had voiced those fears to my husband when I thought George wasn\u0027t listening. But George must have overheard us. Now he stood in front of me, watching me examine the pen. \"You don\u0027t have to be scared now,\" he said. \"This pen will make your stories great and everyone will love you.\" Tears filled my eyes. 28 Rejection didn\u0027t seem like such a big deal any more. Even if I never sold the first story, I had everything I could ever need. George in my life!\nI found out later how lucky I was when I heard what he did to get the pen. During lunch break at school that day, George heard a boy talking about a lucky pen he had. 29 The boy was a tough negotiator but George didn\u0027t give up. In the end, he traded his lunch, his favorite cartoon book, and his new football, his most prized possession for that pen. Just to make me feel better.\n30 It never fails to remind me just how lucky I am! I am the luckiest mother in the world now and forever.\n\nA. He got it as a birthday gift.\nB. It was a decision full of fear and anxiety for me.\nC. He wanted to get it for me.\nD. He handed me the pen happily and proudly.\nE. I grabbed him and pulled him tight against me.\nF. I still have that pen, though it\u0027s long out of ink.","section5":"Tears filled my eyes. 28\nRejection didn\u0027t seem like such a big deal any more. Even if I never sold the first story,\n\n第72页共176页\nI had everything I could ever need. George in my life!\nI found out later how lucky I was when I heard what he did to get the pen.\nDuring lunch break at school that day, George heard a boy talking about a lucky pen\nhe had. 29 The boy was a tough negotiator but George didn\u0027t give up. In the end, he\ntraded his lunch, his favorite cartoon book, and his new football, his most prized\npossession for that pen. Just to make me feel better.\n30 It never fails to remind me just how lucky I am! I am the luckiest mother in\nthe world now and forever.\n\nA. He got it as a birthday gift.\nB. It was a decision full of fear and anxiety for me.\nC. He wanted to get it for me.\nD. He handed me the pen happily and proudly.\nE. I grabbed him and pulled him tight against me.\nF. I still have that pen, though it\u0027s long out of ink.\n\n第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌。\n\nYoung Readers, Tomorrow\u0027s Leaders?\nA new study has good news for kids with strong reading skills. Such kids will\nhave high intelligence as they get 31. They will have a bright future.\nThe study included 1,890 twins who did reading tests at 32 7 and 12, and an\nintelligence test at 16.The twins had the same genes (基因) and home environment.\nTherefore, the 33 between them had to be due to factors that they did not 34.\nFor example, one had a better teacher than the other. Some kids did better on the\nreading 35 than their twin brother or sister. They 36 did better on the\nintelligence test. The reading skills 37 to enhanced intelligence were evident by age\n7. This shows that reading skills can 38 a child\u0027s intellectual development.\nThe study also helps to 39 the differences among kids in the same family.\nThey share genes, 40 conditions and parents. But they can be different in\nintelligence.\n\n第73页共176页\nA. also\nE. tests\nI. share\nB. differences\nF. affect\nJ. older\nC. only\nG. ages\nK. related\nD. explain\nH. living\nL. interested\n\n第六部分:完型补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌。\n\nStudent Loans\nFederal Student Aid is an office providing","section6":"(provide)student loans for higher\neducation. The U.S.government knows the 41 (important) of higher education in\npositively 42 (impact) the nation.It makes sure that each_43_(qualify)student in\nAmerica is able to get 44 (finance) help for higher education.\nThough parents can choose private funding through 45 (bank), the interest\nrates can be 46 (excessive) high. On the other hand, the interest rates of federally\nfunded student loans are much less in 47 (compare). It is, therefore, very important\nthat parents take all steps 48 (require)to apply for student loans through the\ngovernment.\nFederal Student Aid is involved in 49 (educate)students and their families on\nthe exact procedures to get student loans. Once the applications are 50 (receive), it\nprocesses them before the start of each school year."},"title":"2019年4月自考英语二"},"zk1910":{"sections":{"section1":"2019年10月高等教育自学考试全国统一命题考试\n英语(二)\n(课程代码:00015)\n第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。\nTo Lease(租赁) or Not to Lease\nPlanning to lease a car because you don\u0027t think you can afford to buy? Think\nagain. Leasing can end up being just as expensive as buying.\nMost people think about leasing because they believe it will cost them less\nmoney. They\u0027re right-it is cheaper, but only in the short term. For example, if you\nwere to lease anew Subaru Forester, you might pay $300 per month for the car. If you\nwere to buy the same car, you would pay about $400 per month. Over a three-year,\nyou would save $3600-a big savings. But after your lease is over, you have to give the\ncar back.\nMany people want to lease because they can drive a more expensive car than\nthey might otherwise be able to afford. For example, if you spend $300 monthly on a\ncar, you might be able to lease a new Ford Explorer. For the same price, you might\nhave to buy a used Explorer, or buy a new but much less expensive model. A lease,\ntherefore, allows you to drive the latest models of more expensive cars. However,\nwhatever car you can afford to buy, you get to keep it, and it will always have a resell\nor trade-in(以新旧换)value if you want to upgrade to a new car later.\nFurthermore, people who lease cars are often shocked by how much they must\npay when the lease is over. Most leases limit you to a certain number of miles. If you\ngo over that, you must pay for each mile. As a result, you may end up paying\nthousands of dollars in mileage(里程) fees. In addition, when you lease you have to\n第85页共176页\npay for regular maintenance and repairs to the vehicle. Since you must return the car\nfinally, you are paying to repair someone else\u0027s car.\nBy now, the benefits of buying over leasing should be clear. Remember:\nwhatever model you can afford to buy, it is yours after you make the payments.\nThere\u0027s no giving back, and that makes all the difference.\n1. People usually think leasing a car can save money.\nA.True\nB.False\nC. Not Given\n2.Leasing a car costs less in the long term.\nA.True\nB.False\nC. Not Given\n3. More people like to lease cars than before.\nA.True\nB.False\nC. Not Given\n4. People can lease a car they cannot afford.\nA.True\nB.False\nC. Not Given\n5. Young people prefer to lease the latest models of cars.\nA.True\nB.False\nC. Not Given\n6. Ford Explorer is the most popular model in the leasing market.\nA.True\nB.False\nC. Not Given\n7. People often pay more than they expect for a lease.\nA.True\nB.False\nC. Not Given\n8. People need to pay for each mile they drive during the lease.\nA.True\nB.False\nC. Not Given\n9. Leasing companies pay for repairs to the leased cars.\nA.True\nB.False\nC. Not Given\n10. The author advises people to buy an affordable car.\nA.True\nB.False\nC. Not Given","section2":"Mental Illness Hits Small Business Owners Hard\nWhile there is a growing focus on mental health in the workplace, there are\nfewer resources and support available to those running small businesses.\nThere are many reasons people choose to have their own business being their\n第86页共176页\nown boss, working on something they love, being able to set their own hours, or\nhaving some control over whom they work with. Yet the reality many small business\nowners face is far less attractive-financial stress, long working hours and unclear\nboundaries between work and family life. And all of these factors can have a huge\nimpact on their mental health.\nLeanne Fawkner is a business owner of an award-winning skin-care range(系列\n产品)。She knows very well the impact that a small business can have on, the mental\nhealth of its owner. When her successful business struggled due to the global financial\ncrisis, she suffered a lot mentally. \"As business slowed, I was more and more affected,\n\"she says. \"I couldn\u0027t separate myself from my business. It was the worst experience\nof my life. I could no longer go to work and was crying all day?\"\nFawkner was diagnosed with depression. She had to take several months off\nwork. Fortunately, her husband was able to keep things going while Fawkner was\nrecovering. She saw a counselor (咨询师)for help and took part in a workplace mental\nhealth promotion program. This program was designed for small to medium business\nowners.\n\"The stories on the DVD in the program were so helpful. I was crying because I\ndidn\u0027t feel so alone. \" For Fawkner, small business owners are overlooked. While\nemployees in larger organizations often have access to employee assistance programs,\nsmall business owners are struggling on their own.\n11. One reason to have one\u0027s own business is that one can have more\nA. flexible working hours\nB. support from others\nC. available resources\nD. life experience\n12. A small business owner usually has\nA. a more colorful life\nB. a bigger profit\nC. less stress from work\nD. longer working time\n13. Fawkner\u0027s business ran into trouble because\nA. it was taken over by her husband\nB. she had a serious mental problem\nC. it was hit by the financial crisis\nD. she started a mental health program\n14. Fawkner didn\u0027t feel so alone because\nA. she had her family around\nB. she could watch DVD at work\nC. others had similar experiences\nD. the counselor was helpful to her\n15. According to Fawkner, small business owners need more\nA. financial aid\nB. technical knowledge\nC. management skills\nD. mental health assistance","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①⑤段每段选择1个正确的段落大意;(2)从第21~25题\n后所给的6个选项中选择5个正确选项,分别完成每个句子。\n\nSecrets for a Happier You\nSome people are naturally blessed with a cheerful character. They spread warmth\nand sunshine wherever they go. They attract people like bees to honey. So what is it\nthat makes these people so different from others?\n①The most important secret to happiness is to be grateful for the good things in\nyour life-whatever may be your financial position. Instead of appreciating material\nwealth, be thankful for the loved ones in your life and enjoy the little pleasures of life\nthat come your way.\n② The next important secret is to develop relationships. Increasing social\ncontacts helps boost brain power. Therefore, work towards improving your\nrelationships and take time off to get in touch with friends. This will lift some burden\noff your shoulders, especially when you share your thoughts and feelings. Socializing\ncan give you an added boost to your moods.\n③ Thirdly, do not hold a grudge(怨恨)against anyone. Instead, learn to be kind,\ngenerous, and forgiving towards others, even to the person who hurt you. Be\nsympathetic and understanding, and try not to criticize others. Focus on the positives\nof a person instead of the negatives, for none of us is bom perfect. It will keep your\nheart and mind free and peaceful.\n④ Besides, involve yourself in some creative process, \" be it dancing, writing or\ndrawing. This can bring out the hidden talent in you to achieve magical happiness. Or\n\n第88页共176页\npick up new skills and feel the great sense of satisfaction by carrying out certain tasks\nwhich you otherwise would never have felt.\n⑤ Finally, follow a daily regular sleep-wake cycle to keep you energetic and\nhappy. Exercise regularly or practice relaxation techniques like deep breathing and\nyoga(瑜伽). Ensure you get eight to nine hours of sleep every day and have a\nwell-balanced diet.\n\n### Task 1\n\n16. Paragraph①\n17. Paragraph②\n18. Paragraph③\n19. Paragraph④\n20. Paragraph⑤\n\n|   |   |\n|---|---|\n| A. | Help people in need |\n| B. | Have a healthy lifestyle |\n| C. | Do something creative |\n| D. | Better your social relationships |\n| E. | Be thankful for what you have |\n| F. | Learn to understand and forgive |\n\n### Task 2\n21. A cheerful character makes you\n22. Enjoy the pleasures of life\n23. Socializing can make you\n24. Try to forgive\n25. Creative activities enable you\n\n|   |   |\n|---|---|\n| A. | more intelligent |\n| B. | even if you a at you did. Robert Stevenson once. Said: \"Our business in\nlife is not to be 48 (success), but to continue to fail in good spirits\"\nYou needn\u0027t worry about anything as long as you keep on going by 49\n(wise)learning from your mistakes and 50 (try)even harder.\n\n##"},"title":"2019年10月自考英语二"},"zk2008":{"sections":{"section1":"第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。\nBicycle Commuting\nI may not be a movie star, best selling author, or millionaire when I grow up, but\none thing I will be known for, at least locally, is commuting by bicycle. I\u0027m sad to see\nhow few people do even though many could. Lots of people eagerly campaign for the\nreduction of greenhouse gases, but by driving cars, they\u0027re still contributing to the\nproblem.\nYou might be picturing me as an extreme environmentalist (环保主义者), but I\u0027m\nnot one of those teenagers who wear shirts that say \"Help save the world: Recycle.\"\nActually, my interest in exercise, health, and fitness led me to cycling.\nCycling can help you lose weight, improve your health, and prevent many\ndiseases. Cycling also carries a relatively low chance of injury. While being good for\nyour body, bicycle commuting is also a great way to cut greenhouse gases. Many\nenvironmentalists recycle, plant tees, and drive hybrid cars (混合动力汽车),but\nbicycle commuting could be even more effective than all of those combined. You\ncould cut down the amount of greenhouse gases just by commuting by bicycle a few\ntimes a week.\nBicycle commuting saves money too. When you buy your bicycle and the things\n第104页共176页\nthat usually go with it, you might be shocked by the cost. But if you think about the\nincreasingly high gas prices, you will know for sure that you can save a significant\namount each year by not driving a car.\n1. I will write a best-selling book on cycling.\nA. True B. False C. Not Given\n2. Many local people commute by bicycle.\nA.
