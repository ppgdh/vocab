ry it\nwithout dropping it\". The little boy learned that if he grasped the bottle at the top near\nthe lip with both hands, he could carry it without dropping it.\nThe scientist remarked that it was then that he knew he didn\u0027t need to be afraid to\nmake mistakes. Instead, mistakes were just opportunities for leaming something new,\nwhich is, after all, what scientific experiments are all about. Even if the experiment\n\"doesn\u0027t work\", we usually learn something valuable from it.\n11. This story is about a scientist who\nA. was extraordinary when he was young\nB. became well-known after an interview\nC. was smarter than the average person\nD. achieved great success in the medical field\n12. He got the milk spilt all over the kitchen floor because he\nA. dropped the bottle\nC slipped and fell\nB. was naughty\nD. was weak\n第106页共176页\n13. After seeing the spilt milk, his mother\nA. shouted at him\nB. cleaned the floor herself\nC. encouraged him to play in the milk\nD. forced him to clean the kitchen\n14. The mother and the son went out in the back yard to\nA. fll the botde with milk\nB. clean the bottle\nC. find a way to carry the bottle\nD. search for a new bottle\n15. According to the text, mistakes give us chances to\nA. know the truth\nB. learn something new\nC. do some experiments\nD. teach a child a lesson\n#5: 1·15#17 (16-251 5115, #105\nVolunteers\nVolunteers are people who work without being paid. They do the work because\nthey want to. We need volunteers because there are many things that need to be done\nin society which the Government can\u0027t afford to pay for.\n¿Volunteers are motivated by a desire to help others and to make the world a better\nplace. Statistics suggest that more than one million people do voluntary work in New\nZealand. Some volunteers do the kind of work that they are particularly interested in,\nbut perhaps haven\u0027t had the chance to do during their working lives. Others make use\nof their professional skills and experience.\n3 Volunteers contribute to society in a number of ways. For example, some give their\ntime to help preserve the natural environment. While there are government-run\nprojects to maintain national parks and forests, the projects would not succeed without\nvolunteers. Some environmental organizations rely solely on voluntary labor.\n\"Meals on Wheels\" is a voluntary organization run by the Red Cross. It delivers\nmeals to elderly people who are unable to cook for themselves. Every year volunteer\n* 107 # 16 [\ndrivers deliver a million meals. This enables elderly people to remain in their own\nhouses.\n⑤Volunteer Service Abroad was started in 1962. It sends volunteers to poor countries.\nTo be a volunteer you should be between the ages of 25 and 77, of good health and\nhave a skill or ability that is requested by the country. Volunteers spend two years\nhelping the local people improve their lives. Two years is a long time, but when they\nreturn, many volunteers say: \"It was the best two years of my life.\"\n\nTask1","section3":"16. Paragraph ①: ___________\n17. Paragraph ②: ___________\n18. Paragraph ③: ___________\n19. Paragraph ④: ___________\n20. Paragraph ⑤: ___________\n\nA. Definition of volunteers\nB. How volunteers are organized\nC. How volunteers contribute to society\nD. Why people want to be volunteers\nE. An organization sending volunteers abroad\nF. An organization delivering meals to the elderly\n\nTask2\n21. People do voluntary work because they want to __________.\n22. Some volunteers help others by __________.\n23. Some organizations rely on volunteers to help __________.\n24. The elderly can have their meals delivered without __________.\n25. Many volunteers returning from poor countries __________.\n\nA. help others\nB. leaving their homes\nC. cooking for the elderly.\nD. using their professional skills\nE. find their experience rewarding\nF. preserve the natural environment","section4":"第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据\n短文内容将其分别放回原有位置,以恢复文章原貌。\n\n第108页共176页\nHow to Talk to a Doctor\nIt\u0027s one of the saddest situations in modern medicine: the average doctor\u0027 s\nappointment lasts 15 minutes or less. _26_ That doesn\u0027t leave much time for\nchatting about the weather or your mood.\nWhat you don\u0027t realize-- but what I see very clearly as a doctor-- is that what\nthe patient says is more important than ever. _27_ They can also make it much\nharder for me to figure out what\u0027s wrong with you.\nMedical schools teach a specific way to conduct an office visit. Part one is the\ncomplaint. _28_ Part two in the physical exam. And part three is when the doctor\ngives you a diagnosis and prescription or a treatment. Chances are, you focus on\npart three, but the patients who receive the best care are those who master part\none. The key is to describe in detail what you\u0027ve been feeling not just \"bad, but\nwhat kind of bad, for how long, and after what kind of activity.\n_29_ Even though I\u0027ve been a doctor for many years, I tend to be a little\nnervous when I\u0027m the one sitting on the exam table. If I haven\u0027t prepared, I lose track\nof the details I intended to share. _ 30 When the doctor asks you questions, you\ncan be more specific, and the diagnosis and treatment will be more accurate. And\nthere may be a few minutes left over for a little pleasant conversation!\n\nA. No wonder you feel rushed.\nB. Of course, that\u0027s easier said than done.\nC. It is wise to see a doctor with your friend.\nD. It is also called the description of your problem.\nE. So I take a few minutes to write down some crucial details.\nF. In fact, your descriptions can help me give you great care.","section5":"第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌。\n\nPlanting a Garden\n\n第109页共176页\nPlanting a garden is a lot like having a family. Both require a great deal of\nwork, 31 as they grow and as the seasons 32 As summer days lengthen, your\nplants become 33 on you, much like your children depend on you for food and\ndrink. Like a 34 child asking for drink of water, your plants do the same. Their\nbent body issues a demand much the way your child requests milk or juice. Getting\nenough water, they would thrive soon.\nYou might also find you have to\n35 the space around your plants, much like\nyou pick up toys and clothes that have been thrown in your kid\u0027s room. Similarly,\nroses need to be pruned (修剪), and weeds need to be pulled. To keep children\nhealthy, parents protect their children against disease with 36, and gardeners\ndo the same with insect repellent (驱虫剂). To nourish (滋养) them, parents 37\nchildren vitamins, and gardeners use fertilizer, as both promote healthy growth.\nAs children grow up, they need less care. However, here\u0027s where the similarity\nends. While plants die or become 38 during winter, children 39 maintain an\nimportant role in the family, and parents will find their 40 does not come to an\nend.\n\n|   |   |   |\n|---|---|---|\n| A. help | E. dependent | I. responsibility |\n| B. clean | F. still | J. thirsty |\n| C. change | G. strong | K. medicine |\n| D. inactive | H. give | L. especially |","section6":"第六部分:完型补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌。\nWhat Makes Us Different\nThe reason Earth differs (differ) from all the other 41 (planet) in the universe\nis because of you and me. At first, we were living in caves, then came the ice age,\nthen the meltdown, and 42 (final), what we are today. We and Earth as a whole\n第110页共176页\nhave changed so much. The only thing that hasn\u0027t changed is our greed and 43\n(jealous).\nWhile we were in caves, we fought for food. While we were living on the ice,\nwe fought for_44 (warm), clothing, and food. Now, we are 45 (fight) over land.\nWhy do we fight for land that was never in our 46 (possess)? Wars, big or\nsmall, take place every day. Earth is a single nation. All the land masses on it belong\nto the planet, not to us. Everyone is the same, regardless of race, gender, or religion.\nWe are all deserve to be 47 (treat) equally. We are all also unique, but that\ndoesn\u0027t make us any 48 (little) human than the next person.\nIf we can start by 49 (pay) a compliment (赞美) to a different person each\nday, our world will be 50 (friendly) to live in. If we at least help one person in\nneed and let room for love to grow in our hearts, the world will be a better place."},"title":"2020年8月自考英语二"},"zk2010":{"sections":{"section1":"第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。\nBooking Online and Saving the Environment\nWhen you are looking to book a holiday, it is unlikely that you will think about\nhow green your booking decision is, but it is something that you should think about.\nBy\"green\"we mean the impact on the environment.\nWhen looking to book a holiday, you will probably find that you are faced with\ntwo main decisions. The first is to go into a travel agency, pick up brochures(宣传\n册)read through them and go back with just one and book with the travel agents\ndirectly or over the phone. The second is to go onto the Internet.\nThe Internet holds many advantages over the travel agencies. The main one is\nconvenience. You can go online to look at holidays at any time of the day. The travel\nagents, however, are usually very busy at times when people can actually go, i.e.\nlunch hours or at the weekend. You could use the telephone, but you wouldn\u0027t be able\nto see the pictures or the details of the holidays, so you would probably be sent a\nbrochure anyway.\nThere are websites on the Internet that make shopping for holiday deals much\neasier. These websites are known as price comparison websites. They search through\nlots of different tour operators, and the results are displayed on one page, from which\nyou can choose.\nCompared with the travel agencies, booking online is greener. The piles of\nbrochures are definitely not green, and the amount of unnecessary paper used can\u0027t be\ngood for the environment. In the days of the Intemet, there is really no need for such a\nlarge amount of paper to be wasted. So booking online will not only save you time\nand effort, it will do a little bit towards saving the environment, too!\n1. When planning holidays, few people will think about being green.\nA. True B. False C. Not Given\n2. There are two main choices when people look to book their holidays.\n第123页共176页\nA. True B. False C. Not Given\n3. People go to travel agencies and make their decisions directly.\nA. True\nB. False C. Not Given\n4. The main advantage of booking online is saving money.\nA. True\nB. False C. Not Given\n5. Many people go to travel agencies at lunchtime.\nA. True B. False\nC. Not Given\n6. Booking holidays by telephone requires less communicative skills.\nA. True\nB. False C. Not Given\n7. There are limited choices at price comparison websites.\nA. True B. False C. Not Given\n8.Travel agencies make the best use of price comparison websites.\nA. True B. False\nC. Not Given\n9. Travelers collect brochures as a hobby.\nA. True\nB. False\nC. Not Given\n10. Booking online is a way to save the environment.\nA. True\nB. False C. Not Given\n##","section2":"第二部分:阅读选择(第11~15题,每题2分,共10分)\n阅读下面短文,请从短文后所给各题的4个选项(A、B、C、D)中选出一\n个最佳选项。\n\n### Urban Gardening\nUrban gardening refers to the practice of planting a garden in the city.\nApartments, town homes, and other areas with little or no land are being used\nfor gardening. This method of gardening is becoming more common as the\namount of land for gardening in cities is becoming smaller and smaller.\nContainers, hanging baskets and raised beds are examples of items people\nuse to create a garden in a confined space. Some cities also offer a shared\ncommunity garden for people who have no room to grow plants at home.\nMany types of plants can be grown in containers and baskets. Tomatoes and\npeppers, for instance, can grow in containers on windowsills(窗台). Plants\ngrown on a windowsill should usually receive at least six to eight hours of\nsunlight daily. Herbs are often grown in containers or baskets in the kitchen.\nThey do not require much space and can be handy for cooking.\nPeople who want to grow more plants may use raised beds which are\nusually made of wood pieces and filled with a mixture of soil and fertilizers.\nThey can be built on top of any hard surface. including roof tops. People like\nthem because the beds often cost much less than most other methods of\ngardening.\nCommunity gardening could be an option for anyone who does not have\nspace for a garden at home. Most cities that offer this will rent a small plot of\nland to someone for a fee, or allow them to use it free of charge. Instead of\n第124页共176页\ndividing the land into separate plots, some cities allow everyone in the\nneighborhood to share and work on the same land. This method could be\nbeneficial for people in the neighborhood who share the passion for growing\nthings.\n11. Urban gardening came into being as a result of\nA. the lack of land for gardening B. new technology\nC. government encouragement D. the increasing population\n12. The word\"confined\" (Para. 2) means\nA. open B. empty C. limited D. occupied\n13. Plants grown on windowsills require a lot of\nA. water B. space C. soil D. sunlight\n14. Raised beds are popular because they\nA. are efficient B. are cheap C. last long D. contain fertilizers\n15. Community gardening is beneficial because it\nA. saves more land\nC. increases output\nB. requires less work\nD. connects people","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①⑤段每段选择1个正确的段落大意: (2)从第21~25题\n后所给的6个选项中选择5个正确选项,分别完成每个句子。\nMy Science Teacher\n(1 Usually when people decide to be teachers, they go to college, get a degree,\nand find a job at a school They prepare lesson plans, give out homework, and\nmake up tests. To them, it is just a job, a way to make a living. But for my\nscience teacher, Mrs. Cook teaching is not just her job; it\u0027s who she is. She\nteaches through her heart.\nShe has so much enthusiasm in her lessons. She is the one who goes out late\nat night to buy 10 pounds of sugar for our experiments. She brings in water,\nfrom the nearby canal to make her point, and to make us remember the lesson.\nShe makes us think that each new fact could change our lives.\nMrs. Cook wants all of us to do well in school. She tries to reach each student.\nShe neither ignores the sleeping kid in the back, nor lets the problem students\nalone. She shows special concern to slow students, and often helps them after\nschool. None of us can slip away from her attention.\nMiddle school is probably one of the hardest times of our lives. We change\nfriends so often, and fight with our parents constantly. But Mrs. Cook has made\nthis year so much better for us than it could have been. we know that if we had\nto turn to anybody, it would be her. And I\u0027m not alone in feeling this way; she is\na role model for our whole class.\nScience had never been my favorite subject. I had never borrowed science\nbooks. I had never performed experiments in my home. But this year, it\u0027s the\n第125页共176页\nscience class that I don\u0027t mind waking up for, the test I don\u0027t mind taking. I have\nMrs.Cook to thank for that. She has taught us so much more than just a single\nsubject.\n\n# Task 1\n16.Paragraph ①: ______\n17.Paragraph ②: ______\n18.Paragraph ③: ______\n19.Paragraph ④: ______\n20.Paragraph ⑤: ______\n\n*   A. Mrs. Cook makes our school life easier.\n*   B. I enjoy science class now.\n*   C. Mrs. Cook cares about each student.\n*   D. Mrs. Cook is strict with her students.\n*   E. Mrs. Cook\u0027s lessons are well-prepared.\n*   F. Teaching is more than a job for Mrs. Cook.\n\n# Task 2\n21. To become a school teacher, one needs ______\n22. Mrs. Cook often goes out to collect ______\n23. Mrs.Cook offers slow students extra help ______\n24. Our whole class take Mrs. Cook as ______\n25.I am lucky to have Mrs. Cook as ______\n\n*   A. in class\n*   B. my teacher\n*   C. after school\n*   D. a role model\n*   E. a college degree\n*   F. teaching materials","section4":"第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据\n短文内容将其分别放回原有位置,以恢复文章原貌。\n\nLack of Sleep Is Dangerous\nDo you know that if you miss out too much sleep you will die? It\u0027s true! If\nyou stay awake for a long, long time, your brain and body will break down.\n\n第 126 页 共 176 页\nThe unofficial world record for staying awake is 11 days, and it\u0027s held by\nRandy Gardner. 26 He also had help from TV and radio reporters, a sleep\nresearcher and a doctor.\nWhat happened? 27 Then his brain started to lose sense. On day 4, he\nthought a street sign was really a person. On day 6, he began to speak very\nslowly. On day 9, he couldn\u0027t finish sentences. On day 10, Randy thought he\nsaw a forest in the next room. 28 Eventually, after he\u0027d broken the world\nrecord, Randy was told to go to sleep. Experiments that keep people awake for\ndangerously long periods are always stopped before the patients break down.\nRats, however aren\u0027t so well cared for. 29 That\u0027s sooner than if they\u0027d\nbeen allowed to sleep but were given no food. They get really thin. But that\u0027s\nnot because they stop eating-quite the opposite. Even though these rats are\neating food, their bodies can\u0027t process it in the normal way. On top of that, their\nlittle bodies lose more heat than normal, which makes them weak. This means\nthat they need more food to stay at a healthy temperature. 30\nAnd that\u0027s what lack of sleep does for you.\n\nA. In fact, he went a bit crazy.\nB. Normally rats wouldn\u0027t catch a cold.\nC. Towards the end, the health of these rats is failing.\nD. When kept from sleeping, they die within three weeks.\nE. Randy asked two of his friends to stop him falling asleep.\nF. First of all staying awake long made Randy bad-tempered.","section5":"第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌。\n\nTalking Counts!\nMost words in a child\u0027s vocabulary come from everyday encounters with\nlanguage.\nChildren 31 up language from books, media, and conversations.\nYou can increase your child\u0027s vocabulary and 32 knowledge by having\nconversations with them. With babies, you can talk to them about what you\u0027re\ndoing so they can begin to 33 words with concepts. As your baby begins to\nspeak, start asking, \"What\u0027s that?\" when 34 to objects or pictures. Elaborate\non their 35 answers as a way to have them listening to more words. \"Yes,\nthat is a banana! It\u0027s 36 and smooth.\"\nWith young children, you can talk about the things you see in your 37\non trips around town, or on television. These conversations help build a\nchild\u0027s 38 of his world When reading, pause to ask questions on the story.\n\n第127页共176页\nAsk, \"Why do you think he did that? or \"What do you think going to\nhappen 39? Tell your children stories from your own life, or about the day\nthey were 40\nThis helps develop their personal and cultural identity.\n\nA. link\nB. simple\nC. secondly\nD. neighborhood\n\nE. yellow\nI. Pick\nF.build\nJ. born\nG.understanding\nK. background\nH.pointing\nL. next","section6":"第六部分:完型补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌。\n\nWater Shortage\nGetting water seems (seem) so easy for many people. You will\nbe 41 (mistake) if you think there is an 42 (end) supply of water. In fact,\nthe world has a water shortage. Seventy percent of the world is 43 (cover) in\nwater. But most of it is salt water. Only a small 44 (percent) is fresh\ndrinking water Countries 45 (include) Spain, Italy and South Africa actually\nimport water from countries such as the United States and\nAustralia. 46 (surprising), 1.1 billion people on earth have difficulty 47 (get)\nclean drinking water. This global problem is predicted to get 48 (bad) as the\natmosphere becomes warmer.\nEvery person in Britain 49 (use) about 150 litres of water a day. In\nsome countries people only have 5 to 10 litres a day! They would\nbe 50 (shock)to learn how we waste drinking water."},"title":"2020年10月自考英语二"},"zk2104":{"sections":{"section1":"第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。在答题卡相应位置上将答案选项涂黑。\nAnimals in the City\nRecently, there have been many reports in newspapers and on TV about big\nanimals coming into towns and cities. What happens when big animals come into our\ncities? Is it a good thing or is it dangerous for us and the animals?\nWild animals usually come into cities to look for food.in Cape Town, South\n154页共232页\nAfrica, baboons(狒狒) sometimes come into the suburbs. They eat fruit from gardens\nand go into people\u0027s kitchens! Baboons are strong animals and sometimes they scare\nchildren and fight with pet dogs. Many people do not like them, but the city can be\ndangerous for baboons too.Sometimes, baboons are hurt in car accidents.The city\ncouncil in Cape Town has a team of Baboon Monitors. Their Job is to find baboons In\nthe city and take them back to the countryside. The problem is that a lot of baboons\nwill come back to the city to find food again.\nIn Berlin Germany, groups of wild pigs sometimes come into the city to look for\nfood. They eat flowers and plants and dig in gardens and parks in the city. They also\nwalk in the street and cause traffic accidents.Some city residents like the pigs and\ngive them food. But the city council is worried about the traffic accidents. They have\ntold people to stop giving the pigs food and have put up fences to stop the pigs from\ncoming into the city.\nIn Moscow, Russia there are 35000 wild dogs. They live in parks, empty houses,\nmarkets and train stations. Some of the dogs were pets that people did not want, so\nthey left them on the streets. Others were born on the streets and have always lived\nthere.A lot of people like them and are used to seeing them on the streets. They give\nthe dogs food and water. They even build small huts for the dogs to live in during the\nvery cold winter.\n1.Many news reports concern big animals in the city.\nA. True\nB. False\n2.Wild animals often come into cities for the winter.\nA. True\nB. False\n3.The food in kitchens can be bad for baboons.\nA. True\nB. False\nC. Not Given\nC. Not Given\nC. Not Given\n4.Cape Town is a safe place for baboons.\nA. True\nB. False\nC. Not Given\n5.Many baboons will return after being sent away from the city.\nA. True\nB. False\nC. Not Given\n155页共232页\n6. There are more wild pigs in Berlin now than In the past.\nA. True\nB. False\nC. Not Given\n7.Wild pigs sometimes cause traffic problems In Berlin.\nA. True\nB. False\nC. Not Given\n8. Wild pigs started to come Into Berlin years ago.\nA. True\nB. False\nC. Not Given\n9.No one knows the number of wild dogs in Moscow.\nA. True\nB. False\nC. Not Given\n10.Some people help the wild dogs survive the cold winter.\nA. True\nB. False\nC. Not Given","section2":"第二部分:阅读选择(第11~15题,每题2分,共10分)\n阅读下面短文,请从短文后所给各题的4个选项(A、B、C、D)中选出1\n个最佳选项,并在答题卡相应位置上将该项涂黑。\n\nWhat Happens When You Stop Exercising\n\nHave you ever wondered what would happen if you stopped exercising? A new\nstudy on twins was published in the journal Medicine\u0026Science. The results of the\nstudy are dramatic.\n\nIn the study, researchers looked at 10 pairs of twin men. Each set of twins was in\ntheir mid-30s.Each had been brought up in the same family.Since they were\nidentical, they shared the same DNA.They had maintained the same level of physical\nactivity for most of their lives.\n\nBut there was one difference.One twin of each set had cut on exercising in the\npast few years due to work or family Pressure. On average, the less active twin\nexercised less than twice a week, while the active twin exercised at least twice a\nweek. The research team put each twin through a set of medical tests to study their\noverall health.\n\nThe results showed big differences. While the more active twins had lower body\n\n156页共232页\nfat percentage, better endurance level, and normal sensitivity, the Inactive twins had\nabout seven more pounds of body fat, worse endurance, and signs of disease. Not\nonly were their bodies different, their brains were different as well. The active twins\nhad more gray matter (the information processing part of the brain), particularly in\nareas that control balance.\nThe conclusion of the study is clear.Quitting your fitness routine can bring\nnegative effects to your body and your brain as well.Considering the less active twins\nin the study had become couch potatoes(沉溺于看电视的人) only recently, these\nchanges can sneak up on you a lot sooner than you\u0027d think.So keep exercising.It is\nbeneficial to your overall health!\n11. This text is mainly about __________.\nA. the importance of DNA\nB. the role of exercise\nC. the birth of a new journal\nD. the difference between twins\n12. Researchers chose twins for their study mostly because they __________.\nA. shared the same DNA\nB. looked alike\nC. had the same lifestyle\nD. grew up together\n13. The twins in the study differed in __________.\nA. sleeping habits\nB. exercise frequency\nC. working hours\nD. food preference\n14. The study found that the more active twins became __________.\nA. less creative\nC. more emotional\nB. less sensitive\nD. more endurable\n15. The phrase \"sneak up on\" (Para.4) most probably means __________.\nA. protect\nC. affect\nB. attack\nD. benefit\n第157页共232页\n非选择题区","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①-⑤段每段选择1个正确的段落大意;(2)从第21~25题\n后所给的7个选项中选择5个正确选项,分别完成每个句子。请将所选项对应\n的字母写在答题卡上。\nSurviving Illness Away From Home\nBeing ill is a horrible thing at the best of times, but what is even worse is when\nyou are ill away from home.If you\u0027re living away from home or abroad, it\u0027s important\nto get better at your own pace in order to ensure you can enjoy the rest of your time\naway.\n① Pampering (娇惯) yourself is always a good start. If you feel so ill and tired\nthat you can\u0027t even get out of bed, then don\u0027t! Make a trip to the kitchen and stock\nup on fluids and try to make yourself some hot food. The key to getting better is to\ndrink lots of fluids.Water and hot drinks such as green tea and soup are usually the\nbest things.\n② Try to distract yourself from feeling horrible.If you have a TV, watch one of\nyour favorite films or TV series. If you don\u0027t have a TV, maybe put the radio on. If you\nhave a headache and all the noise is too much to handle, try reading the book you\u0027ve\nalways wanted to read but never had the time to.Being ill doesn\u0027t have to be the\nworst day in the world!\nTell your friends and family that you are ill. Sometimes there is nothing\nbetter than hearing words of comfort from loved ones who feel sorry for you and\nwant to cheer you up and make you happy.There is nothing wrong with a little\nattention from others when you\u0027re 11.Who knows, they might even be wiling to\ntravel and visit you with lots of \"Get Well \" presents like your favorite food,\nmagazine or flowers.\n④ When you do arrive at a new place where you will be staying for a few\n158页共232页\nmonths, make sure you know exactly where the nearest drugstore is. If you are in a\nforeign country, It might be best to translate a few useful phrases before you start\nasking for a cure.\n\nTask 1\nA. Taking good care of yourself\n16. Paragraph ①:\nB. Staying in bed for the entire day\n17. Paragraph ②:\nC. Taking your attention away from illness\n18. Paragraph ③:\nD. Knowing where and how to get medicine\n19. Paragraph ④:\nE. Informing friends and family of your illness\n\nTask 2\nA. ask for medicine\n20. Being sick away from home is\nB. at your own pace\n21. You are advised to recover\nC. water and hot drinks\n22. The best cure for illness is\nD. a terrible experience\n23. If you cannot bear the noise from TV,\nE. at a nearby drugstore\n24. A few useful translated phrases help you\nF. read your favorite book\n25. You can buy medicine\nG. suffer from a cold","section4":"第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据\n短文内容将其分别放回原有位置,以恢复文章原貌,请将所选项对应的字母写\n在答题卡上。\n\nSwiss banks\nSwitzerland is well-known for chocolate and its watch making industry. It is even\nmore famous for its unique banking and financial system. 26\n\n第 159 页共 232 页\nBanking in Switzerland goes back to the 18th century.In the past, not only rich\npeople but also dictators(独裁者)kept their money In Swiss banks. During World War\nIl German Nazis(纳粹) put much of their money in Switzerland. 27\nSwiss banks are popular for many reasons. 28 It enjoys one of the highest\nper capita(人均) incomes in the world.It has been neutral for many centuries,\nespecially during the two world wars.In addition, the Swiss franc is one of the most\nstable currencies in the world.\nMost Importantly, Swiss banks follow very strict privacy rules.In 1934, a law was\npassed that forbade Swiss banks to reveal the names of account holders. 29_ If a\nSwiss banker reveals a person\u0027s bank account without permission, he or she commits\na crime.Such regulations have made Switzerland a popular destination for many\npeople.\nLately, however, the Swiss government has been under heavy pressure from\nother countries. 30\nThey want the banks to reveal the names of possible\ncriminals.\n\nA. They urge it to change its bank laws.\nB. Banks strictly protect the privacy of their clients.\nC. Private banking has a long tradition in the country.\nD. Banks play an important role in Switzerland\u0027s economy.\nE. Foreigners in troubled areas also kept money in Swiss banks.\nF. For one, the country has a very stable and prosperous economy.","section5":"第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌,请将所选项对应的字母\n写在答题卡上。\n\n第160页共232页\n# Education in New Zealand\n\nEducation in New Zealand is compulsory (强制的) between the ages of 6 and\n16. All children between these ages must_31_school. Most children begin their\nschooling at 5. This period includes primary and secondary education, and it is\n32.\n\nEarly childhood covers the period from birth to 6 years old. This period may\ninclude both care and education. There are many_33_such as play centers and\nkindergartens. More and more people are realizing the_34_of early childhood\neducation. Now 60 percent of children under 5 join in some form of pre-school\neducation.\n\nChildren go to primary school for 8 years or up to the age of about 13. They_35\ngo to secondary schools for a further 5 years. Some students may decide to leave\nschool at 16.\n\nHigher education_36_ any education or training that takes place after secondary\nschool. In New Zealand, this includes universities, _37_, and training schools.\nNew Zealand is _38_ becoming multi-cultural. More and more international\n_39_ are studying there. The education system is adapting to _40_ the needs of different\ncultural groups.\n\n|   |   |   |\n|---|---|---|\n| A.meet | E.free | I.choices |\n| B.students | F.wisely | J.quit |\n| C.quickly | G.then | K.attend |\n| D.means | H.value | L.colleges |","section6":"第六部分:完形补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌,并将答案写在答题卡相应的位置\n上。\n\n第161页共232页\nBody Image\nMany people are not satisfied (satisfy) with their body images. They are 41\n(encourage) to have plastic surgeries(整形手术),dlet plans, or diet pills.\nHowever, to build a positive body image_42 (require) a balanced diet and\na 43 (health) lifestyle.n our dally life, to eat more fruits and 44(vegetable)\nthan meat will help us keep fit, and the best way to keep ourselves in shape is to do\nsome vigorous exercise every day.\nBesides, a correct attitude is 45 (equal) important. We should not fee146\n(embarrass) about our bodles.We should not believe our body is a shame of\npersonal 47 (fail) We do not need to be as 48 (attract) as everyone\nelse.Instead, we should love ourselves rather than desire for 49 (possible)\nstandards.We should have a real and clear understanding of our body parts, and\nappreciate our body for the way it is.In this way, we will feel 50 (comfort) and\nconfident."},"title":"2021年4月自考英语二"},"zk2110":{"sections":{"section1":"第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。在答题卡相应位置上将答案选项涂黑。\nWho Is James Bond?\nThe latest Bond film is an enormous box-office(票房)hit. But who is James Bond?\nWhere does he come from? Author lan Fleming, the creator of James Bond, told us\nsomething about the origins of the world\u0027s most famous secret agent.\nIn the first Bond novel, lan Fleming told us that James Bond was the son of a\nScottish father and an Asian mother. But perhaps this was not really true. The title of\nthe 19th Bond film, \"The World Is Not Enough,\"was based on the Latin motto of the\n174页共232页\nBond family which is mentioned in one of the early novels. However, it now appears\nthat the motto is not that of the Scottish Bonds, but that of a different Bond family,\nwho came from England. So perhaps Bond is English, not Scottish.\nBond went to Eton College, the same school as his creator lan Fleming.This is a\nschool where young people learn how to move in high society, like Bond does so\nwell.\nAfter leaving school Bond did not go to university. He joined the British Secret\nService.He soon got promoted to the top. From then on he was 007,\"licensed to\nkill\", and so began a career which would take him to all the corners of the earth.\nIn the early days, Bond\u0027s role was quite clear. He was working for the West. His\nmain enemies were men from the KGB and other dangerous organizations. Since the\nend of the Cold War, the role of the Service has changed, and Bond\u0027s job profile has\nchanged with it. Now his main enemies are the big bosses of organized crime and\nInternational terrorism.\nUnlike the Cold War, organized crime is unlikely to come to an end.We can\ntherefore be sure that James Bond, the best-known English fictional hero of the 20th\ncentury, has many more adventures ahead of him.\n1.The new Bond film made much money for its producer\nA.True\nB. False\nC. Not Given\n2.lan Fleming directed the latest film about James Bond\nA. True\nB.False\nC. Not Given\n3.\"The World Is Not Enough\" is the name of a novel.\nA.True\nB.False\nC. Not Given\n4. Bond is unable to move in high society.\nA.True\nB.False\nC. Not Given\n5.Bond went to university before he became a secret agent.\nA.True\nB.False\nC. Not Given\n6.The British Secret Service gave Bond many awards.\nA.True\nB.False\nC. Not Given\n第175页共232页\n7.Bond went to many parts of the world because of his job\nA.True\nB.False\nC. Not Given\n8.Bond fought against many dangerous organizations.\nA.True\nB.False\nC. Not Given\n9.We can expect more adventurous storles about Bond.\nA.True\nB.False\nC. Not Given\n10.This text tells about the personality of James Bond.\nA. True\nB.False\nC. Not Given","section2":"第二部分:阅读选择(第11~15题,每题2分,共10分)\n阅读下面短文,请从短文后所给各题的4个选项(A、B、C、D)中选出1\n个最佳选项,并在答题卡相应位置上将该项涂黑。\nUniversal Gestures\nGestures for victory, defeat and stress are almost the same in all countries.\nOn the front page of a newspaper we often see the picture of people holding\ntheir head in shock. People put their hands on their head or over their mouth when\nthey look on a scene with shock or horror.\nChris Ulrich is an expert on body language.He said that covering your mouth or\nputting your hands on your head helps make you feel safer from a perceived threat.\nBy covering part of your face you can feel hidden from the shocking event.\nAdditionally these reactions can help a person comfort himself through touch. Ulrich\nsaid it is a self comforting gesture to help people in the moment.\nIn times of strong anxiety, people will twist their hands to calm themselves.\nUlrich said it is a reaction people often have when they are in front of an audience or\nnervous. \"It\u0027s a comfort for them that they\u0027ll get through it,\" said Ulrich. He relates\nthat gesture to a parent trying to calm a child.\nMost athletes react to victories or defeats with specific behaviors. A 2008 study\n176页共232页\nexamined pictures or judo (柔道) competitors during the 2008 Olympic Games, They\nwere from different countries, but they showed similar behaviors when they won a\nmatch. The winners would throw their head back or ralse their hands in triumph.\nUlrich sald these victory behaviors are a way winners \"explode\" out and take up\nmore space.\n\nHowever, if an athlete suffers a loss, he will act in a way that makes him\nphysically smaller, such as hanging his head.\"When you lose, you want to\ndisappear, \"said Ulrich. The study also found that the judo competitors had the same\nbehavior when they lost.\n\n11. People put their hands over their mouth to\nA.avoid a danger\nB.gain self-comfort\nC.hide their shock\nD. show their anxiety\n\n12. People tend to twist their hands when they are\nA. depressed B.angry C.shocked D. nervous\n\n13.In Paragraph 4,\"that gesture\" refers to\nA.shaking ones hands B.covering ones face\nC.twisting ones hands\nD.rubbing one\u0027s face\n\n14. Judo winners often act in a way that makes them.\nA.occupy more space\nB.appear physically smaller\nC. obtain more respect\nD.become more competitive\n\n15. The judo losers would\nA.raise their arms\nB.lower their heads\nC.beat their chests\nD.sit on their knees\n\n非选择题区","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①-⑤段每段选择1个正确的段落大意:(2)从第21~25\n\n第177页共232页\n后所给的6个选项中选择5个正确选项,分别完成每个句子。请将所选项对应\n的字母写在答题卡上。\n\nLittle Steps, Big Reward\n\n① More than 145 million Americans take walking as part of their\nexercise, according to a recent report. That\u0027s 15 million more people walking than last\nyear. Many places in America have reported an increase in walking. But most of the\nwalkers are found in big cities like New York.\n\n② Despite the increase in walking, only about 30% of Americans say they have\nat least 3 hours to take exercise a week. Our society has been conditioned to be\ninactive.People rely on modern conveniences and become lazy.The inactive lifestyle\nhas a negative aspect. We are more likely to be in poor health like overweight, which\nwill threaten our life span. That\u0027s where walking comes in.\n\n③ Walking is the best way to improve our health.Just 30 minutes of regular\nquick walking can help lose weight. At the same time, it can help lower the risk of\nheart disease and some cancers, and improve our blood pressure. If 30 minutes is too\nmuch, we may divide it into three 10-minute parts during the day. Most of us can find\n10 minutes if we really try.\n\n④ Walking requires only a pair of shoes and suits any schedules. Keep a pair of\nsport shoes at work. If you have a few minutes of free time, make use of them to\ntake a quick walk. Ever if you go to a health club several times a week, you can still\nlook for ways to be active while at work. It may be walking downstairs for a direct\ntalk rather than sending an email.\n\n⑤ Small efforts can make a big difference.But the hardest part for us is getting\nstarted. It\u0027s usually like this. When people get to a comfort level of walking for 10\nminutes, they might think about trying 11 minutes. That first step is really worthy.\n\nTask 1\n16. Paragraph ①: ______\n17. Paragraph ②: ______\n\n第178页共232页\n18. Paragraph 3: ______\n19. Paragraph 4: ______\n20. Paragraph 5: ______\n\nA. The key to walking is getting started.\nB. Walking is the first step to making changes.\nC. The advantage of walking is its simplicity.\nD. Walking is a great way for health improvement.\nE. More Americans take up walking than before.\nF. Modern lifestyle affects our health negatively.\n\nTask 2\n\n21. Reports say that the walkers are mostly from ______.\n22. Many diseases are largely caused by ______.\n23. We can keep healthy by taking ______.\n24. We can take a quick walk downstairs for ______.\n25. When feeling good after a 10-minute walk, ______.\n\nA. we divide a 30-minute walk into 3 parts\nB. our inactiveness\nC. we may like to try a longer one\nD. big cities in America\nE. a daily 30-minute quick walk\nF. a face-to-face talk","section4":"第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据\n短文内容将其分别放回原有位置,以恢复文章原貌,请将所选项对应的字母写\n在答题卡上。\n\nNorth Africa\n\nAfrica is the second largest continent on Earth. It is about 8,000 kilometers long\nfrom north to south. It can be divided into three major regions: northern\nAfrica, central Africa, and southern Africa. 26\nAfrica is separated from Europe by the Mediterranean Sea(地中海). It is\nconnected to Asia in the east. For this reason, it has been easy for people from\nEurope, Asia and other areas to come to North Africa. 27\nMost of North Africa is covered by the Sahara Desert. 28 There is little rainfall\n\n第179页共232页\nhere. The few people who live in the desert live in oases(绿洲).The valley of the Nile\nRiver forms one of the oases that stretch across the desert in the east.\nMany North African nations have a very important resource.They have large\ndeposits of petroleum. 29 In return, these nations receive a lot of money. They are\nspending some of this money to make life better for their people.\nEgypt is an important nation in North Africa. 30_It has served as a bridge\nbetween Africa and Asia. People from many nations have passed through Egypt.\nToday, it controls the Suez Canal. The canal connects the Mediterranean Sea and the\nRed Sea. It is important for ships traveling between nations in Europe and Asia.\n\nA.lt has always been a great barrier to people traveling south.\nB.This oil is shipped to many parts of the world.\nC. Each region has its special geography and history\nD.Asia is much larger than Europe.\nE. All these people have left their influence there.\nF. About 40 million people live there today","section5":"第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌,请将所选项对应的字母\n写在答题卡上。\n\nLearning from Mistakes\nLots of people don\u0027t dare to make mistakes. They fear that they will be blamed\nby others or lose their money and_31 .Therefore, they are under a lot of stress. But\nrisks are unavoidable and they do_32 the way towards success. Have you ever heard\nof someone who achieves success without making any mistakes?\nSo it is 33 that making mistakes in your effort to realize your 34 is considered a\nmust. You shouldn\u0027t worry about making mistakes as you may get a lot of 35_from\nthem. By making mistakes you can 36 between the correct and the 37 things you did.\nAnthony D\u0027Angelo said, \"In order to succeed you must fail, so that you know what to\ndo the next time.\" Robert Stevenson even went to the 38 as to say,\"Our business in\n\n第180页共232页\nlife is not to succeed, but to continue to 39 in good spirits.\"\nYou needn\u0027t worry about anything as long as you keep on going by 40 learning\nfrom your mistakes and trying even harder.\n\n|       |       |       |\n| :---- | :---- | :---- |\n| A. extreme | E. fail | I. pave |\n| B. discover | F.belongings | J. Incorrect |\n| C. distinguish | G.recently | K. wisely |\n| D. advantages | H.natural | L. dreams |","section6":"第六部分:完形补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌,并将答案写在答题卡相应的位置\n上。\n\nInterlaken, Switzerland\n\nThe sound of cow bells ringing across Interlaken\u0027s grassland is\n*comforting*(comfort). Climbing up the nearby mountains is also_41 (enjoy)So is skiing\ndown them. The town of Interlaken is 42 (locate)in a beautiful setting between two\nlakes. It is also close to the 43 (mountain) villages. The outdoor possibilities are_44\n(end) around Interlaken in summer and winter. They range from sailing, skiing, to\nclimbing or just 45 (relax) in a pool. People can enjoy boating in the summer. They\ncan also take 46 (please) in skiing In the winter. This place is a perfect choice for\npeople if they like ice climbing or 47 (roll) down a hill inside a ball. It meets 48 (near)\neveryone\u0027s needs.\n\nForeigners are not allowed to buy 49 (house)in Interlaken. But they can buy one\nin nearby villages. Many 50 (retire)people consider Interlaken a great place to settle\naround."},"title":"2021年10月自考英语二"},"zk2204":{"sections":{"section1":"第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。在答题卡相应位置上将答案选项涂黑。\nFamous Brands\nWhy do we always buy certain shoes or clothes that have a famous brand? Why\ndo we have to copy other people? The people we often admire the most are those\nwho have their own styles. They don\u0027t want to copy someone else\u0027s.\nBig companies give free products to famous people, such as sportsmen and\nmovie stars. They intend to get people like you to buy their products. When you spend\na lot of money on an expensive pair of shoes, they may not suit you. You might enjoy\nmore if you buy something else at the same pricel Besides the brand you may want\nto know why they are asking that price. The brand may sometimes have nothing to\n第193页共232页\ndo with the quality of the product.\nIt can be of bad quality and badly made. This makes you think why it has the\ndesigner\u0027s name on it. It\u0027s very important for designers to use their creative talent to\nmake something beautiful. But today the making of money has become more\nimportant. So they just copy other products and their standards fall.\nCreative products should be available to people at a reasonable price. In this\nway, big companies wouldn\u0027t be able to dominate(控制)the market and encourage\npeople to spend too much money on their products.\nThey are dominating the market by telling us what to buy.If you go into a toy\nshop or children\u0027s clothes shop. you I find the whole section for girls is almost all pink.\nBecause of the domination of big companies the original arts and crafts are\nbeginning to die out. It would be a real shame if these arts and crafts were to\ndisappear.\n\n1.We like the people with their own styles.\nA.True\nB.False\nC.Not Given\n2.Big companies give famous people free products to attract buyers.\nA. True\nB.False\nC.Not Given\n3. Expensive products often suit people better.\nA. True\nB.False\nC.Not Given\n4. Famous brand products are of better quality.\nA.True\nB.False\nC.Not Given\n5.Creativity is important in making good products.\nA. True\nB.False\nC.Not Given\n6.Famous designers work overtime.\nA.True\nB.False\nC. Not Given\n7. Young people like creative products.\nA.True\nB.False\nC.Not Given\n8.Big companies price their products reasonably.\nA.True\nB.False\nC.Not Given\n第194页共232页\n9. Mothers prefer to shop for children\u0027s clothes.\nA.True\nB.False\nC. Not Given\n10.The domination of big companies does harm to creativity.\nA.True\nB.False\nC. Not Given","section2":"第二部分:阅读选择(第11~15题,每题2分,共10分)\n阅读下面短文,请从短文后所给各题的4个选项(A、B、C、D)中选出1\n个最佳选项,并在答题卡相应位置上将该项涂黑。\nSelf-esteem(自尊)and Body Image\nSelf-esteem is all about what people think of themselves. It is important\nbecause feeling good about yourself can affect how you act. People who have high\nself-esteem will make friends easily.They are more in control of their behavior, and\nwill enjoy life more.\nSome teenagers struggle with their self-esteem when they grow into adults\nbecause the body goes through many changes. Along with the changes comes a\nnatural desire to feel accepted. What\u0027s more they can\u0027t help but compare themselves\nwith others. They may compare themselves with the people around them or with\nactors and other famous people they see on TV,in movies or in magazines.\nThe physical changes can affect how both girls and boys feel about\nthemselves.Some girls may feel uncomfortable about their growing bodies. Others\nmay wish that they were developing faster. Girls may feel like being thin but boys\nmay feel like they don\u0027t look big enough.\nIt\u0027s not just body development that affects self-esteem. Many other factors can\naffect a person\u0027s body image too. Family life, for example can sometimes influence\nself-esteem.Some parents spend more time criticizing their kids and the way they\nlook than praising them. This can reduce kids ability to develop good self-esteem.\nAlso their classmates and peers may tease them about the way they look. These\nsometimes can affect their self-esteem.\n第195页共232页\nIf there are things about yourself that you want to change and you can\nchange, do this by making goals for yourself. If there are things that you can\u0027t\nchange, recognize that your body is your own. It\u0027s no one\u0027s business but your own\nwhat your body is like. Actually, to be happy with yourself, all you need to do is to\nchange the way you see your body.\n\n11. People with high self-esteem often ________.\nA.control others behavior\nB.think highly of others\nC.have lots of friends\nD. work very hard\n\n12. Some teenagers struggle with their self-esteem because________.\nA.their teachers don\u0027t like them\nB.their bodies have changed a lot\nC. They cannot accept famous people\nD. they need more time to watch TV\n\n13. The word \"tease\" (Line 5, Para.4) most probably means ________.\nA. laugh at B.talk about C.argue with D. look at\n\n14. To help kids develop good self-esteem, parents should ________.\nA.compare them with others\nB.make goals for them\nC.criticize their peers\nD. praise them\n\n15. To be happy with yourself you should ________.\nA. do business\nB. love your body\nC.find new friends\nD. change your behavior\n\n第196页共232页\n非选择题区","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①-⑤段每段选择1个正确的段落大意;(2)从第21~25题\n后所给的6个选项中选择5个正确选项,分别完成每个句子。请将所选项对应\n的字母写在答题卡上。\n\nHelping Children Cope with Stress\n\n① To adults, childhood can seem to be happy and free from worries. But\nchildren still experience stress. Things like school and their social life can sometimes\ncreate pressures that are too difficult for them to deal with. While they may not talk\nabout their troubles. they do want their parents to reach out and help them.\n\n② Children deal with stress in both healthy and unhealthy ways. As a parent,\nyou can\u0027t protect your children from stress but you can help them develop healthy\nways to cope with stress and solve everyday problems. By doing so, you not only help\nyour children handle their current stresses but also prepare them to deal with future\nstresses. Here are a few tips for you.\n\n③ When you notice that something is upsetting your child you need to tell your\nchild about it.If you can, name the feeling you think your child is experiencing.This\nshouldn\u0027t sound like blame. It\u0027s just a casual observation. and you\u0027re interested in\nhearing more about your child\u0027s concern. Be sympathetic and show that you care and\nwant to understand.\n\n④ Also ask your child to tell you what\u0027s wrong. Listen attentively and\ncalmly-with interest, patience, openness, and caring. Don\u0027t hurry to make\njudgements. Do not blame or criticize your child for what he or she has done.The\nidea is to listen to your child\u0027s concerns and feelings. Try to get the whole story by\npatiently asking questions, Take your time And let your child take his or her time, too.\n\n⑤ Remember to be patient. As a parent it hurts to see your child unhappy of\nstressed. But you should not try to solve every problem for your child. Instead try\n\n第197页共232页\nto help your child grow into a good problem-solver-a child who knows how to deal\nwith life\u0027s ups and downs, express feelings in words, calm down when needed and\nnever give in to difficulties.\n\n# Task 1\n\n16.Paragraph ①:\n17. Paragraph ②:\n18. Paragraph ③:\n19.Paragraph ④:\n20.Paragraph ⑤:\n\n|  |  |\n|---|---|\n| A.Help your child deal with stress |  |\n| B.Show your concern and care |  |\n| C.Be patient with your child |  |\n| D.Stories help children |  |\n| E.Listen to your child |  |\n| F.Children have stress |  |\n\n# Task 2\n\n21.Children can meet pressures\n22.Parents can help their children cope with stress\n23. Talk to your child when he/she is\n24.Don\u0027t blame your child for\n25.Parents should teach their children\n\n|  |  |\n|---|---|\n| A. in trouble | B. in healthy ways |\n| C.to forget their problems |  |\n| D.what he/she has done |  |\n| E from school and their social life |  |\n| F.to solve problems themselves |  |","section4":"第四部分:填句补文(第26~30题,每题2分,共10分)\n下面的短文有5处空白,短文后有6个句子,其中5个取自短文,请根据\n短文内容将其分别放回原有位置,以恢复文章原貌,请将所选项对应的字母写\n在答题卡上。\n\n## The Coyote(林狼)\n\nThe coyote is a relative of the dog and the wolf.Like its relatives, it mostly feeds\non other animals. It will, however, eat a wide variety of foods, including insects, fruits\n\n第198页共232页\nand vegetables.\nCoyotes are found throughout most of North America from Mexico and Central\nAmerica to Canada and Alaska. The color of Its coat depends on where it lives. 26\nLike the wolf, coyotes live in groups, or packs. The coyote pack is usually smaller\nthan a wolf pack. 27 The pack will often divide into pairs to hunt. Female coyotes\ngive birth to baby coyotes once a year. Over half of the babies will die before they\nreach adulthood. Male babies usually leave the pack to find their own territory. 28\nWolves and coyotes compete for the same animals for food. Since the coyote is\nsmaller than the wolf, wolves will usually drive the coyote out of any shared living\narea.\nThe coyote adapts easily to new areas. Unlike the wolf the coyotes living area\nincreased when more and more people settled across North America. 29 Once the\nNew England settlers eliminated wolves, the coyote moved in. Scientists who have\nstudied the coyote believe it is better than the wolf at living in human areas.\n30 They find enough supply of food in these areas since coyotes are willing to\neat garbage, rodents(such as rabbits and mice) and even small pets.Scientists\nestimate that as many as 2,000 coyotes may be living in the Chicago area.\n\nA.Female babies stay with the parent\u0027s pack.\nB.The coyote is not an endangered species.\nC.Coyotes are now found in most large cities.\nD. All members of the pack are usually related.\nE. Mountain coyotes are darker than those living in the desert.\nF. For example. the coyote was not native to New England.","section5":"第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有 10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌,请将所选项对应的字母\n写在答题卡上。\n\n第199页共232页\nSlavery In the United States\nIn most parts of the United States in the early 1800s blacks had no rights at all.\nThey did not have the right to vote.It was against the 31 for them to go to school\nwith whites. In some states, It was even 32 for them to learn to read and write. Free\npeople had the right to come and go as they 33, but slaves had to have a pass, or\npaper from their 34 in order to leave the master\u0027s land. Slaves were often 35 from\ntheir families when they were sold. They had to work very 36 hours, but were not\npaid. If they did not do as they were told, they could be beaten. If they tried to\nescape they were hunted down with dogs. and could be tortured or even 37 when\ncaught.\nUntil about 1800, there were slaves in 38 every state in the United States.But\nslaves were not a big part of the Northern way of 39. Northern factories hired\nworkers and did not use slaves. By1850, all Northern states had made slavery illegal.\nIn the Southern states however, most of the field workers were slaves; one out\nof every four families 40 slaves. These people were often rich and had large farms.\n\n|   |   |   |\n|---|---|---|\n| A. seldom | E. killed | I. long |\n| B. master | F. life | J. almost |\n| C. separated | G. owned | K. liked |\n| D. illegal | H. law | L. played |","section6":"第六部分:完形补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空白,每处空白后的括号内有一个词,请根据短文内容\n将其正确的形式填入文中,以恢复文章原貌,并将答案写在答题卡相应的位置\n上。\n\nRubbish: Easy to Produce, but Hard to Get Rid of\nWe produce a lot of rubbish. There is no question about it.The amount of\nrubbish we throw away is surprising (surprise). Scientists report that Americans\nproduce about five 41 (pound) of rubbish per person-every day. Forty years ago,\neach person 42 (produce) only half of it each day. There are 43 (near) 300\n\n第200页共232页\nmillion people in the US. You do the math. How much rubbish do we produce every\nday?\nIn 44 (add) to the amount of rubbish we produce, how we get rid of it is\nanother problem. The plastic bags that we place outside of our homes need to be\n45 (carry) away every week. These bags are not 46 (friend) to the environment\nat all.\nNobody is sure how long a plastic bag takes to totally break down, because\nWe\u0027ve only been\n47 (use) plastic as a business for about 90 years. It is 48\n(believe), however, that it may\ntake 100 years for a plastic bag to completely break down. I am sure that you\nwill feel 49 (happy) to think that a plastic bag can live longer than the 50\n(major) of people on earth."},"title":"2022年4月自考英语二"},"zk2210":{"sections":{"section1":"第一部分:阅读判断(第1~10题,每题1分,共10分)\n下面的短文后列出了10个句子,请根据短文的内容对每个句子作出判断:\n如果该句提供的是正确信息,选择A;如果该句提供的是错误信息,选择B;如\n果该句的信息文中没有提及,选择C。在答题卡相应位置上将答案选项涂黑。\nLacking in self-Esteem (自尊)? Good for youl\nAccording to psychological and educational theories, self-esteem is essential for\na successful life.Generations of children, especially minority kids, have been educated\naccording to the theory that they lack self-esteem, and that this deficiency is central\nto any problems they may have in making their way in the world.\n第213页共232页\nWell, guess what?A new research has found that self-esteem can be just as high\namong grade D students and drunk drivers as it is among Nobel Prize winners and\nformer presidents. In fact, people with high self-esteem can engage in far more\nanti-social behavior than those with low self-esteem.\n\"We used to believe that high self-esteem would cause all sorts of positive\nconsequences and that if we raised self-esteem people would do better in life,\"a\nresearcher said. \"Mostly the data have failed to support that.\" Racists, street\nthugs(恶棍)and school bullies(恶霸) all have high scores on the self-esteem tests.\nAnd you can see why. If you think you\u0027re highly gifted, you\u0027re particularly offended if\nother people don\u0027t treat you that way. So you hit out or commit crimes to defend\nyour pride. After all, who are they to suggest that you could be doing something\nwrong? what do they know?\nSelf-esteem can also be an educational concern.College teachers are constantly\ncomplaining about the high self-esteem of their students.\nWhen every grade in the school is assessed so as to make the kid feel good\nrather than to give an accurate measure of his work, the kid can develop self-esteem\ndangerously unrelated to the truth. When He\u0027s told he is getting a C grade in college,\nhe can then get deeply offended or extremely angry. Weak professors give in to the\npressure-hence, grade inflation, which results in their students vague touch with\nreality.\n1.It is believed that minority kids often have self-esteem problem\nA. True\nB. False\nC. Not Given\n2. A new research shows that high self-esteem is essential to success.\nA.True\nB. False\nC. Not Given\n3. Parents are responsible for their children\u0027s self-esteem.\nA. True\nB. False\nC. Not Given\n4. Anti-social behavior is related to low self-esteem.\nA. True\nB. False\nC. Not Given\n5. Racists have low self-esteem.\n第214页共232页\nA.True\nB. False\nC. Not Given\n6. People with high self-esteem are hurt more easily.\nA.True\nB. False\nC. Not Given\n7. College students are faced with high economic pressure.\nA.True\nB. False\nC. Not Given\n8. College teachers are often annoyed with students high self-esteem\nA.True\nB.False\nC. Not Given\n9. High grades help students know the truth of themselves.\nA. True\nB. False\nC. Not Given\n10. Some college students may find a C grade offending.\nA. True\nB. False\nC. Not Given","section2":"第二部分:阅读选择(第11~15题,每题2分,共10分)\n阅读下面短文,请从短文后所给各题的4个选项(A、B、C、D)中选出1\n个最佳选项,并在答题卡相应位置上将该项涂黑。\nOrganic Farming\nDuring thousands of years of human civilization, the raising of animals and\ngrowing of plants have always been organic.Chemicals for farming first came up at\nthe turn of the 20th century. Widespread use of chemicals began after World War\nII.In the 1950s and 60s farmers started using chemical fertilizers and pesticides(杀虫\n剂). Recently, however, more and more farmers have been returning to organic\nfarming.\nIn organic farming, farm products are produced in more natural ways. Crops,\nmeat and other food are produced without chemicals. Chemical fertilizers,\npesticides, and growth hormones(激素) are forbidden. Farmers enrich the soil with\nnatural fertilizers. They pull out weeds by hand. Hay and straw are put between the\nrows of plants to stop weeding. They rely on the natural enemies of pests to control\npests. Animals are fed organically and can eat grass outdoors. Cows, for example, are\n第215页共232页\nkept in pastures(草场)and fields. Vegetables and fruit are also produced with organic\nmethods.\nOrganic farming enjoys many advantages. For example, crop rotation can\npreserve the good qualities of soils. The growing of different crops can keep soils\nhealthy and fertile.Organic farming is healthier for farm workers, and there are fewer\nremains of chemicals in food. In the long run organic farms save energy and protect\nthe environment. It can slow down global warming and reduce the pollution of\nground water.\nMeanwhile, there are some disadvantages. Organic food is more expensive.\nOrganic products may cost up to 40% more. Production costs are higher as farmers\nneed more workers, and the land output is much less. Marketing and distribution is\nnot efficient because organic food is provided in smaller amount.Crop illness may\nhappen very often. Besides, organic farming cannot produce enough food for the\nworld\u0027s population to survive. This could lead to starvation in countries that can\nproduce enough food today.\n11. Organic farming __________.\nA. started in the 1950s\nC. has become popular in recent years\n12. In organic farming __________.\nA.cows can move around in fields\nB. natural enemies of pests are scarce\nC. chemicals are used to kill pests\nD. machines are used to pull out weeds\nB.had a short history\nD. was promoted by World War II\n13. The phrase \"crop rotation\" (Para. 3) probably means\"__________\".\nA. growing high-yielding crops\nB. seasonal growing of crops\nC. planting soil-enriching crops\nD. regular changing of crops\n14. One advantage of organic farming is that it is __________.\n第216页共232页\nA. water-saving\nC. market-friendly\n15.The problem of organic farming is\nA. poor qualities of soils\nB. high production costs\nC. the use of too much land\nD. the shortage of farm workers\nB. labor-saving\nD. environmentally-friendly\n非选择题区","section3":"第三部分:概括段落大意和补全句子(第16-25题,每题1分,共10分)\n阅读下面短文,请完成短文后的2项测试任务:(1)从第16-20题后所给\n的6个选项中为第①-⑤段每段选择1个正确的段落大意;(2)从第21~25 题\n后所给的6个选项中选择5个正确选项,分别完成每个句子。请将所选项对应\n的字母写在答题卡上。\nHealth Benefits of Honey with Milk\nHoney and milk get along well. Since ancient times, this mix is known for its\namazing health benefits.\n① Take a glass of honey with milk before you set out for your day in the\nmorning, and you are guaranteed enough to get through the morning rush. Milk\nprovides you the proteins required while honey helps you get the energy by breaking\ndown these proteins. No wonder this drink is meant for all ages alike.\n②Milk is known for providing calcium(钙), which in right levels, helps in\npreventing
