nexplain why, but it was really annoying.\nI got very bored lying in bed, so I decided to read a book. 26 But even when\nI finished reading, I still didn\u0027t feel tires. So I listened to some peaceful music. That\ndidn\u0027t work, either.I have heard people say if you have a warm drink before bed time,\nit will help you drift off to sleep.So I went downstairs and made myself a cup of tea.\n27 Still, I couldn\u0027t sleep.I was getting very frustrated by this point! It felt strange to\nbe awake while everyone else was asleep.\n28 In fact, it was a little bit frightening. When you go to sleep, it feels like one\nday ends and some another begins. But if you stay up late, you realize that day and\nnight are just a gentle transition (转变) , a cycle while has no end and no beginning.\nAt 4 a.m, I noticed a faint light coming through curtains. The sun had started to risel\n,\nNormally, I\u0027m a heavy sleeper. 29 So on the this occasion, I consider\nmyself lucky to see a beautiful sunrise. I knew I needed to get some rest, but it\nseemed the harder to force myself asleep, the more different it was.\nEventually, I just let my mind go free. 30 I listened to the birdsong...and\nthe next thing I knew it was 11 aml I was happy that I had managed to get some\nsleep! I have never struggled with sleeping before, so this was my first experience of\ninsomnia. Fortunately, I have been sleeping well since then.\n\nA.The world seemed so quiet.\nB.I stopped forcing myself to sleep.\nC.After my tea, I got back into bed.\nD.I didn\u0027t want wake up my family.\nE.I thought reading would help me get to sleep.\nF.I had never been awake at this time in the morning.\n\n第219页共232页","section5":"第五部分:填词补文(第31~40题,每题1.5分,共15分)\n下面的短文有10处空白,短文后列出12个词,其中10个取自短文,请根\n据短文内容将其分别放回原有位置,以恢复文章原貌,请将所选项对应的字母\n写在答题卡上。\n\nSmiles\n,\nA smile costs nothing but creates much. It enriches those who 31\nwithout making those who give poor. It happens in a 32_and the memory of it\nsometimes lasts 33. None are so rich that they can get along without it, and none\nso 34 but are richer for its benefits. It creates 35 in the home, and fosters good\nwill in a business. It is rest to the weary(疲劳的), daylight to the 36 and sunshine to\nthe sad. Yet it can\u0027t be bought, begged, borrowed or stolen, for it is something that is\nno earthly good to anybody till it is given 37. And if in the last-minute rush of\nChristmas 38, some of our sales people should be too 39 to give you a smile, may we\n40 you to leave one of yours? For nobody needs a smile so much as those who\nhave none left to give!\n\n| | | |\n|---|---|---|\n| A.forever | E. discouraged | I. poor |\n| B. away | F. flash | J. enough |\n| C. happiness | G. receive | K. buying |\n| D. Satisfied | H. tired | L. ask |","section6":"第六部分:完形补文(第41~50题,每题1.5分,共15分)\n下面的短文有10处空自,每处空白后的括号内有一个词,请根据短文内容将\n其正确的形式填入文中,以恢复文章原貌,并将答案写在答题卡相应的位置上。\n\nThe Importance of Friendship for School-age Children\nFriends are very important to school-age children\u0027s healthy\n(health)development. Research has 41 (show) that children who lack friends can\nsuffer from emotional and mental difficulties later in life. They have also found that\nchildren with friends have a 42 (great) sense of happiness, better self-esteem and\n\n第220页共232页\nfewer problems as they grow up.\nFriendships provide children with more than just fun 43 (playmate). They\nhelp children develop emotionally and 44 (moral) .In interacting with\nfriends, children learn many 45 (society) skills, such as how to communicate, and\nhow to cooperate. They practice 46 (control) their emotions and responding to\nthe emotions of others.\nThey develop their 47 (able) to think through and negotiate different\nsituations in their relationships. Having friends 48 (affect) children in many ways,\neven their school 49 (perform).Children tend to have better attitudes about school\nand learning when they have friends there. In short, friendships are not just a luxury,\nthey are a 50 (necessary) for children."},"title":"2022年10月自考英语二"},"2404":{"title":"2024年4月","sections":{"section1":"第一部分：阅读判断(第 1～10 题，每题 1 分，共 10 分)\n 下面的短文后列出了 10 个句子，请根据短文的内容对每个句子作出判断：如果 该句\n提供的是正确信息，选择 A; 如果该句提供的是错误信息，选择 B; 如果该句的\n信息文中没有提及，选择 C。在答题纸相应位置上将答案选项涂黑。\n Do You Love Your Dog More Than Humans?\n Elizabeth Anderson once had a dog named Grace.She and her husband cared for Grace\nand tried to keep her out of trouble.They took her on vacations and enjoyed her company\naround the house.When Grace died at age 14,they were deeply upset.Because Grace was a\ndog,“I was unable to talk to anyone about this great grief,”says Anderson.\n “But it\u0027s common to feel that way after the loss of a dog,”says Stanley Coren, a professor\nof psychology.“Our relationship with dogs is simple.Some might call it true love.”\n The bond between people and their dogs is a lot like love.In one recent study,when the\ndogs and their owners just looked at each other,they both had a higher level of the hormone\n(荷尔蒙)associated with love.“It is very natural to form a bond between dogs and humans,”\nsays Takefumi Kikusui,author of the study.“But we found the same can\u0027t be said for humans\nand wolves.”\n “Dogs are man\u0027s best friend,” says Coren. “We\u0027ve trained them to be that way.We\ninvented the dog to fit in our lives. For 14,000 years,we\u0027ve been creating an animal which\nunderstands our communications and we understand its communications.They have a bond\nwith us. ” For example,if a person points to something in a distance,a dog will look in the\n\f \ndirection of the finger,just like a human.But what about a wolf?“It would simply look at the\nfinger,”Coren says.\n For Anderson,dogs are more lovable than humans.She says, “ They try their best to\nplease us.They want to do whatever we want to do.Their love is not limited.They are good at\nall the things we enjoy in a relationship.”\n1.Grace became a member of Anderson\u0027s family at 14.\n A.True B.False C.Not Given\n2.Anderson enjoyed her time with Grace.\n A.True B.False C.Not Given\n3.Grace died in an accident.\n A.True B.False C.Not Given\n4.Coren does not understand people\u0027s grief over the loss of their dogs.\n A.True B.False C.Not Given\n5.The bond between humans and dogs can be compared to love.\n A.True B.False C.Not Given\n6.Dogs have the hormone associated with love.\n A.True B.False C.Not Given\n7.Kikusui knows why wolves are different from dogs.\n A.True B.False C.Not Given\n8.Man started to train dogs 14,000 years ago.\n A.True B.False C.Not Given\n9.A wolf understands human communications.\n A.True B.False C.Not Given\n10.Anderson finds humans more lovable than dogs.\n A.True B.False C.Not Given","section2":"第二部分：阅读选择(第 11～15 题，每题 2 分，共 10 分)\n 阅读下面短文，请从短文后所给各题的 4 个选项 (A 、B 、C 、D) 中选出 1 个最佳\n选项，并在答题纸相应位置上将该项涂黑。\n Marta Garcia:Inspired by Technology\n\f \n Marta Garcia is a high school senior.In the past years she has been working on a variety\nof projects.The projects are part of her work with Techbridge, a nonprofit organization.\nTechbridge was set up in 2000 to increase the number of women in science,technology,\nengineering and math (STEM).It offers a range of after-school activities for students.\n Techbridge focuses on learning by doing.It attracts Marta\u0027s interest.“When I was a kid,”\nsays Marta,“I wasn\u0027t into English.I was really into technology and math.My older sister was in\nTechbridge.She encouraged me to join.It was something for me to do after school.I found\nit pretty fun.”\n Marta has created a complex music-making machine.Her latest project is a digital piano,\nwhich shows how far her STEM skills have advanced.Marta\u0027s instructors have been following her\nprogress closely.“I\u0027ve seen her master STEM skills,”says Techbridge CEO Linda Kekelis.“She\u0027s\nvery confident to face challenges.She isn\u0027t afraid of temporary setbacks. ”\n Marta plans to attend Smith College this fall.She is still drawn to math and technology.But\nshe does not want to be limited to one particular course of study.\n “I\u0027m not sure what I want to do after college graduation,”says Marta.“I know a STEM\ncareer is an option.”The future will be filled with jobs that require STEM skills. So her love\nof technology and her experience with Techbridge will serve her well.\n11.Techbridge was set up to .\n A.train women teachers B.offer jobs for students\n C.teach STEM at school D.help girls learn STEM\n12.Marta Garcia works with Techbridge to .\n A.develop her interest B.finish her education\n C.improve her English D.please her older sister\n13.Linda Kekelis is impressed by Marta Garcia\u0027s .\n A.knowledge B.interests C.confidence D.instructions\n14.The word“setbacks”(Para.3)most probably means\" . ”\n A.advances B.difficulties C.activities D.projects\n15.Marta Garcia\u0027s experience with Techbridge will .\n A.help her finish university B.benefit her in the future\n C.limit her to a STEM job D.let her take fewer courses","section3":"第三部分：概括段落大意和补全句子(第 16～25 题，每题 1 分，共 10 分)\n 阅读下面短文，请完成短文后的 2 项测试任务：(1)从第 16～20 题后所给的 6 个 选项\n中为第①~6 段每段选择 1 个正确的小标题；(2)从第 21～25 题后所给的 6 个选 项中选择 5\n个正确选项，分别完成每个句子。在答题纸相应位置上将答案选项涂黑。\n How to Create a Five-Year Career Plan\n ①More and more people choose to make a five-year career plan.They think that the plan\ncan help them to learn where they would like to go in the future.In fact,with a five-year plan, you\ncan document the progress you have already made in your chosen career.You can also learn\nwhere you are likely to be heading in the future.\n ② The initial step is to think about an end goal.This can help you to gain focus on your\ncareer.When you are setting your end goal,make sure that you do not choose a job purely based\non its salary.Though salaries for the job may be high now,demand often changes over\ntime.\n ③ The next step is to get an adviser.An adviser is generally a person who has achieved\nsuccess in the career that you wish to take.Ideally,an adviser can give you sound career\nadvice.Make sure that you choose your adviser carefully as they may provide you with great\ninsight.\n ④ Next,you will need to think about the abilities that you will need to fulfill your career\nplan.Assess your current work experience and past education;figure out any specific skills or\nknowledge you already have;identify any gaps that you will need to fill in order to meet your end\ngoal;and list any opportunities that you can take to improve the skills or knowledge that you have\nidentified\n ⑤Finally,you will need to identify the jobs that you would like to take.If you feel that you\nalready have the required skills and knowledge,apply for them.Even if you fail to get one,\nyou will gain some invaluable knowledge from the interview.\nTask 1\n A.The first step to make a career plan\n16.Paragraph① B.The reason for changing a career plan\n17.Paragraph② C.The right time to apply for desired jobs\n D.The necessity to get some career advice\n18.Paragraph③ E.The importance of having a career plan\n19.Paragraph④ F.The abilities to fulfill a career plan\n\f \n20.Paragraph⑤\nTask 2\n21.A career plan can give you\n22.When you choose a job,you should not focus on\n23.To gain career guidance,you should try\n24.To fulfill a career plan,you should\n25.A job interview can\n A.the salary alone B.to write it well\n C.get well prepared D.to find an adviser\n E.offer some useful knowledge F.a clear future direction","section4":"第四部分：填句补文(第 26～30 题，每题 2 分，共 10 分)\n 下面的短文有 5 处空白，短文后有 6 个句子，其中 5 个取自短文，请根据短文内容\n将其分别放回原有位置，以恢复文章原貌，并在答题纸相应位置上将答案选项涂黑。\n What Does Happiness Mean?\n Happiness in life differs for all of us. 26 Very often we are happy,but we just don\u0027t\nrealize it.If you think about what actually makes you happy,you might find you have those\nthings already around you.\n Your happiness depends entirely on you. 27 It is something inside you that you\nhave to find and work towards.You can take positive action and make changes to your life or\nyourself in order to achieve happiness.\n 28 The first step for you to do so is to look at your feelings and ask yourself\nquestions such as “if I could be enjoying something in my life,what would it be?\"and“what\nmakes me feel satisfied in my life right now?”Once you understand what your idea of happiness\nis,you can build on what you have now or focus on changing your life to what you would like it to\nbe.\n The important thing to do is to examine your feelings by way of the answers you give to your\nquestions. 29 You should also focus on the good or bad feelings you get from your\nquestions and answers.\n\f \n Happiness is something that is already right there inside you.You just have to realize what\nit is and bring it out to start enjoying life.It can be found in family life,work, relationships,nature\nor a pet,to name just a few. 30 The point is where to look.You should look in the right\ndirection,that is,your inner self.\n A.No one else can give it to you.\n B.You should examine them honestly.\n C.Happiness is easy to define.\n D.You should understand what happiness means to you.\n E.Actually,it can be found in anything and any situation.\n F.What makes one person happy may not bring happiness to another.","section5":"第五部分：填词补文(第 31～40 题，每题 1.5 分，共 15 分)\n 下面的短文有 10 处空白，短文后列出 12 个词，其中 10 个取自短文，请根据短文 内\n容将其分别放回原有位置，以恢复文章原貌，并在答题纸相应位置上将答案选项涂黑。\n Tips for Improving Your Body Image\n Some people think that they need to change how they look or act to feel good about\nthemselves.But actually all you need to 31 is change the way you see your body and\nhow you think about yourself.\n The first thing to do is 32 that your body is your own.If you\u0027re very worried about\nyour weight or size, 33 with your doctor to verify that things are OK.But it\u0027s no one\u0027s\nbusiness but your own what your body is like.Ultimately,you have to be happy with yourself.\n 34 identify which aspects of your appearance you can 35 change and which\nyou can\u0027t.Everyone has things about themselves that they can\u0027t change and need to accept,\nlike their height,for example,or their shoe size.\n If there are 36 about yourself that you want to change and can change(such as\nhow fit you are),do this by setting 37 for yourself. For example,if you want to get fit,\n38 make a plan to exercise every day and eat 39 foods.Then keep track of your 40\nuntil you reach your goal.Meeting a challenge you set for yourself is a great way to boost\nself-esteem!\n\f \n A.check B.things C.Instead D.goals\n E.Next F.do G.just H.healthy\n I.recognize J.method K.progress L realistically\n 非选择题部分","section6":"第六部分：完形补文(第 41～50 题，每题 1.5 分，共 15 分)\n 下面的短文有 10 处空白，每处空白后的括号内有一个词，请根据短文内容将其正\n确的形式填入文中，以恢复文章原貌，并将答案写在答题纸相应的位置上。\n Does Watching TV Relieve Stress?\n After a tough day,you may possibly (possible) turn on the TV. Getting 41 (lose)in your\nfavorite show seems like an 42 (effect) way to relax.But it may make things worse.\n It is 43 (general) believed that watching TV can 44 (able) people to relax.It\nprovides a temporary escape from stresses.However,the same can\u0027t be 45 (say)for those\nwho are busy and 46 (tire).Those people can feel guilty about 47 (spend) so much\ntime in front of the TV.They tend to see it as a form of procrastination( 拖 延 ). In other 48\n(word) ,they are avoiding other important things out of 49 (lazy) .They feel they are giving in\nto TV.That feeling 50 (keep) them from relaxing.","section7":"第七部分：短文写作(第 51 题，30 分)\n 请根据所提供材料中的要求完成一篇 100 词左右的英文写作任务。将你的答案写在\n答题纸相应的位置上。\n51.某英文报社正在举办题为 “Online Shopping” 的征文活动。请你根据下述写作要点提\n交一篇英文短文应征。\n● 你所了解的网上购物情况\n● 你对网上购物的看法\n\f \n 2024 年 4 月自考专升本英语\n （科目代码 13000）"}},"2410":{"title":"2024年10月","sections":{"section1":"第一部分：阅读判断(第1~10题，每题1分，共10分)\n下面的短文后列出了10个句子，请根据短文的内容对每个句子作出判断：如果\n该句提供的是正确信息，选择A; 如果该句提供的是错误信息，选择B; 如果该句的\n信息文中没有提及，选择C。在答题纸相应位置上将答案选项涂黑。\nThre Magic of Tidying Up\nIf you haven\u0027t worn your shoes lately,thank them for their hard work and consider\nletting them go.\"It is natural for me to say thank-you to the goods that support us,\"says\nMarie Kondo,the author of The Life-Changing Magic of Tidying Up.Her method of\nconnecting with belongings that\"spark joy\"and saying goodbye to the rest is popular all over\nthe world.\nKondo\u0027s method encourages a one-time rapid and dramatic organizing event.For her,\ntidying is to thank anything that doesn\u0027t \"spark joy\"and send them to a more appreciative\nowner.The results can be life-changing.People suddenly find themselves surrounded by\nthingsthat provide clarity(简洁).Even her book,Kondo says,should be thrown away when\nit\u0027s no longer needed.\nKondo suggested starting with clothes,then books,then documents,and last and most\ndifficult,photos and mementos(纪念品).Instead of deciding what to getrid of,she says,the\nfocus should be on what to keep:things that spark joy or are truly necessary.\n13000#英语(专升本)试题第1页(共8页)\nAfterjoyfully sending away mountains ofunneeded or unloved belongings,Kondo turns\nto organizing what is left.The key is storing things mostly in drawers,arranged so that\neverything can be seen at a glance and nothing is stacked.So T-shirts and socks(the ones\nyou\u0027ve kept because they make you happy)are rolled and arrangedbeautifully.\n1.Kondo wrote abook to help people maketheir home tidy\nKondo has been fond oftidying since she was five,enjoying arranging shoes and pencils \nwhile other kids played outside.She believes the inside of a house should be a place where \nthere are no unnecessary things,and our thoughts become clear.It is the place where we \nappreciate all the things that support us.It is where we review and rethink about ourselves.\n.\nA.True\nB.False\nC.Not Given\n2.The Life-Changing Magic ofTidying Upis a bestseller.\nA.True\nB.False\nC.Not Given\n3.Kondo\u0027s method encourages slow and gradual organizing.\nA.True\nB.False\nC.Not Given\n4.Most people throw Kondo\u0027s book away after reading it\nA.True\nB.False\n、C.Not Given\n5.Kondo says clothes arethe items tobe thrown awav.fist.\nA.True\nB.False\nC.Not Given\n6.Deciding what to send away iś more important than what to keep.\nA.True\nB.False\nC.Not Given\n7.T-shirts should be kept one upon another in drawers.\nA.True\nB.False\nC.Not Given\n8.Kondo became interested in tidyingat theage of five.\nA.True\nB.False\nC.Not Given\n9.Kondo\u0027s own house is small but clean.\nA.True\nB.False\nC.Not Given\n10.Kondo believes a well-organized house makes people\u0027s mind clear.\nA.True\nB.False\nC.Not Given\n13000#英语(专升本)试题第2页(共8页)","section2":"第二部分：阅读选择(第11~15题，每题2分，共10分)\n阅读下面短文，请从短文后所给各题的4个选项(A、B、C、D)\n中选出1个最佳\n选项，并在答题纸相应位置上将该项涂黑。\nThe Grand in Grandmother\nWhen I was growing up,my parents took teaching jobs in a remote town,leaving me in\nthe careof my grandmother.\nNanay,as we called her,did not hug or kiss children.Her tongue was sharp and her\nwords harsh.She was a tyrant(独裁者),but she was there.As early as I could remember,\nNanay had always been apartof my life.Ibelievedgrandmothers livedforever.\nShe taught me many lessons,though I often ignored them.Nanay urged me never to\naccept second-best.For her,\"good enough\"was never enough,from the grades you bring\nhome from school to the serviceyou receive in restaurants.\nWhen I was 13,Nanay sent me to Manila to attend high school,and I stayed there for\nuniversity.I came back each summer,but after I gotmarried the.visits became less frequent.\nSoon all of her grandchildren had moved out.Nanaywas lettonzner own.In her letters to me,\nshe wrote of how lonelyshe was,but I never made théetórt tospend more time with her.\nNanay died last year.She\nwas\n83,Afer the funeral,I went to\nour\nold house.\nGrandmother had kept so many thines:Hom mv ohildhood:the toys;the letters I wrote home\nin my high school and university years,either asking for more rice or thanking her for sending\nfruit.Photos of her grandchildren were on display in the living room.\nWhen I visited her grave and reflected on all her birthdays I had allowed to pass,I was\nfilled with sorrow.I thought about all the stories she never got a chance to tell me,about her\nlife,about the girl she once had been,about the town I left behind.It occurred to me that\nperhaps shedid not tell me because I did not know how to ask.\n11.The author was left in the care of Nanay because\nA.his parents worked far away\nB.Nanayloved\nchildren\nC.he wanted to stay with Nanay\nD.Nanay was a good teacher\n13000#英语(专升本)试题第3页(共8页)\n12.In his childhood,the author thought that Nanay was\nA.friendly\nB.unkind\nC.lonely\nD.patient\n13.According to the author,Nanay\nA.ignored teaching the children\nB.received little education\nC.urged him to work for the best\nD.preferred to live on herown\n14.The author felt sad because he missed\nA.the stories about Nanay\nB.Nanay\u0027s\nfuneral\nC.the photo display of Nanay\nD.Nanay\u0027slessons\n15.The tone ofthe text can be described as\nA.humorous\nB.joyful\nC.critical\nD.regretful","section3":"第三部分：概括段落大意和补全句子(第16～25题，每题1分，共10分)\n阅读下面短文，请完成短文后的2项测试任务：(1)从第16~19题后所给的5个\n选项中为第①~④段每段选择1个正确的小标题；(2)从第20～25题后所给的7个选\n项中选择6个正确选项，分别完成每个句子。在答题纸相应位置上将答案选项涂黑。\nExercise and Dietiing\nIf you are overweight,it eeuła lead,to health conditions including increased blood\npressure or heart disease.If you\u0027re !worried about how heavy you are,ask the doctor for\nadvice.If you only have to lose some weight,the best thing to do is stop eating when you are\nfull,eat healthily and get more energetic.\n①\nBecoming more active isthe best way of burning off those additional calories(卡路里).\nYou don\u0027t need go to the gym to do this.Just increase the amount of walking you do each day\nor just go for a bike ride.You put on weight if you eat more than you need;this is because\nyou accumulate any energy notused into fat.\n②\nEveryday you should drink about 8 glasses of water.You will need more if the weather\nis hot or while youare doing physical activity.Try to cut down on those drinks high in sugar.\n③\nYou don\u0027t need to give up drinking alcohol,but too much drinking can cause harm.\nDrinking less canhelp lose pounds.The guideline for women is 3 units per day,and for men,\n4 units per day.A good goal for better health is to stretch your drinking over a week and not\nsave it for theweekends.Overdrinking for a long time can also harm the liver.\n13000#英语(专升本)试题第4页(共8页)\n④\nNever skip breakfast,as it provides you with energy to keep you going through the day.\nMany people miss breakfast thinking ithelps them lose extra pounds.But it doesn\u0027t at all,and\neven worse,they can lose out on minerals and vitamins.It is clear that eating breakfast can\nhelp control your weight.\nTo sum up,if youare thinking aboutgoing onadiet,make sure you consider the above\nguidelines.\nTask 1\nA.Seeing a doctor\nB.Having breakfast\nC.Drinking enough water\nD.Doing physical exercise\nE.Drinking alcoholmoderately\nTask 2\n20.Before losing weight,you\u0027d better\n21.The unused energy will be accumulated\n22.You should reduce drinks rich\n23.Women are advised to drink\n24.Longtime overdrinking may\n25.Missing breakfast may cause\nA.into fat\nB.in\nsugar\nC.harm the liver\nD.seek advice from a doctor\nE.3 units of alcoholevery day\nF.a lack of minerals and vitamins\nG.4 glasses of watereach day\n13000#英语(专升本)试题第5页(共8页)\n16.Paragraph\n①:\n17.Paragraph ②:\n18.Paragraph\n③:\n19.Paragraph ④:","section4":"第四部分：填句补文(第26～30题，每题2分，共10分)\n下面的短文有5处空白，短文后有6个句子，其中5个取自短文，请根据短文内容\n将其分别放回原有位置，以恢复文章原貌，并在答题纸相应位置上将答案选项涂黑。\nEnjoy Yourself and Improve Your English\nOne student Iknew in Tanzania was thedaughterof a school teacher.On the first day of\nthe long school holidays,a whole set of graded English books arrived at her house.\n26\nThe daughter readthem all,starting from the easiest and working up to the most difficult.The\nholidays passed quickly and when the new school term started,she was far ahead of her\nclassmates in English.\n27\nI think there are three.First,learning a new language takes time and practice.It\nis the same with any skill,like swimming.There are no quicker ways.\nSecond,successful learning means moving from the easy to the difficult.\n28\nYou\nhave to play very simple tunes before you move on,step by step,to more complex ones.\n29\nThe student was not trying to improve her ,Enelish,though her English did\nimprove.She liked the stories and was using them,tepass the time.She became better at\nEnglish without knowing it.Her brain was learning the language while she was concentrating\non the stories.\nHowever,many students give two,main reasons for not reading much. 30\nI am\nafraid this reason is very weak and simply not true.The other reason is that they do not enjoy\nit.This reason is stronger.In fact it can be divided into two.You may not enjoy reading\nbecause either the language is difficult,or the stories are boring.\nA.One is that they have no time.\nB.Why don\u0027t students read more?\nC.What lessons does this story teach us?\nD.Her mother had bought them for the school.\nE.Third,reading stories in a new language is enjoyable.\nF.This isjust like learning to play the piano.\n13000#英语(专升本)试题第6页(共8页)","section5":"第五部分：填词补文(第31～40题，每题1.5分，共15分)\n下面的短文有10处空白，短文后列出12个词，其中10个取自短文，请根据短文\n内容将其分别放回原有位置，以恢复文章原貌，并在答题纸相应位置上将答案选项涂黑。\nMy Little Niece\nMy little niece,a ten-month-old baby,is themost lovely child I have ever seen.Her face\nis like a red apple and her eyes are like\n31\nstars.When you carry her in your arms,she\nlikes to put her arms around your neck.All the.\n32\nin the family love her very much and\noften try to make her smile.But quite\n33\nit is she who makes us\n34\n.Once I\nwinked(眨眼)at her and she smiled.When I did it again,she watched me\n35\n.Then she\ntried to imitate.While I closed one eye to wink,she had to close\n36\neyes at the same\ntime,and then.\n37\nopened them again.And that was her way to wink.We all\n38\ninto laughter.When we looked at her again,she was staring at us,puzzled,as if she\nwere\n39\n,\"What are youlaughingat?\"We all love this\n40 little baby.\nA.laugh\nB.both\nC.drink\nD.grown-ups\nE.attentively\nE,usking(\nG.cute,\nH.flowers\n.\nI.burst\nJ.often\nK.bright\nL.quickly\n13000#英语(专升本)试题第7页(共8页)\n非选择题部分\n注意事项：\n用黑色字迹的签字笔或钢笔将答案写在答题纸上，不能答在试题卷上。","section6":"第六部分：完形补文(第41～50题，每题1 .5分，共15分)\n下面的短文有10处空白，每处空白后的括号内有一个词，请根据短文内容将其正\n确的形式填入文中，以恢复文章原貌，并将答案写在答题纸相应的位置上。\nObserving the Nature\nNature is amazingly (amazing) complex.Every day many different things happen\nin\nnature.Look around and observe.What do you see happening?\n41\n(Live)things grow and die as\n42\n(season)change.In nature,even the\nquietest place is not empty,because insects fill the air.Nature is so\n43\n(vary)that\nthere\nare millions of kinds of plants and animals to study.Time and patience are\n44\n(need)to\nlearn from nature.And that\u0027s\n45\n(particular) true of the sfudy of animals.\nYou can\u0027t just press a button on a bird and havei tell.you how fast it can fly.And\nmonkeys don\u0027t wear\nsigns\n46\n(tell)you how they také care of their young.To learn\nthese things,you have to observe.\n47\n(Scientist) observe animals in.different ways.And eachof them\n48\n(give)\nthe world something through their observations.Some help us make sense of the\n49\n(nature)world.Others help us see the.\n50\n(important)of\nprotecting\nit.","section7":"第七部分：短文写作(第51题，30分)\n 请根据所提供材料中的要求完成一篇100词左右的英文写作任务。将你的答案写在\n答题纸相应的位置上。\n51.\n 某英文报社正在举行征文活动，请你以“Uses of the Internet” 为 题\n 写一篇英文短文应征，内容包括：\n ● 你 常用 网 络 做哪 些 事\n ● 网络对你的生活有何影响\n (共8页)\n\f  2024年10月高等教育自学考试全国统一命题考试\n 英语(专升本)试题"}},"2504":{"title":"2025年4月","sections":{"section1":"第一部分：阅读判断(第1～10题，每题1分，共10分)\n 下面的短文后列出了10个句子，请根据短文的内容对每个句子作出判断：如果\n 该句提供的是正确信息，选择A; 如果该句提供的是错误信息，选择B; 如果该句的\n 信息文中没有提及，选择C 。在答题卡相应位置上将答案选项涂黑。\n The History of Coffee Houses\n Today,the idea of a coffee house usually brings to mind a cozy(惬意的)place that\n serves delicious coffee.So how did the coffee house get started?\n The first record of a public place serving coffee dates back to 1475.Kiva Han was the\nfirst coffee shop,located in Istanbul,Türkiye.Coffee was a very important item during that\nperiod.It was even legal in Türkiye for a woman to divorce her husband if he could not\nsupply her with enough coffee.\n The idea of adding cream and sugar to coffee came into fashion in Europe around 1529,\nwhen the first coffee house in Europe was established.Vienna was invaded by the Turkish\narmy.They left many bags of coffee beans behind when they fled the city.An Austrian who\nhad lived in Türkiye was the only person who recognized the value in the beans.He opened a\ncoffe house and introduced the idea of filtering(过滤)coffee,as well as softening coffee\nwith milk and sugar.\n 英语(专升本)第1页(共17页)\n\f Coffee establishments continued to spread,with the first one opening up in Britain in\n1652.And it was in an English coffee house that the word \"tips\"was first used.A\n jar with a sign reading \"To Insure Prompt Service\"sat on the counter.You put a coin\nin thejar to be served quickly.\n The British called their coffee houses \"penny universities,\"because that was the price for\nthe coffee and the social upper-class of businessmen were found there.From there,the idea\nspread further through Europe and eventually to America.The role of the American\ncoffee houses was the same as that in England:hotspots for the business community.\n And who could forget the most popular coffee house chain of all,Starbucks?They\nopened their first store in 1971,in Seattle,and have taken the world by storm with over 8,000\nlocations.\n 1.Kiva Han was the world\u0027s oldest coffee house.\n A.True B.False C.Not Given\n 2.Turkish men often bought coffee as a gift for the marriage proposal.\n A.True B.False C.Not Given\n 3.It was in Europe that people started to add cream to coffee.\n A.True B.False C.Not Given\n 4.The Turkish people enjoyed having their coffee black.\n A.True B.False C.Not Given\n 5.Coffee beans were first brought to Europe as a gift from Türkiye.\n A.True B.False C.Not Given\n 6.Before 1529,there were many coffee houses in Europe.\n A.True B.False C.Not Given\n 7.The British started tipping in order to get served more quickly.\n A.True B.False C.Not Given\n 8.Many coffee houses were opened in British universities.\n A.True B.False C.Not Given\n 9.American businessmen often met at coffee houses.\n A.True B.False C.Not Given\n10.Starbucks opened its first coffee house in 1652.\n A.True B.False C.Not Given\n 英语(专升本)第2页(共17页)","section2":"第二部分：阅读选择(第11~15题，每题2分，共10分)\n 阅读下面短文，请从短文后所给各题的4个选项(A、B、C、D ) 中选出1个最佳\n选项，并在答题卡相应位置上将该项涂黑。\n The Spread of Cats\n Today\u0027s house cats all come from a single type of wildcat.Researchers believe that it\nwas originally from the Near East,in a region from moden-day Türkiye down to Lebanon\nAround 10,000 years ago,farmers began storing grain.The grain attracted mice.Cats could\nhelp out with that.\n The same type of cats also ruled in Ancient Egypt.They left their traces in statues and\npaintings.Researchers wondered how these two separate lines led to today\u0027s worldwide\nsuccess of cats.Unlike other archaeologists(考古学家),Eva-Maria Geigl studied DNA\ninstead of bones.\n Combining the genetic information with other records,the researchers figured out the cats\u0027\npaths.After cats befriended(亲近)the Near East farmers,they began to appear on farms in\nother places.One example is a 9,500-year-old cat buried in a human grave on the island of\nCyprus.There were no wild cats on the island.They must have come from somewhere else\nHumans must have brought them on a boat.\n A second wave of cats began living with humans in Egypt 2,500 years ago.The new\nstudy shows that during Roman times,these Egyptian cats also began expanding through the\nMediterranean (地中海).They mixed with the Near East cats and then went farther.They\nwent through Europe and into Southwest Asia.\n When the Viking age began,the expansion of Egyptian cat families exploded.It was\nlikely due to the popularity of using ship cats to kill rats.\"Rats on ships not only eat and spoil\nthe food,they also destroy the ropes,so rats could be a disaster for sailors,\"says Geigl.\"Cats\nprevent these types of disasters.\"\n11.The first cats were believed to come from\n A.Egypt B.the Far East\n C.the Near East D.East Asia\n12.How does Geigl study the spread of cats?\n A.By following their traces. B.By analyzing their statues.\n C.By examining their bones D.By testing their DNA\n (共17页)\n\f13.The cat found in the Cyprus grave was probably.\n A.born on the island B.brought to the island\n C.the world\u0027s first wild cat D.the world\u0027s first pet cat\n14.The cats in Southwest Asia were originally from\n A.Egypt B.Cyprus\n C.Europe D.the Mediterranean\n15.Who contributed most to the spread of cats during the Viking age?\n A.Researchers. B.Painters. C.Farmers. D.Sailors.","section3":"第三部分：概括段落大意和补全句子(第16~25 题，每题1分，共10 分)\n 阅读 下面 短文 ，请 完成 短文后 的2项测 试任 务： (1) 从第 16~20 题后 所给 的6个\n选项中为第0~ ⑤段每段选择1个正确的小标题；(2) 从第21~25 题后所给的6个选\n项中选择5个正确选项，分别完成每个句子。在答题卡相应位置上将答案选项涂黑。\n The Pony(小马)Express\n①In 1848,gold was found in California.Thousands of people rushed there.But the train\nline to California wasn\u0027t finished until 1869.It took a long time to ride a horse from\nCalifornia to Missouri.What would you do ifyou wanted to send a message?Well,you could\nuse the Pony Express.\n② In 1860 and 1861,the Pony Express was the fastest way to get news to and from the\nWest.The road was around 2,000 miles long.It took most people weeks or months to ride that\nfar.The Pony Express could make it injust 10 days.Those speeds were unheard of then.How\ndid they do it?Well,they had a good system.\n③ The Pony Express had 184 stations along the road.The stations were about 10 miles\napart.This is about how far a horse could run before tired.The rider would switch to a new\nhorse at each station.Every 75-100 miles,the rider would get to a home station,where riders\nwould rest.Before resting,he would give his mail bag to a new rider.The mail never stopped\nmoving,while the horses and riders rested.\n④ It was tough to ride for the Pony Express.Each rider had to weigh less than 125 pounds.\nSpeed was the key.Most riders were teenage boys.They rode up to 100 miles a day.The ride\ncould be dangerous.Attacks by local people were common.But in its running time,the Pony\nExpress lost only one mail bag.\n (共17页)\n\f⑤The Pony Express flled an important role for a time,bu t did not last.The Civil War\nstarted in 1861.Things got worse when the first telegraph line to California was finished later\nthat year.People could send messages by telegraph instantly.Soon the Pony Express closed\nBut the story of the brave riders lives on\nTask 1\n A.The end of riders\u0027business\n16.Paragraph ①:\n17.Paragraph ②: B.The fastest message service\n C. The comfortable home station\n18.Paragraph ③:\n19.Paragraph ④: D.The effective system to send mail\n20.Paragraph ⑤: E.Safe delivery despite the tough ride\n F.Need ofmessage exchange in the gold rush\nTask2\n21.People rushed to California\n22.To ride 2,000 miles took the Pony Express\n23.There were adequate stations to\n24.Most riders had to\n25.The telegraph appeared\n A.only ten days\n B.for a better life\n C.a couple of months\n D.be young and brave\n E.switch horses and riders\n F.after the outbreak of the Civil War\n (共17页)","section4":"第四部分：填句补文(第26～30 题，每题2分，共10 分)\n 下面的短文有5处空白，短文后有6个句子，其中5个取自短文，请根据短文内容\n 将其分别放回原有位置，以恢复文章原貌，并在答题卡相应位置上将答案选项涂黑。\n Work is a Blessing\n I grew up in Lakeland,LA,one of 12 children.We all lived on my parents\u0027farm.We\n grew cotton,corn and had a large garden,but it didn\u0027t bring in much cash. 26 We\n milked 65 cows at 5 in the morning and again at2 in the afternoon,seven days a week.\n One Saturday before daylight,I remember complaining to my father and grandfather\n about having to milk those cows.My father said,\"You know,boy,to work is a\n blessing.\". 27 However,it took many years before it sank in\n Going to college was a rare privilege for a kid from Lakeland. 28 So I joined the\nROTC program to help pay for college.And what started out as an obligation to the Army\nbecame a way of life that I stayed committed to for 37 years,three months and three days.\n In the late 1980s,during a visit to Bangladesh,I saw a woman with a baby on her back,\nbreaking bricks with a hammer.I asked a Bangladesh military officer why they weren\u0027t using\na machine,which would have been a lot easier. 29 Breaking those bricks meant she\ncould earn enough money to feed herself and her baby that day.And as bad as that woman\u0027s\njob was,it was enough to keep a small family alive. 30\n A.I don\u0027t think I will ever quit working\n B.However,I still wanted to go to college.\n C.He told me a machine would put that lady out of work.\n D.I had a feeling I had been told something really important.\n E.It reminded me of my father\u0027s words:To work is a blessing\n F.So when I was 12,I got a part-timejob helping to milk cows.\n 13 0 0 0 英 语 ( 专 升 本 ) 第 6 页 ( 共 17 页 )\n\f第 五 部 分 ： 填 词 补 文 ( 第 31 ~ 40 题 ， 每 题 1. 5 分 ， 共 15 分 )\n 下面的短文有10处空白，短文后列出12个词，其中10个取自短文，请根据短文\n 内容将其分别放回原有位置，以恢复文章原貌，并在答题卡相应位置上将答案选项涂黑。\n The Impact of Artificial Intelligence(人工智能)on Jobs\n As you grew up,there\u0027s a good chance you heard the saying\"go to a good school,get a\n good job,and make lots of money.\"On the surface,that seems like 31 advice.After\n all,college graduates,on 32 earn almost $1 million more in their lifetime than those\n with 33 a high school education.\n Perhaps you were encouraged to earn a professional degree to 34 a high-paying\n job like a doctor,dentist,lawyer or something 35 .This also seems like great advice.A\n professional degree holder 36 earns more than $2 million more in their lifetime than the\n average college graduate.But that was then,not now.\n Thanks to rapid 37 in artificial intelligence,jobs are falling to machines.And it\u0027s\n not just blue-collar jobs that are being taken 38 by automation (自动化).It\u0027s\n white-collar professions as well.\n  upkeep. And\nit is viewed as an essential, ongoing investment. What I saw here was much more of a\ntendency toward the quick solution. Millions of American women consider beauty a priority\nin their daily routine. However, many of their habits are either too expensive, too painful, or\nsimply not effective.\"\n1. French women are more stylish in the eyes of American women.\nA. True\nB. False\nC. Not Given\n2. Caudalie is an American beauty brand.\nA. True\nB. False\nC. Not Given\n3. Thomas thinks that beauty is a privilege for the young.\nA. True\nB. False\nC. Not Given\n4. Thomas went to America to promote her beauty products.\nA. True\nB. False\nC. Not Given\n5. American women base their idea of beauty on pleasure.\nA. True\nB. False\nC. Not Given\n6. French women share Thomas\u0027 notion of beauty.\nA. True\nB. False\nC. Not Given\n7. French women invest more in beauty products than before.\nA. True\nB. False\n8. American women prefer a quick solution to their beauty problems.\nA. True\nB. False\nC. Not Given\nC. Not Given\n9. American women like Thomas\u0027 beauty products.\nA. True\nB. False\nC. Not Given\n10. American women\u0027s beauty routine is based on prevention.\nA. True\nB. False\nC. Not Given","section2":"An Important Piece of Life Advice for the Young\nI spend a lot of time interviewing older people in my research on their lives. In one\nproject, I asked them the question: \"What can young people do to avoid having regrets when\nthey come to the end of life?\" One of the most important messages they have for younger\npeople is to travel-and to do it now.\nAn old woman once told me that among the most regretful elders she knows are those\nwho put off travel until it was too late—a mistake she almost made if it had not been for her\nhusband. Her husband said, \"I\u0027m not waiting until I retire. Who knows what things will be\nlike then?\"\nSo, here\u0027s a clear opportunity to avoid a future regret: travel in your first 30 years, while\nyou have time and energy. This message comes from some of the elders who delayed travel\nuntil it was too late. One 86-year-old lady I talked to had spent her life close to home. With a\nsad look in her eyes, she told me: \"I always wanted to go to Hawaii, but I never made it. Oh,\nit\u0027s too late for me.\"\nI can hear some people saying: That\u0027s all well and good, but how can we afford it? The\nelders counter that argument by saying that travel is so rewarding that it should take\nprecedence over other things younger people spend money on. The key is travel\u0027s value\nspecifically for the young; it broadens their horizons, helps them to find a focus for their lives,\nand challenges them in new ways.\nOf course, travel is by no means only for the young. Seeing the world is also important\nin the middle 30 years and the last 30 years. Travel is just that important to feeling like your\nlife has been well-lived.\n11. The writer of this text is most probably a\nA. technician\nB. librarian\nC. researcher\nD. consultant\n12. What can we infer about the old woman and her husband?\nA. They had many regrets in their life.\nB. They traveled a lot before retirement.\nC. They made a big mistake in their work.\nD. They delayed travel until it was too late.\n13. According to Para. 4, the elders think that younger people should\nA. give priority to travel\nB. make time for their families\nC. find a focus for their lives\nD. work hard to save money\n14. The 86-year-old lady feels sad as she can no longer _\nA. stay in Hawail\nB. go on a tour\nC. live close to home\nD. take care of herself\n15. The writer of the text thinks that travel is a\nA. great midlife activity\nC. lifestyle for the young\nB. challenge for the old\nD. lifelong engagement","section3":"Benefits of Spending Time with Animals\n• A pet treatment can solve all sorts of problems, says animal expert Arden Moore.\nSpending time around animals, like bird-watching, being accompanied by a therapy dog, or\nplaying with a pet spider, can be good to your well-being. \"There\u0027s something about the\nanimal kingdom that enables us to enjoy life a little better,\" she says.\n2 According to Moore, petting your cat or dog makes the animal happy, and it relaxes you\nas well. It is especially so when you are under some stress. \"Give your dog or cat a\nhead-to-tail rub by running hand over hand through the body,\" she says. Your touch relaxes\nthe animal. It also releases feel-good hormones (fij/K3k) in you, and reduces your heart rate.\n3 Talking with animals may lower your blood pressure and improve your overall health.\nMoore suggests engaging animals in \"happy talk,\" or speaking in a cheerful tone. She says,\n\"Happy talk or laughter around animals releases hormones in humans. Then, your blood\npressure will be lowered. And animals will feel better too.\"\n• Eating beside an animal may improve your eating habits. \"In nursing homes, if there\u0027s a\nfish tank where people are eating, seeing those fish actually motivates some residents to eat,\"\nsays Moore. The result of recent research supports the view. It shows that the people who ate\nnear their pets improved some of their eating patterns.6 A good relationship with your animal friends may lead to better relations with humans.\nAccording to a study at the University of Michigan School of Nursing, observing animals in\nnature can teach valuable characteristics like patience, and help restore mental energy. Taking\ncare of an animal can also teach responsibility and stimulate feelings of trust, openness, and\ncompanionship.\n\nTask 1\n16. Paragraph O:\n17. Paragraph 2:\n18. Paragraph B:\n19. Paragraph 4:\n20. Paragraph 6:\nA. Animals help reduce your stress.\nB. Animals improve human relationships.\nC. Animals make your life more enjoyable.\nD. Animals can change your way of life.\nE. Animals help improve your eating habits.\nF. Animals help lower your blood pressure.\nTask 2\n21. Playing with your pet is good\n22. When you\u002 ou look\ngood.\"\nIn 2010, she went to the U.S. to expand her brand. She traveled all over the country\nmeeting customers. She found that the American concept of beauty was more about pain than\npleasure. Many women said they made their beauty choices based on the notion of \"no pain,\nno gain.\" They thought they had to suffer to be beautiful. In contrast, she and French women\nbelieve the notion of beauty should be pleasing to you.\nThomas\u0027 book discusses how women in the U.S. are all about the \"quick fix.\" This\nmeans they will try a product that will instantly solve a beauty problem. They don\u0027t care if ithurts, is expensive, or is damaging in the long run. That\u0027s quite different from the French\nview of beauty. In the book, Thomas sees the French view as an essential and pleasing part of\nthe day. It is also a lifelong and active investment that makes you look and feel good.\nIn the book, Thomas says, \"Our beauty routine is based on prevention and upkeep. And\nit is viewed as an essential, ongoing investment. What I saw here was much more of a\ntendency toward the quick solution. Millions of American women consider beauty a priority\nin their daily routine. However, many of their habits are either too expensive, too painful, or\nsimply not effective.\"\n1. French women are more stylish in the eyes of American women.\nA. True\nB. False\nC. Not Given\n2. Caudalie is an American beauty brand.\nA. True\nB. False\nC. Not Given\n3. Thomas thinks that beauty is a privilege for the young.\nA. True\nB. False\nC. Not Given\n4. Thomas went to America to promote her beauty products.\nA. True\nB. False\nC. Not Given\n5. American women base their idea of beauty on pleasure.\nA. True\nB. False\nC. Not Given\n6. French women share Thomas\u0027 notion of beauty.\nA. True\nB. False\nC. Not Given\n7. French women invest more in beauty products than before.\nA. True\nB. False\n8. American women prefer a quick solution to their beauty problems.\nA. True\nB. False\n "\nsays Moore. The result of recent research supports the view. It shows that the people who ate\nnear their pets improved some of their eating patterns.6 A good relationship with your animal friends may lead to better relations with humans.\nAccording to a study at the University of Michigan School of Nursing, observing animals in\nnature can teach valuable characteristics like patience, and help restore mental energy. Taking\ncare of an animal can also teach responsibility and stimulate feelings of trust, openness, and\ncompanionship.\nTask 1\n16. Paragraph O:\n17. Paragraph 2:\n18. Paragraph B:\n19. Paragraph 4:\n20. Paragraph 6:\nA. Animals help reduce your stress.\nB. Animals improve human relationships.\nC. Animals make your life more enjoyable.\nD. Animals can change your way of life.\nE. Animals help improve your eating habits.\nF. Animals help lower your blood pressure.\nTask 2\n21. Playing with your pet is good\n22. When you\u0027re petting your pet,\n23. Your pet will feel happy\n24. Eating near your pet,\n25. You may develop your patience by watching animals\nA. in nature\nB. if you keep a pet\nC. to your well-being\nD. when you talk with it\nE. you\u0027ll have a better appetite\nF. your heart rate will be reducedWhat is Green Tourism?\nThe aim of green tourism is to protect the environment and culture of an area. There are\nmany choices for green tourism worldwide.\nThe number of tourists has been increasing these days. It makes green tourism a must in\nsome areas. In order to protect the environment, it might seem wiser to ban tourists to these\nareas. But many areas need the income from tourism for their local economy. Green tourism\noffers the best solution to both. 26 At the same time, it keeps local businesses growing.\nGreen tourism might not mean a vacation spent with little or no comfort. -\n27 Green\ntourism resorts exist in almost every style and taste. From recycling systems to tree houses,\nthere are many vacation choices.\nOn a green holiday, people study the local plants and culture..\n28\n. Guides, tours and\nwildlife-viewing platforms help people experience a lot. But little or no impact is made on the\nenvironment. Sometimes, tourists can take an active part in improving the local area. They\ncan work to protect the wildlife in the area. They can help to build a school. 29 These\nvacations can be a lot of work. But people find them very rewarding and interesting.\nNowadays, green tourism is becoming more popular. 30 More areas will take steps\nto have less of an impact on the environment, allowing tourists to enjoy the beauty that these\nareas have to offer for many years to come.\nA. They also learn ways to protect them.\nB. It protects the environment of an area.\nC. They can do other things that are good for the area.\nD. Its effects need to be further studied.\nE. So there are likely to be more vacationing options available.\nF. On the contrary, people think that it can be a wonderful adventure.The Word \"Try\"\nThe word \"try\" is a small word yet it has an amazing impact upon us. If someone says,\n\"T\u0027ll try to do that,\" you\nnot even do it at all. How\n31\n33\n. that they will not put their whole 32\ninto it, and may\ndo you use the word \"try\" when talking about the things\nthat 34 to you?\nThink about something that you would like to-\n_ say it to yourself in two\n36\nways, and see how you feel. Firstly say, \"I\u0027ll try to...\" and 37 say, \"I will do...\"\nThe latter makes you feel\n38 than the former, right? It gives you a sense\nof 39_. Listen to the people around you. When they say they will try, notice if it gets done\nor not. Eliminate the word \"try\" from your\n40\n_and see how your life improves.\nA. matter\nB. different\nC. determination\nD. only\nE. achieve\nF. know\nG. smart\nH. next\nI. often\nJ. better\nK. dictionary\nL. heart***I:","section6":"Communication in Groups\nThe number of people in a group influences (influence) the quality of communication.\nConsider ularly eat around fifty bananas a day to stay healthy. Fifty bananas! I\n quickly realised that this was not the diet for me. However, what she was saying about veganism did pique my\n 太\n interest. And I went on to watch many more vegan videos. Eventually, I switched to veganism about six months\n ago.\n 院\n 锡\n My diet at the moment is split roughly equally between fruit and grains such as rice and potatoes. In a typical\n day, I start off with a fruit drink made of bananas, berries and orange juice. For lunch I typically have potato fries\n with a sweet sauce. For dinner I normally have rice with a tomato sauce and some vegetables. I even make tasty\n 学\n 无\n vegan puddings. One of my favourites is coconut cream mixed with chocolate powder and sugar.\n While veganism is often associated with physical weakness, that is certainly not the case for me. I have\n 湖\n discovered many delicious vegan products, which one might never consider as vegan.\n Personally, eating this way has given me a much more positive outlook on life. Another vegan Kristina’s\n 太\n story is even more amazing. Kristina was bitten by a deadly spider. She was not given the medicines required to\n survive the bite. Yet she made a full and speedy recovery. She attributes it to the magic power of a vegan lifestyle.\n 院\n 11. According to Paragraph 1, a vegan diet is ________.\n 锡\n A. advised by food experts B. familiar to most people\n C. followed by many people D. free from animal products\n 学\n 无\n 12. The author knew the vegan lifestyle through ________.\n A. online videos B. her friends C. vegan books D. TV programs\n 湖\n 13. The word “pique” (Para. 2) probably means “________”.\n A. express B. arouse C. expand D. protect\n 太\n 14. The author believes that her vegan diet is ________.\n A. healthy B. cheap C. sugar-free D. low-salt\n 锡\n 院\n 15. Kristina is mentioned because she ________.\n A. attracted a lot of fans B. had a positive attitude toward life\n 无\n 学\n C. went on a special fruit-based diet D. quickly recovered from a spider bite\n湖\n太\n 院\n 英语（专升本） · 课程代码 13000 第 2 页 / 共 6 页\n\f 锡","section3":"第三部分：概括段落大意和补全句子（第 16～25 题，每题 1 分，共 10 分）\n 阅读下面短文，请完成短文后的 2 项测试任务：（1）从第 16～20 题后所给的 6 个选项中为第\n 无\n ①～⑤段每段选择 1 个正确的小标题；（2）从第 21～25 题后所给的 6 个选项中选择 5 个正确选项，\n 分别完成每个句子。在答题卡相应位置上将答案选项涂黑。\n Bottled Water\n 太\n ① Over the last 15 years, more and more people in the US have been drinking bottled water. There is no sign of\n slowing down. In fact, sales of bottled water are going up faster than any other kind of drink. It is true even in\n cities where it is safe to drink tap water. This has been a disaster for the environment and for our health.\n 锡\n 院\n ② Most bottled water comes from underground water. Much of this underground water could have flowed into\n rivers and lakes. Using this water can make droughts ( 干 旱 ) more serious. Many companies use water from\n 无\n 学\n mountain glaciers (冰川), but this is not much better. When the glacier melts, the water usually flows to areas like\n rivers or wetlands. When companies take glacier water, they take it from areas that need it.\n 湖\n ③ It takes about 1.6 liters of water to make one liter of bottled water. This wastes a lot of water. Also\n transporting the bottled water to stores burns fuel and creates pollution. The problems do not stop when the water\n reaches people who buy it. Water bottles are made from plastic which does not break down. Although it can be\n 太\n recycled, people usually do not put it in the recycle can.\n ④ Some may say that bottled water is safer and healthier than tap water. But that is not true. Sometimes\n 院\n 锡\n chemicals or bacteria get into bottled water, and companies have to destroy them. Actually, tap water is often\n healthier than bottled water. Bottled water may lack fluoride (氟化物) which helps protect our teeth. Fluoride is\n 学\n 无\n found in tiny amounts in tap water.\n ⑤ Obviously, more people need to know that tap water is safer and healthier. Unfortunately, tap water cannot\n 湖\n advertise itself. When a product that is cheaper and better does not win, that is bad news. When the product is\n water, we all lose.\n Task 1\n 太\n 16. Paragraph ①: ________ A. Making droughts worse\n 院\n 锡\n B. Harmful elements in bottled water\n 17. Paragraph ②: ________\n C. Need for a better image of tap water\n 18. Paragraph ③: ________\n D. Growing attention to tap water\n 学\n 无\n 19. Paragraph ④: ________\n E. Causing waste and pollution\n 20. Paragraph ⑤: ________ F. Increasing sales of bottled water\n 湖\n Task 2\n 太\n A. in tiny amounts\n 21. City people prefer bottled water ________.\n B. towards tap water\n 22. Taking water from glaciers helps little ________.\n 锡\n 院\n C. does harm to the environment\n 23. Transportation of bottled water ________.\n D. brings more health benefits\n 24. Compared with bottled water, tap water ________.\n E. with the problem of drought\n 无\n 学\n 25. People need to change their attitude ________.\n F. despite the safety of tap water\n湖\n太\n 院\n 英语（专升本） · 课程代码 13000 第 3 页 / 共 6 页\n\f 锡","section4":"第四部分：填句补文（第 26～30 题，每题 2 分，共 10 分）\n 下面的短文有 5 处空白，短文后有 6 个句子，其中 5 个取自短文，请根据短文内容将其分别放回\n 无\n 原有位置，以恢复文章原貌，并在答题卡相应位置上将答案选项涂黑。\n Bird Maps and Compasses（罗盘）\n Every year hundreds of species of birds take long trips. _____26_____ In the fall, they fly to warmer\n climates where food is plentiful all winter. When spring comes, they fly back to raise their young where they\n 太\n were born. For a long time people wondered where the birds went and what routes they took.\n Researchers now know that migrating birds are guided by their own sorts of maps and compasses. But it has\n 锡\n 院\n taken many decades to uncover the secrets of these navigation (导航) tools. In the 1800s, scientists started putting\n bands around birds’ legs. _____27_____ When people found the banded birds, they contacted the person named\n 无\n 学\n on the band and told him where and when they had found the bird. In this simple way, scientists learned a lot\n ab   section1: 'judgment',

  section3: 'matching',

};

let currentYear = null;

function goHome(){ location.href = 'index.html'; }

function initYears(){
  const container = document.getElementById('yearBtns');
  container.innerHTML = '';
  (typeof EXAM_YEAR_ORDER!=='undefined'?EXAM_YEAR_ORDER:Object.keys(EXAM_DATA)).forEach(eid => {
    const btn = document.createElement('button');
    btn.className = 'btn-item';
    btn.textContent = EXAM_DATA[eid].title;
    btn.onclick = () => selectYear(eid);
    container.appendChild(btn);
  });
}

function selectYear(eid){
  currentYear = eid;
  document.querySelectorAll('#yearBtns .btn-item').forEach((b,i) => {
    var _ord=(typeof EXAM_YEAR_ORDER!=='undefined'?EXAM_YEAR_ORDER:Object.keys(EXAM_DATA));

  });

  document.getElementById('examArea').innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>请选择题型开始答题</p></div>';
  hideScore();
}

function initSections(){
  const container = document.getElementById('sectionBtns');
  container.innerHTML = '';
  const exam = EXAM_DATA[currentYear];
  Object.keys(SECTION_NAMES).forEach(sid => {
    const btn = document.createElement('button');
    btn.className = 'btn-item';
    btn.textContent = SECTION_NAMES[sid];
    const hasContent = exam.sections[sid] && exam.sections[sid].length > 50;
    if(!hasContent){ btn.disabled = true; btn.style.opacity = '.4'; }
    btn.onclick = () => hasContent && selectSection(sid);
    container.appendChild(btn);
  });
}

function selectSection(sid){
  currentSection = sid;
  userAnswers = {};
  document.querySelectorAll('#sectionBtns .btn-item').forEach((b,i) => {
    b.classList.toggle('active', Object.keys(SECTION_NAMES)[i] === sid);
  });
  hideScore();
  renderExam();
}

function renderExam(){
  const exam = EXAM_DATA[currentYear];
  const content = exam.sections[currentSection];
  const type = SECTION_TYPES[currentSection];
  const area = document.getElementById('examArea');
  // 所有题型统一用卡片式渲染
  renderObjective(content, type, area);
}


function cleanWatermark(text){
  if(!text) return '';
  // 移除"13000#英语(专升本)试题第4页(共8页)"
  text = text.replace(/13000#?英语\s*[（(]\s*专升本\s*[）)]\s*试题第?\s*\d*\s*页?\s*[（(]?\s*共?\s*\d*\s*页?\s*[）)]?/g, '');
  // 移除"英语（专升本）· 课程代码 13000 第X页/共X页"
  text = text.replace(/英语\s*[（(]\s*专升本\s*[）)]\s*·?\s*课程代码\s*:?\s*\d+[^\n]*/g, '');
  // 移除"课程代码:00015)"或"课程代码 13000)"
  text = text.replace(/课程代码\s*:?\s*\d+\s*[）)]?/g, '');
  // 移除"13 0 0 0 英 语 ( 专..."
  text = text.replace(/13\s*0\s*0\s*0\s*英\s*语[^\n]*/g, '');
  // 移除页码
  text = text.replace(/第\s*\d+\s*页\s*[（(]?\s*共\s*\d+\s*页\s*[）)]?/g, '');
  text = text.replace(/第\s*\d+\s*页\s*\/\s*共\s*\d+\s*页/g, '');
  text = text.replace(/[（(]\s*共\s*\d+\s*页\s*[）)]/g, '');
  text = text.replace(/第\s*\d+\s*页/g, '');
  text = text.replace(/共\s*\d+\s*页\s*[）)]?/g, '');
  // 移除孤立的"13000"或"t73:13000"等OCR垃圾
  text = text.replace(/[a-z]?\d*:?13000\s*[）)]?/g, '');
  text = text.replace(/\b13000\b\s*[）)]?/g, '');
  // 移除OCR时间戳垃圾如"2025 7ừ" "t73:"
  text = text.replace(/\d{4}\s+\d+[ừửữự]?/g, '');
  text = text.replace(/\bt\d+:/g, '');
  // 移除"第X部分：XXX"
  text = text.replace(/第\s*[一二三四五六七八九十]+\s*部\s*分\s*[：:][^\n]*/g, '');
  // 移除"曹胖自考英语二"
  text = text.replace(/曹胖[^\n]*/g, '');
  text = text.replace(/自考英语二?/g, '');
  // 移除OCR垃圾
  text = text.replace(/#[Xx]#?/g, '');
  text = text.replace(/\*[#=*]+\*/g, '');
  // 移除扫描残留（如 *a (=)、i*E/7:00015、#4F#176F）
  text = text.replace(/\*a\s*\(=\)/g, '');
  text = text.replace(/\(i\*E\/7:00015\)/g, '');
  text = text.replace(/#\w+#\w+/g, '');
  text = text.replace(/\$\s*\d+\s*\$\s*\d+/g, '');
  text = text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  // 移除末尾单字水印（如"湖 太 院 锡"）
  text = text.replace(/(?:\s+[\u4e00-\u9fa5]){1,4}\s*$/g, '');
  // 移除独立单字水印行
  text = text.replace(/(?:^|\n)\s*[\u4e00-\u9fa5]\s*$/gm, '');
  // 移除末尾多余标点和括号
  text = text.replace(/[\s\.。,，、;；：:）)）]+$/g, '');
  return text.trim();
}

function extractPassageAndQuestions(content, type){
  const lines = content.split('\n');
  let passage = '';
  let questions = [];
  
  // section3: 概括段落大意和补全句子 (16-25)
  if(currentSection === 'section3'){
    return parseMatchingSection(content);
  }
  
  // section4: 填句补文 (26-30)
  if(currentSection === 'section4'){
    return parseClozeSection(content, 26, 30);
  }
  
  // section5: 填词补文 (31-40)
  if(currentSection === 'section5'){
    return parseWordCloze(content, 31, 40);
  }
  
  // section6: 完形补文 (41-50)
  if(currentSection === 'section6'){
    return parseWordForm(content, 41, 50);
  }
  
  // section1/2: 阅读判断/阅读选择
  return parseChoiceQuestions(content, type);
}

function parseChoiceQuestions(content, type){
  // 清理水印和页码
  content = content.replace(/\(共\d+页\)/g, '');
  content = content.replace(/[\x0c]/g, '');
  const lines = content.split('\n');
  let passage = '';
  let questions = [];
  
  // 找到第一道题的位置（允许题号前有空格）
  // 过滤水印行（只有1-2个中文字符的行）
  const cleanedLines = lines.filter(l => !/^[\s\u4e00-\u9fa5]{1,3}$/.test(l.trim()));
  let qStartIdx = -1;
  for(let i = 0; i < cleanedLines.length; i++){
    if(/^\s*\d+[\.\)]/.test(cleanedLines[i])){ qStartIdx = i; break; }
  }
  
  if(qStartIdx > 0){
    passage = cleanedLines.slice(0, qStartIdx).join('\n').trim();
    passage = passage.replace(/^第[一二三四五六]部分[：:].*?\n/gm, '');
    passage = passage.replace(/^\s*阅读下面短文.*?\n/gm, '');
    passage = passage.replace(/^\s*下面的短文后列出.*?\n/gm, '');
    passage = passage.replace(/^\s*请根据短文的内容.*?\n/gm, '');
    passage = passage.replace(/^\s*选项，并在答题纸.*?\n/gm, '');
    passage = passage.replace(/^\s*选出1个最佳.*?\n/gm, '');
    passage = passage.replace(/^\s*如果该句.*?\n/gm, '');
    passage = passage.replace(/^\s*在答题纸相应位置.*?\n/gm, '');
    passage = passage.replace(/^\s*下面的短文.*?\n/gm, '');
    passage = passage.trim();
  }
  
  // 把题目部分的所有行合并
  let qText = cleanedLines.slice(qStartIdx).join('\n');
  
  // 按题号分割（允许题号前有空格）
  // 先在粘连的题号前插入换行（如 "D. consultant13. According" -> "D. consultant\n13. According"）
  qText = qText.replace(/([a-zA-Z\)])(\d{1,2}[\.\)]\s*[A-Z])/g, '$1\n$2');
  let qBlocks = qText.split(/\n\s*(?=\d+[\.\)])/);
  
  qBlocks.forEach(block => {
    block = block.trim();
    if(!block) return;
    
    // 匹配题号和题目文本（允许题号前有空格）
    let m = block.match(/^\s*(\d+)[\.\)]\s*(.+)/s);
    if(!m) return;
    
    let num = parseInt(m[1]);
    if(num < 1 || num > 50) return;
    
    let rest = m[2];
    
    // 提取选项
    let options = [];
    
    if(type === 'judgment'){
      // 阅读判断: A.True B.False C.Not Given（可能在同一行或不同行）
      let flat = rest.replace(/\n/g, ' ').replace(/\s+/g, ' ');
      // 处理中文顿号等异常字符
      flat = flat.replace(/[、,，]/g, ' ');
      
      if(/True/i.test(flat)) options.push('A. True');
      if(/False/i.test(flat)) options.push('B. False');
      if(/Not\s*Given/i.test(flat)) options.push('C. Not Given');
      
      // 移除选项部分，保留题目文本
      rest = flat.replace(/A\.?\s*True.*$/i, '').trim();
    } else {
      // 阅读选择: A.xxx B.xxx C.xxx D.xxx
      let flat = rest.replace(/\n/g, ' ').replace(/\s+/g, ' ');
      
      // 找到第一个选项的位置
      let optStart = flat.search(/\s+[A-D]\.\s*[a-zA-Z]/);
      if(optStart < 0) optStart = flat.search(/[A-D]\.\s*[a-zA-Z]/);
      
      let qTextPart = optStart >= 0 ? flat.substring(0, optStart) : flat;
      let optPart = optStart >= 0 ? flat.substring(optStart) : '';
      
      // 顺序无关提取A-D选项：兼容扫描件两栏排版导致的OCR乱序（如 A C B D）
      let markRe = /(?:^|\s)([A-D])\.\s*/g;
      let marks = [];
      let mm;
      while((mm = markRe.exec(optPart)) !== null){
        marks.push({letter: mm[1], contentStart: mm.index + mm[0].length, markStart: mm.index});
      }
      let optMap = {};
      for(let mi = 0; mi < marks.length; mi++){
        let L = marks[mi].letter;
        if(optMap[L] !== undefined) continue;  // 每个字母只取第一次出现
        let segEnd = mi+1 < marks.length ? marks[mi+1].markStart : optPart.length;
        let val = optPart.substring(marks[mi].contentStart, segEnd).replace(/\s+/g,' ').trim();
        // 截断误入的下一大题内容（下一部分标记/Task/页码）
        val = val.split(/第[一二三四五六]部分|Task\s*[12]|第\s*\d+\s*页/)[0];
        val = cleanWatermark(val.trim());
        if(val.length > 0) optMap[L] = val;
      }
      ['A','B','C','D'].forEach(function(L){
        if(optMap[L] !== undefined) options.push(L + '. ' + optMap[L]);
      });
      rest = qTextPart.trim();
    }
    
    rest = rest.replace(/\s+/g, ' ').trim();
    
    // 阅读判断题选项固定为True/False/Not Given，统一标准化（避免OCR缺项/重复）
    if(type === 'judgment'){
      options = ['A. True', 'B. False', 'C. Not Given'];
    }
    if(options.length > 0){
      questions.push({num: num, text: cleanWatermark(rest), options: options});
    }
  });
  
  passage = cleanWatermark(passage);
  return {passage, questions};
}

function parseMatchingSection(content){
  let questions = [];
  
  let task1Match = content.match(/Task\s*1([\s\S]*?)(?=Task\s*2|$)/i);
  let task2Match = content.match(/Task\s*2([\s\S]*?)$/i);
  
  // 如果没有Task 1标记，从开头到Task 2作为Task 1
  if(!task1Match && task2Match){
    let t1 = content.substring(0, content.search(/Task\s*2/i));
    if(t1.trim().length > 20){
      task1Match = [null, t1];
    }
  }
  
  if(task1Match){
    let t1 = task1Match[1];
    let opts1 = extractOptionsFromText(t1, 6);
    // 动态识别Task1题号（16-20）：优先从全文扫描"N. Paragraph"形式，兼容16-19变体
    let nums1 = [];
    let nre1 = /(\d{2})[\.\)]\s*Paragraph/gi, nm1;
    while((nm1 = nre1.exec(content)) !== null){
      let n = parseInt(nm1[1]);
      if(n >= 16 && n <= 20 && nums1.indexOf(n) < 0) nums1.push(n);
    }
    if(nums1.length === 0){
      let nre1b = /(?:^|\n)\s*(\d{2})[\.\)]/g, nm1b;
      while((nm1b = nre1b.exec(t1)) !== null){
        let n = parseInt(nm1b[1]);
        if(n >= 16 && n <= 20 && nums1.indexOf(n) < 0) nums1.push(n);
      }
    }
    if(nums1.length === 0) nums1 = [16,17,18,19,20];
    nums1.sort(function(a,b){return a-b;});
    nums1.forEach(function(n, i){
      questions.push({num: n, text: '为第' + (i+1) + '段选择正确的小标题', options: opts1});
    });
  }
  
  if(task2Match){
    let t2 = task2Match[1];
    let opts2 = extractOptionsFromText(t2, 7);
    // 动态识别Task2题号（20-25）及题干
    let nums2 = [], stems = {};
    let nre2 = /(?:^|\n)\s*(\d{2})[\.\)]\s*([^\n]+)/g, nm2;
    while((nm2 = nre2.exec(t2)) !== null){
      let n = parseInt(nm2[1]);
      if(n >= 20 && n <= 25 && nums2.indexOf(n) < 0){
        nums2.push(n);
        stems[n] = nm2[2].replace(/[A-G]\..*$/, '').trim();
      }
    }
    if(nums2.length === 0) nums2 = [21,22,23,24,25];
    nums2.sort(function(a,b){return a-b;});
    nums2.forEach(function(n){
      questions.push({num: n, text: cleanWatermark(stems[n] || ('第'+n+'题')), options: opts2});
    });
  }
  
  let passage = '';
  // 优先取 Task 1 之前的文章；缺 Task 1 标记时，取第16题之前的内容作为文章
  let firstQ = content.search(/Task\s*1/i);
  if(firstQ < 0){
    firstQ = content.search(/(?:^|\n)\s*16[\.\)]/);
  }
  if(firstQ > 0){
    passage = content.substring(0, firstQ).trim();
    passage = passage.replace(/^第[一二三四五六]部分[：:].*?\n/gm, '');
    passage = passage.replace(/^\s*阅读下面短文.*?\n/gm, '');
    passage = passage.replace(/^\s*下面的短文.*?\n/gm, '');
    passage = passage.replace(/^\s*请完成短文.*?\n/gm, '');
    passage = passage.replace(/^\s*的6个选项.*?\n/gm, '');
    passage = passage.replace(/^[#\s\dF]{1,12}$/gm, '');  // 页码噪声
  }
  
  passage = cleanWatermark(passage);
  return {passage, questions};
}

function extractOptionsFromText(text, maxCount){
  // 顺序无关 + 动态数量，兼容两栏OCR乱序
  let cleaned = text.replace(/\d{1,2}[\.\)]\s*Paragraph\s*[①②③④⑤⑥⑦⑧⑨⑩0-9()]*/gi, ' ');
  let flat = cleaned.replace(/\n/g, ' ').replace(/\s+/g, ' ');
  let letters = 'ABCDEFGHIJKL'.substring(0, maxCount || 12).split('');
  let marks = [];
  letters.forEach(function(L){
    let re = new RegExp('(?:^|\\s)' + L + '[\\.\\s]+', 'g');
    let m = re.exec(flat);
    if(m) marks.push({letter: L, start: m.index + m[0].length, markStart: m.index});
  });
  marks.sort(function(a,b){return a.markStart - b.markStart;});
  let map = {};
  for(let i = 0; i < marks.length; i++){
    let end = i+1 < marks.length ? marks[i+1].markStart : flat.length;
    let val = flat.substring(marks[i].start, end).trim();
    val = val.split(/第[一二三四五六]部分|Task\s*[12]|13000#|试题第|共\d+页/)[0].trim();
    val = cleanWatermark(val);
    if(val.length > 0 && map[marks[i].letter] === undefined) map[marks[i].letter] = val;
  }
  return Object.keys(map).sort().map(function(L){return L + '. ' + map[L];});
}

function extractWordOptions(text, count){
  let options = [];
  let flat = text.replace(/\n/g, ' ').replace(/\s+/g, ' ');
  let re = /(?:^|\s)([A-L])[\.\s]+([a-zA-Z]+)/g;
  let m;
  let found = {};
  while((m = re.exec(flat)) !== null){
    let letter = m[1];
    let word = m[2];
    word = cleanWatermark(word);
    if(!found[letter] && word.length > 1 && /^[a-zA-Z]+$/.test(word)){
      found[letter] = word;
    }
  }
  let letters = 'ABCDEFGHIJKL'.substring(0, count).split('');
  for(let L of letters){
    if(found[L]){
      options.push(L + '. ' + found[L]);
    }
  }
  return options;
}

function parseClozeSection(content, startNum, endNum){
  let questions = [];
  
  // 提取选项（A-F句子）
  let opts = extractOptionsFromText(content, 6);
  
  // 文章是选项之前的部分
  let passage = content;
  let optStart = content.search(/\n[A-F]\./);
  if(optStart > 0) passage = content.substring(0, optStart).trim();
  passage = passage.replace(/^第[一二三四五六]部分[：:].*?\n/gm, '');
  passage = passage.replace(/^下面的短文.*?\n/gm, '');
  
  for(let i = startNum; i <= endNum; i++){
    questions.push({
      num: i,
      text: '第' + i + '空：选择正确的句子填入文中',
      options: opts
    });
  }
  
  passage = cleanWatermark(passage);
  return {passage, questions};
}

function parseWordCloze(content, startNum, endNum){
  content = cleanWatermark(content);
  let questions = [];
  
  // 提取单词选项（A-L）
  let opts = extractWordOptions(content, 12);
  
  // 文章部分：去掉标题和选项列表
  let lines = content.split('\n');
  let passageLines = [];
  let inWordList = false;
  for(let line of lines){
    let trimmed = line.trim();
    // 检测单词列表开始（如 "A. word" 或 "| A. word |"）
    if(/^\|?\s*[A-L]\.\s*[a-zA-Z]+/.test(trimmed) && /[A-L]\./.test(trimmed)){
      // 检查这一行是否有多个选项（如 "A. word | B. word"）
      if(trimmed.match(/[A-L]\./g) && trimmed.match(/[A-L]\./g).length >= 2){
        inWordList = true;
      }
    }
    if(/^[A-L]\.\s*[a-zA-Z]+/.test(trimmed)){
      inWordList = true;
    }
    if(!inWordList && trimmed){
      passageLines.push(line);
    }
  }
  let passage = passageLines.join('\n').trim();
  passage = passage.replace(/^第[一二三四五六]部分[：:].*?\n/gm, '');
  passage = passage.replace(/^下面的短文.*?\n/gm, '');
  
  for(let i = startNum; i <= endNum; i++){
    questions.push({
      num: i,
      text: '第' + i + '空：选择正确的单词填入文中',
      options: opts
    });
  }
  
  return {passage, questions};
}

function parseWordForm(content, startNum, endNum){
  content = cleanWatermark(content);
  let questions = [];
  
  let passage = content;
  passage = passage.replace(/^第[一二三四五六]部分[：:].*?\n/gm, '');
  passage = passage.replace(/^下面的短文.*?\n/gm, '');
  
  for(let i = startNum; i <= endNum; i++){
    let re = new RegExp(i + '\\s*\\(([a-zA-Z]+)\\)');
    let m = passage.match(re);
    let hint = m ? m[1] : '';
    questions.push({
      num: i,
      text: '第' + i + '空：将括号中的单词变为正确形式填入文中' + (hint ? '（' + hint + '）' : ''),
      options: [],
      isInput: true
    });
  }
  
  passage = cleanWatermark(passage);
  return {passage, questions};
}

function renderObjective(content, type, area){
  const {passage, questions} = extractPassageAndQuestions(content, type);
  const answers = EXAM_ANSWERS[currentYear] || {};

  examQuestions = questions;
  currentQIndex = 0;
  examSubmitted = false;
  
  questions.forEach(q => {
    if(q.options.length === 0 && type === 'judgment'){
      q.options = ['A. True', 'B. False', 'C. Not Given'];
    }
  });
  
  let html = '<div class="exam-content">';
  html += '<div class="section-title">' + SECTION_NAMES[currentSection] + '</div>';
  
  if(passage){
    html += '<div class="passage-title">阅读短文</div>';
    html += '<div class="passage" id="examPassage">' + escapeHtml(passage) + '</div>';
  }
  
  // 卡片式题目区域
  html += '<div class="q-card-area" id="qCardArea">';
  html += '<div class="q-progress" id="qProgress"></div>';
  html += '<div class="q-card" id="qCard"></div>';
  html += '<div class="q-nav">';
  html += '<button class="q-nav-btn" id="btnPrevQ" onclick="prevQ()">上一题</button>';
  html += '<button class="q-nav-btn q-nav-primary" id="btnNextQ" onclick="nextQ()">下一题</button>';
  html += '</div>';
  html += '</div>';

  html += '<div class="action-bar" id="actionBar">';
  html += '<button class="action-btn btn-submit" id="btnSubmit" onclick="submitObjective()">提交答案</button>';
  html += '<button class="action-btn btn-reset" onclick="resetAnswers()">重新作答</button>';
  html += '</div>';
  html += '</div>';
  
  area.innerHTML = html;
  
  // 渲染第一道题
  renderQCard();
  
  // 添加滑动支持
  addCardSwipe();
}

function renderQCard(){
  if(examQuestions.length === 0) return;
  const q = examQuestions[currentQIndex];
  const answers = EXAM_ANSWERS[currentYear] || {};

  const card = document.getElementById('qCard');
  const progress = document.getElementById('qProgress');
  const btnPrev = document.getElementById('btnPrevQ');
  const btnNext = document.getElementById('btnNextQ');
  const btnSubmit = document.getElementById('btnSubmit');
  
  progress.textContent = '第 ' + (currentQIndex+1) + ' / ' + examQuestions.length + ' 题';
  
  let html = '<div class="q-text"><span class="q-num">' + q.num + '.</span>' + escapeHtml(q.text) + '</div>';
  if(q.isInput){
    // 完形补文：输入框
    let inputVal = examSubmitted ? (answers[q.num] || '') : (userAnswers[q.num] || '');
    let inputCls = 'q-input';
    if(examSubmitted){
      inputCls += ansEq(userAnswers[q.num],answers[q.num]) ? ' correct' : ' wrong';
    }
    html += '<div class="q-input-area">';
    html += '<input type="text" class="' + inputCls + '" id="qInput' + q.num + '" value="' + escapeHtml(userAnswers[q.num] || '') + '" placeholder="输入单词正确形式" ' + (examSubmitted ? 'disabled' : '') + ' oninput="onInputAnswer(' + q.num + ', this.value)">';
    html += '</div>';
  } else {
    html += '<div class="q-options">';
    q.options.forEach(opt => {
      const letter = opt.charAt(0);
      let cls = 'q-opt';
      if(userAnswers[q.num] === letter) cls += ' selected';
      if(examSubmitted){
        cls += ' disabled';
        if(letter === answers[q.num]) cls += ' correct';
        if(userAnswers[q.num] === letter && letter !== answers[q.num]) cls += ' wrong';
      }
      html += '<div class="' + cls + '" data-opt="' + letter + '" onclick="selectOption(' + q.num + ',\'' + letter + '\')">' + escapeHtml(opt) + '</div>';
    });
    html += '</div>';
  }
  
  if(examSubmitted){
    const correctAns = answers[q.num];
    const userAns = userAnswers[q.num];
    const isCorrect = ansEq(userAns,correctAns);
    html += '<div class="q-result show ' + (isCorrect ? 'correct' : 'wrong') + '">';
    html += '<div class="q-answer">' + (isCorrect ? '✓ 回答正确' : '✗ 回答错误') + '（正确答案：' + correctAns + '）</div>';
    html += '</div>';
  }
  
  card.innerHTML = html;
  
  btnPrev.disabled = currentQIndex === 0;
  btnPrev.style.opacity = currentQIndex === 0 ? '.4' : '1';
  
  if(currentQIndex === examQuestions.length - 1){
    btnNext.textContent = examSubmitted ? '查看结果' : '提交';
    btnNext.classList.add('q-nav-submit');
  } else {
    btnNext.textContent = '下一题';
    btnNext.classList.remove('q-nav-submit');
  }
  
  // 提交按钮显示状态
  if(btnSubmit){
    const answered = Object.keys(userAnswers).length;
    btnSubmit.textContent = examSubmitted ? '已提交' : ('提交答案（' + answered + '/' + examQuestions.length + '）');
    btnSubmit.disabled = examSubmitted;
    btnSubmit.style.opacity = examSubmitted ? '.5' : '1';
  }
}

function nextQ(){
  if(currentQIndex < examQuestions.length - 1){
    currentQIndex++;
    renderQCard();
  } else if(!examSubmitted){
    submitObjective();
  }
}

function prevQ(){
  if(currentQIndex > 0){
    currentQIndex--;
    renderQCard();
  }
}

function addCardSwipe(){
  const area = document.getElementById('qCardArea');
  if(!area) return;
  let startX = 0, startY = 0, isScrolling = false;
  area.addEventListener('touchstart', function(e){
    startX = e.touches[0].pageX;
    startY = e.touches[0].pageY;
    isScrolling = false;
  }, {passive:true});
  area.addEventListener('touchmove', function(e){
    if(Math.abs(e.touches[0].pageY - startY) > Math.abs(e.touches[0].pageX - startX)){
      isScrolling = true;
    }
  }, {passive:true});
  area.addEventListener('touchend', function(e){
    if(isScrolling) return;
    const dx = e.changedTouches[0].pageX - startX;
    if(dx < -50) nextQ();
    else if(dx > 50) prevQ();
  }, {passive:true});
}

function onInputAnswer(qnum, value){
  if(examSubmitted) return;
  userAnswers[qnum] = value.trim();
}
// 答案比较: 填空题大小写/首尾空格不敏感(句首单词大写不应判错), 选择题字母同样兼容
function ansEq(a,b){ return String(a==null?'':a).trim().toLowerCase() === String(b==null?'':b).trim().toLowerCase(); }

function selectOption(qnum, letter){
  if(examSubmitted) return;
  userAnswers[qnum] = letter;
  renderQCard();
  // 自动延迟跳下一题或提交
  setTimeout(function(){
    if(examSubmitted) return;
    if(currentQIndex < examQuestions.length - 1){
      currentQIndex++;
      renderQCard();
    } else {
      // 最后一题答完，自动提交
      submitObjective();
    }
  }, 400);
}

function submitObjective(){
  if(examSubmitted) return;
  const answers = EXAM_ANSWERS[currentYear] || {};
  const total = examQuestions.length;
  const answered = Object.keys(userAnswers).length;
  
  if(answered < total){
    if(!confirm('还有' + (total - answered) + '题未作答，确定提交吗？')) return;
  }
  
  examSubmitted = true;
  let correct = 0;

  examQuestions.forEach(q => {
    const userAns = userAnswers[q.num];
    const correctAns = answers[q.num];
    if(ansEq(userAns,correctAns)) correct++;
});

  renderQCard();
  showScore(correct, total);
  
  // 滚动到结果
  setTimeout(function(){
    document.getElementById('scoreBar').scrollIntoView({behavior:'smooth'});
  }, 300);
}

function resetAnswers(){
  userAnswers = {};
  currentQIndex = 0;
  examSubmitted = false;
  hideScore();
  renderExam();
}

function showScore(correct, total){
  const bar = document.getElementById('scoreBar');
  const num = document.getElementById('scoreNum');
  const label = document.getElementById('scoreLabel');
  num.textContent = correct + ' / ' + total;
  const pct = Math.round(correct / total * 100);
  label.textContent = '正确率 ' + pct + '%';
  bar.classList.add('show');
  bar.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function hideScore(){
  document.getElementById('scoreBar').classList.remove('show');
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 初始化
initYears();
document.getElementById('examArea').innerHTML = '<div class="empty-state"><div class="icon">📚</div><p>请选择年份和题型开始练习</p></div>';


</script>
