function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function goBack(){
  if(history.length>1){ history.back(); } else { location.href='index.html'; }
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  document.getElementById('panel-'+name).classList.add('show');
}
function renderTopics(){
  const list=document.getElementById('topicsList');
  const topics=Array.isArray(TOPICS)?TOPICS:(TOPICS.topics||[]);
  document.getElementById('topicsCount').textContent='共 '+topics.length+' 道真题作文题';
  list.innerHTML=topics.map(function(t,i){
    const sample=t.hasSample&&t.sampleId&&t.sampleId.length>0
      ? '<button class="sample-btn" onclick="showEssay('+t.sampleId[0]+')">查看范文</button>':'';
    return '<div class="item">'+
      '<div class="item-head"><span class="badge">'+esc(t.year)+'</span><span class="badge cn">'+esc(t.type)+'</span></div>'+
      '<h3>'+esc(t.titleEn)+'</h3>'+
      '<div class="en">'+esc(t.titleCn)+' · '+esc(t.exam)+'</div>'+
      '<div class="points">'+t.points.map(function(p){return '· '+esc(p);}).join('<br>')+'</div>'+
      sample+
    '</div>';
  }).join('');
}
function renderEssays(){
  const list=document.getElementById('essaysList');
  const essays=Array.isArray(ESSAYS)?ESSAYS:(ESSAYS.essays||[]);
  document.getElementById('essaysCount').textContent='共 '+essays.length+' 篇完整范文';
  list.innerHTML=essays.map(function(e){
    return '<div class="item" onclick="showEssay('+e.id+')" style="cursor:pointer">'+
      '<div class="item-head"><span class="badge essay">'+esc(e.category)+'</span><span class="badge cn">No.'+e.id+'</span></div>'+
      '<h3>'+esc(e.title)+'</h3>'+
      '<div class="en">'+esc(e.titleEn)+' · '+esc(e.source||'')+'</div>'+
    '</div>';
  }).join('');
}
function showEssay(id){
  const essays=Array.isArray(ESSAYS)?ESSAYS:(ESSAYS.essays||[]);
  const e=essays.find(function(x){return x.id===id;});
  if(!e) return;
  document.getElementById('detailTitle').textContent=e.title;
  document.getElementById('detailMeta').textContent=(e.titleEn||'')+' · '+(e.category||'')+' · '+(e.source||'');
  document.getElementById('flipEn').textContent=e.english;
  document.getElementById('flipZh').textContent=e.chinese;
  document.getElementById('flipCard').classList.remove('flipped');
  document.getElementById('detail').classList.add('show');
}
function closeDetail(){ document.getElementById('detail').classList.remove('show'); }
function renderTemplates(){
  const box=document.getElementById('templatesList');
  const t=TEMPLATES||{};
  let html='';
  if(t.connectors){
    const names={first:'开头',second:'递进',last:'结尾',two_sides:'两面',example:'举例',explain:'解释',therefore:'因果',conclusion:'总结',transition:'转折'};
    html+='<div class="tpl-group"><h3>逻辑连接词</h3>';
    Object.keys(t.connectors).forEach(function(k){
      const arr=t.connectors[k]||[];
      html+='<div class="tpl-row"><b>'+esc(names[k]||k)+'</b>：'+esc(arr.join(' / '))+'</div>';
    });
    html+='</div>';
  }
  if(t.opening_sentences){
    html+='<div class="tpl-group"><h3>万能开头</h3>'+(t.opening_sentences.map(function(s){return '<div class="tpl-row">'+esc(s)+'</div>';}).join(''))+'</div>';
  }
  if(t.golden_sentences){
    html+='<div class="tpl-group"><h3>黄金句</h3>';
    Object.keys(t.golden_sentences).forEach(function(k){
      html+='<div class="tpl-row"><b>'+esc(k==='positive'?'正面':'负面')+'</b>：'+esc(t.golden_sentences[k])+'</div>';
    });
    html+='</div>';
  }
  if(t.silver_sentences){
    html+='<div class="tpl-group"><h3>白银凑字句</h3>'+(t.silver_sentences.map(function(s){return '<div class="tpl-row">'+esc(s)+'</div>';}).join(''))+'</div>';
  }
  if(t.argument_template){
    const a=t.argument_template;
    html+='<div class="tpl-group"><h3>'+esc(a.name||'议论文模板')+'</h3>'+
      '<div class="tpl-row"><b>结构</b>：'+esc((a.structure||[]).join(' → '))+'</div>'+
      '<div class="tpl-row">'+esc(a.template||'')+'</div>'+
      '<div class="tpl-row"><b>中文提纲</b>：'+esc(a.chinese_outline||'')+'</div></div>';
  }
  if(t.email_template){
    const e=t.email_template;
    html+='<div class="tpl-group"><h3>'+esc(e.name||'邮件模板')+'</h3>'+
      '<div class="tpl-row"><b>开头</b>：'+esc((e.opening||[]).join(' / '))+'</div>'+
      '<div class="tpl-row"><b>正文</b>：'+esc(e.body||'')+'</div>'+
      '<div class="tpl-row"><b>结尾</b>：'+esc((e.closing||[]).join(' / '))+'</div>'+
      '<div class="tpl-row"><b>署名</b>：'+esc((e.signature||[]).join(' / '))+'</div></div>';
  }
  if(t.good_sentences){
    html+='<div class="tpl-group"><h3>高分好句</h3>'+(t.good_sentences.map(function(s){return '<div class="tpl-row">'+esc(s)+'</div>';}).join(''))+'</div>';
  }
  box.innerHTML=html;
}
renderTopics();
renderEssays();
renderTemplates();
</script>
