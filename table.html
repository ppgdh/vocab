<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专升本英语 4500 单词学习表</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --sub:#6b7280;
  --line:#e5e7eb; --accent:#0e9f6e; --accent-soft:#e7f7f0; --accent-dark:#0b7a53;
  --know:#0e9f6e; --fuzzy:#f59e0b; --hard:#ef4444; --fav:#f59e0b; --tag:#6366f1;
  --tag-bg:#eef2ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.05);}
.head-inner{max-width:880px;margin:0 auto;padding:12px 14px 10px;}
.topline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;}
h1 .badge{font-size:12px;font-weight:600;color:var(--accent-dark);background:var(--accent-soft);padding:3px 9px;border-radius:999px;}
.topline .tools{margin-left:auto;display:flex;gap:6px;align-items:center;}
.tool-btn{font-size:12px;font-weight:600;color:var(--sub);background:#f3f4f6;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;}
.tool-btn:hover{color:var(--ink);background:#e5e7eb;}
.sub{font-size:12px;color:var(--sub);margin-top:3px;}
.search-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
#search{flex:1;min-width:150px;padding:10px 13px;font-size:16px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fafbfc;}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,159,110,.15);background:#fff;}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f3f4f6;}
.seg button{border:none;background:transparent;padding:8px 11px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;}
.seg button.active{background:var(--accent);color:#fff;}
.switch{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;user-select:none;}
.switch.on{color:var(--accent-dark);border-color:var(--accent);background:var(--accent-soft);}
/* 进度条 */
.progress{margin-top:10px;}
.progress-bar{height:10px;background:#eef0f3;border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#0e9f6e,#34d399);border-radius:999px;transition:width .4s;width:0;}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:5px;flex-wrap:wrap;gap:4px;}
.progress-info b{color:var(--ink);}
.pc-now{color:var(--accent-dark);font-weight:700;}
/* 筛选 */
.filters{display:flex;gap:5px;margin-top:9px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fbtn{flex-shrink:0;padding:7px 13px;font-size:13px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;}
.fbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.fbtn .n{font-size:11px;opacity:.8;margin-left:3px;}
.tagchips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.tagchip{flex-shrink:0;padding:5px 11px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid #c7d2fe;background:var(--tag-bg);color:#4338ca;cursor:pointer;}
.tagchip.active{background:#4338ca;color:#fff;border-color:#4338ca;}
#stats{font-size:12px;color:var(--sub);margin-top:8px;}
main{max-width:880px;margin:0 auto;padding:14px 10px 90px;}
.list-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;transition:box-shadow .15s;}
.list-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);}
.list-item.speaking{border-color:var(--accent);background:var(--accent-soft);}
.w-col{min-width:150px;flex:1.1;}
.word{font-size:16.5px;font-weight:700;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.word:hover{color:var(--accent-dark);}
.ipa{font-size:13.5px;color:var(--accent-dark);margin-top:2px;font-family:"Segoe UI","Arial",sans-serif;}
.badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.badge{font-size:10.5px;font-weight:600;padding:1.5px 7px;border-radius:999px;color:#fff;}
.badge.k{background:var(--know);} .badge.f{background:var(--fuzzy);} .badge.h{background:var(--hard);} .badge.s{background:#eab308;} .badge.t{background:var(--tag);}
.def{flex:1.6;font-size:14px;color:#374151;line-height:1.5;cursor:pointer;}
.def.reveal-hint{color:var(--sub);}
.def.hidden-def{color:#9ca3af;font-style:italic;}
.btn-group{flex-shrink:0;display:flex;gap:8px;align-items:center;}
.play-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;background:var(--play,#0e9f6e);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s;box-shadow:0 2px 6px rgba(14,159,110,.3);touch-action:manipulation;}
.play-btn:hover{transform:scale(1.06);background:var(--accent-dark);}
.play-btn.speaking{background:var(--accent-dark);}
.play-btn:active{transform:scale(.92);}
.play-btn.loading{background:#f59e0b;}
.mark-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;touch-action:manipulation;}
.mark-btn.has{background:#fef3c7;border-color:#f59e0b;color:#b45309;}
.mark-btn:hover{border-color:var(--fuzzy);}
.mark-btn:active{transform:scale(.9);}
.empty{padding:40px;text-align:center;color:var(--sub);font-size:15px;}
/* 标记弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.modal.open{display:flex;}
.modal-panel{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px 24px;max-height:82vh;overflow:auto;box-shadow:0 -4px 24px rgba(0,0,0,.12);}
.mm-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.mm-title .w{font-size:22px;font-weight:800;}
.mm-title .p{font-size:15px;color:var(--accent-dark);font-family:"Segoe UI","Arial",sans-serif;}
.mm-title .d{width:100%;font-size:13px;color:var(--sub);margin-top:3px;}
.mm-sec{margin-top:14px;font-size:13px;font-weight:700;color:var(--sub);}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px;}
.mm-btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .12s;}
.mm-btn.on{border-color:var(--c,#888);background:var(--cbg,#f3f4f6);color:var(--cd,#333);}
.mm-btn[data-mark="know"]{--c:var(--know);--cbg:var(--accent-soft);--cd:var(--accent-dark);}
.mm-btn[data-mark="fuzzy"]{--c:#f59e0b;--cbg:#fef3c7;--cd:#b45309;}
.mm-btn[data-mark="hard"]{--c:#ef4444;--cbg:#fee2e2;--cd:#b91c1c;}
.mm-btn[data-mark="fav"]{--c:#eab308;--cbg:#fef9c3;--cd:#a16207;}
.mm-custom-input-row{display:flex;gap:8px;margin-top:8px;}
#mmTagInput{flex:1;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;outline:none;}
#mmTagInput:focus{border-color:var(--tag);}
#mmTagAdd{background:var(--tag);color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;}
.mm-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.mm-tag{display:flex;align-items:center;gap:5px;background:var(--tag-bg);color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;}
.mm-tag .x{cursor:pointer;opacity:.6;font-weight:800;font-size:14px;}
.mm-tag .x:hover{opacity:1;}
.mm-empty{color:#9ca3af;font-size:13px;margin-top:8px;}
.mm-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;}
#mmClear{background:none;border:none;color:#ef4444;font-size:13px;cursor:pointer;padding:8px;border-radius:8px;}
#mmClear:hover{background:#fee2e2;}
#mmDone{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 30px;font-size:15px;font-weight:700;cursor:pointer;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none;max-width:90%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
footer{max-width:880px;margin:0 auto;padding:18px 16px 40px;font-size:12px;color:var(--sub);text-align:center;line-height:1.8;}
@media (min-width:640px){
  .modal{align-items:center;}
  .modal-panel{border-radius:18px;}
}
@media (max-width:640px){
  .head-inner{padding-top:calc(12px + env(safe-area-inset-top));}
  .list-item{flex-wrap:wrap;gap:9px;}
  .w-col{min-width:0;flex:1 1 auto;}
  .def{flex:1 1 100%;order:3;font-size:13px;}
  h1{font-size:16px;}
  .play-btn,.mark-btn{width:48px;height:48px;font-size:19px;}
  .mm-grid{grid-template-columns:1fr 1fr;}
  .modal-panel{padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom));}
  .tool-btn{padding:8px 11px;}
  #search{min-width:0;}
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="topline">
      <h1>专升本英语 4500 单词学习表 <span class="badge" id="badge">加载中…</span></h1>
      <div class="tools">
        <button class="tool-btn" id="btnExport" title="导出标记备份（换设备用）">📤 导出</button>
        <button class="tool-btn" id="btnImport" title="导入标记备份">📥 导入</button>
        <button class="tool-btn" id="btnReset" title="清空所有标记">🗑 重置</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      </div>
    </div>
    <div class="sub">点击 🔊 听发音 · 📌 打标记 · 进度自动保存，可导出导入在手机/电脑间同步</div>
    <div class="search-row">
      <input id="search" type="text" placeholder="🔍 输入单词或中文释义，如：abandon / 放弃">
      <div class="ctrl">
        <div class="seg" id="accent">
          <button data-type="1" class="active">美音</button>
          <button data-type="2">英音</button>
        </div>
        <div class="switch" id="quizMode">✍️ 自测</div>
      </div>
    </div>
    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div class="progress-info">
        <span>学习进度 <b id="progText">0/0</b></span>
        <span>未学 <b id="cUnstudied">0</b> · 已学 <b id="cStudied">0</b> · 难记 <b id="cHard">0</b> · 标记 <b id="cMarked">0</b></span>
        <span class="pc-now" id="cToday">今日 +0</span>
      </div>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>
<main>
  <div class="tagchips" id="tagchips"></div>
  <div class="letters-wrap" id="lettersWrap"></div>
  <div id="stats" style="margin-bottom:8px;"></div>
  <div id="list"></div>
</main>

<div class="modal" id="markModal">
  <div class="modal-panel">
    <div class="mm-title">
      <span class="w" id="mmWord"></span><span class="p" id="mmIpa"></span>
      <span class="d" id="mmDef"></span>
    </div>
    <div class="mm-sec">学习标记（可多选）</div>
    <div class="mm-grid">
      <button class="mm-btn" data-mark="know">✅ 已掌握</button>
      <button class="mm-btn" data-mark="fuzzy">🔶 模糊</button>
      <button class="mm-btn" data-mark="hard">❌ 难记</button>
      <button class="mm-btn" data-mark="fav">⭐ 收藏</button>
    </div>
    <div class="mm-sec">自定义标签（可多次添加）</div>
    <div class="mm-custom-input-row">
      <input id="mmTagInput" type="text" maxlength="10" placeholder="输入标签，如：高频/易错/重点">
      <button id="mmTagAdd">添加</button>
    </div>
    <div class="mm-tags" id="mmTags"></div>
    <div class="mm-footer">
      <button id="mmClear">清除全部标记</button>
      <button id="mmDone">完成</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<footer>
  共 <span id="total"></span> 词 · 发音：有道/百度真人语音（需联网），失败自动回退系统语音<br>
  标记与进度保存在本浏览器本地；换设备时用「导出/导入」即可迁移 · 点击字母快速定位，关键词实时筛选
</footer>

/* ================= 数据存储（localStorage） ================= */
const STORE_KEY = 'vocab4500_marks_v1';
let store = { marks:{}, studied:{} };

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.marks) store = s; }
  }catch(e){ store = { marks:{}, studied:{} }; }
}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){ toast('保存失败：浏览器存储不可用'); } }

function wordMarks(w){ return store.marks[w] || []; }
function hasAnyMark(w){ const a = store.marks[w]; return !!(a && a.length); }
function isMarked(w, id){ return wordMarks(w).includes(id); }
function toggleMark(w, id){
  if(!store.marks[w]) store.marks[w] = [];
  const arr = store.marks[w];
  const i = arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  if(arr.length===0) delete store.marks[w];
  if(!store.studied[w]) store.studied[w] = Date.now();
  saveStore();
  updateStats(); render(); syncMarkModal();
}
function addCustomTag(w, tag){
  tag = tag.trim();
  if(!tag) return;
  const id = 'c:'+tag;
  if(!store.marks[w]) store.marks[w] = [];
  if(!store.marks[w].includes(id)){ store.marks[w].push(id); if(!store.studied[w]) store.studied[w]=Date.now(); }
  saveStore(); updateStats(); render(); syncMarkModal(); buildTagChips();
}
function clearMarks(w){
  delete store.marks[w];
  saveStore(); updateStats(); render(); syncMarkModal(); buildTagChips();
}
function collectCustomTags(){
  const set = new Set();
  for(const w in store.marks){
    for(const m of store.marks[w]) if(m.startsWith('c:')) set.add(m.slice(2));
  }
  return Array.from(set).sort();
}

/* ================= 统计/进度 ================= */
function todayStr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function computeStats(){
  let studied=0, hard=0, marked=0, today=0;
  const td = todayStr(new Date());
  for(const w in store.studied){
    if(todayStr(new Date(store.studied[w])) === td) today++;
  }
  for(const w in store.marks){
    const a = store.marks[w]; if(!a.length) continue;
    studied++;
    if(a.includes('hard')) hard++;
    if(a.includes('fav') || a.some(x=>x.startsWith('c:'))) marked++;
  }
  return {studied, hard, marked, today, total: DATA.length};
}
function updateStats(){
  const s = computeStats();
  const pct = s.total ? Math.round(s.studied/s.total*100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = s.studied + '/' + s.total + ' (' + pct + '%)';
  document.getElementById('cStudied').textContent = s.studied;
  document.getElementById('cUnstudied').textContent = s.total - s.studied;
  document.getElementById('cHard').textContent = s.hard;
  document.getElementById('cMarked').textContent = s.marked;
  document.getElementById('cToday').textContent = '今日 +' + s.today;
}

/* ================= 发音引擎（有道→百度→系统语音） ================= */
function normSpeak(word){
  let w = word.split('/')[0].trim();
  w = w.replace(/[（(].*$/, '');
  return w.trim();
}
let accent = 1;
let currentAudio = null;
let speakingWord = null;
let playId = 0;
function stopAll(){
  playId++;
  speakingWord = null;
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  setBtnState(null);
}
function playOne(url, gen){
  return new Promise((resolve, reject) => {
    let a;
    try { a = new Audio(url); } catch(e){ reject(new Error('audio-create-fail')); return; }
    a.preload = 'auto';
    let started = false, settled = false;
    const stale = ()=> gen !== playId;
    const fail = ()=>{ if(settled) return; settled = true; clearTimeout(timer); try{ a.pause(); }catch(e){} reject(new Error('audio-fail')); };
    const done = ()=>{ if(settled) return; settled = true; clearTimeout(timer); resolve(); };
    const timer = setTimeout(()=>{ if(!started) fail(); }, 6000);
    a.onerror = fail;
    a.onplay = ()=>{ started = true; currentAudio = a; if(!stale() && speakingWord !== null) setBtnState(speakingWord); };
    a.onended = ()=>{ currentAudio = null; if(!stale()) setBtnState(null); done(); };
    a.play().then(()=>{ started = true; currentAudio = a; }).catch(fail);
  });
}
function audioSources(word){
  const w = encodeURIComponent(normSpeak(word));
  return [
    'https://dict.youdao.com/dictvoice?audio=' + w + '&type=' + accent,
    'https://fanyi.baidu.com/gettts?lan=en&text=' + w + '&spd=3&source=web'
  ];
}
async function playOnline(word, gen){
  const urls = audioSources(word);
  for(const u of urls){
    if(gen !== playId) return false;
    try { await playOne(u, gen); return true; }catch(e){}
  }
  return false;
}
function playLocal(word){
  if(!('speechSynthesis' in window)){ toast('在线发音加载失败，且当前设备不支持系统语音'); setBtnState(null); return; }
  const u = new SpeechSynthesisUtterance(normSpeak(word));
  u.lang='en-US'; u.rate=0.82; u.pitch=1;
  u.onend = ()=>{ if(speakingWord===word) setBtnState(null); };
  u.onerror = ()=>{ if(speakingWord===word) setBtnState(null); };
  speechSynthesis.speak(u);
}
async function speak(word){
  if(speakingWord === word){ stopAll(); return; }
  stopAll();
  const myId = ++playId;
  speakingWord = word;
  setBtnState(word, 'loading');
  const watchdog = setTimeout(()=>{ if(myId===playId && speakingWord===word) setBtnState(null); }, 10000);
  const ok = await playOnline(word, myId);
  clearTimeout(watchdog);
  if(!ok && myId===playId && speakingWord===word) playLocal(word);
}
function setBtnState(word, mode){
  speakingWord = word;
  document.querySelectorAll('.list-item').forEach(li=>{
    const isCur = li.dataset.word === word;
    li.classList.toggle('speaking', isCur);
    const b = li.querySelector('.play-btn');
    if(!b) return;
    if(isCur && mode==='loading'){ b.textContent='…'; b.classList.add('loading','speaking'); }
    else if(isCur){ b.textContent='⏹'; b.classList.remove('loading'); b.classList.add('speaking'); }
    else { b.textContent='🔊'; b.classList.remove('loading','speaking'); }
  });
}

/* ================= 渲染与筛选 ================= */
const DATA_LOWER = DATA.map(e => ({w:e.word.toLowerCase(), d:e.def}));
let activeLetter = 'ALL';
let activeTab = 'all';
let activeTag = null;
let searchTerm = '';
let quizMode = false;

const MARK_META = {
  know:{label:'已掌握', cls:'k'}, fuzzy:{label:'模糊', cls:'f'},
  hard:{label:'难记', cls:'h'}, fav:{label:'收藏', cls:'s'}
};
const TAB_DEF = [
  {id:'all', label:'全部'}, {id:'unstudied', label:'未学'},
  {id:'studied', label:'已学'}, {id:'hard', label:'难记'}, {id:'marked', label:'标记'}
];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function badgeHTML(w){
  const a = wordMarks(w);
  if(!a.length) return '';
  let h = '';
  const order = ['know','fuzzy','hard','fav'];
  for(const m of order){ if(a.includes(m)){ h += '<span class="badge '+MARK_META[m].cls+'">'+MARK_META[m].label+'</span>'; } }
  for(const m of a){ if(m.startsWith('c:')){ h += '<span class="badge t">#'+esc(m.slice(2))+'</span>'; } }
  return '<div class="badges">'+h+'</div>';
}

function buildFilters(){
  const box = document.getElementById('filters');
  box.innerHTML = '';
  const cnt = {all: DATA.length};
  const s = computeStats();
  cnt.unstudied = s.total - s.studied;
  cnt.studied = s.studied;
  cnt.hard = s.hard;
  cnt.marked = s.marked;
  for(const t of TAB_DEF){
    const b = document.createElement('button');
    b.className = 'fbtn' + (activeTab===t.id && !activeTag ? ' active':'');
    b.innerHTML = t.label + ' <span class="n">'+cnt[t.id]+'</span>';
    b.onclick = ()=>{ activeTab=t.id; activeTag=null; buildFilters(); render(); };
    box.appendChild(b);
  }
  buildTagChips();
}

function buildTagChips(){
  const box = document.getElementById('tagchips');
  const tags = collectCustomTags();
  box.innerHTML = '';
  if(!tags.length) return;
  for(const tg of tags){
    const c = document.createElement('div');
    c.className = 'tagchip' + (activeTag===tg ? ' active':'');
    c.textContent = '#'+tg;
    c.onclick = ()=>{ activeTag = (activeTag===tg?null:tg); buildFilters(); render(); };
    box.appendChild(c);
  }
}

function matchWord(i, term){
  return DATA_LOWER[i].w.includes(term) || DATA[i].def.toLowerCase().includes(term);
}

function getFiltered(){
  const term = searchTerm.toLowerCase();
  const out = [];
  for(let i=0;i<DATA.length;i++){
    const e = DATA[i];
    if(activeLetter!=='ALL' && e.word[0].toUpperCase()!==activeLetter) continue;
    if(term && !matchWord(i, term)) continue;
    const w = e.word;
    if(activeTag){
      if(!isMarked(w, 'c:'+activeTag)) continue;
    } else if(activeTab==='unstudied'){ if(hasAnyMark(w)) continue; }
    else if(activeTab==='studied'){ if(!hasAnyMark(w)) continue; }
    else if(activeTab==='hard'){ if(!isMarked(w,'hard')) continue; }
    else if(activeTab==='marked'){ if(!(isMarked(w,'fav') || wordMarks(w).some(x=>x.startsWith('c:')))) continue; }
    out.push(e);
  }
  return out;
}

function render(){
  const out = getFiltered();
  const tabs = TAB_DEF.find(t=>t.id===activeTab);
  const scope = activeTag ? ('#'+activeTag) : (tabs?tabs.label:'');
  document.getElementById('stats').textContent =
    (activeLetter==='ALL'?'':('字母 '+activeLetter+' · ')) + (scope?scope+' · ':'') + '显示 ' + out.length + ' 个';
  const main = document.getElementById('list');
  if(!out.length){ main.innerHTML = '<div class="empty">这里还没有单词，去「全部」里学习并打标记吧～</div>'; return; }
  let html = '';
  for(const e of out){
    const w = esc(e.word);
    const defHtml = quizMode
      ? '<div class="def hidden-def" data-action="reveal">👆 点击显示释义</div>'
      : '<div class="def" data-action="reveal">'+esc(e.def)+'</div>';
    const hasMark = hasAnyMark(e.word);
    html += '<div class="list-item" data-word="'+w+'">'
      + '<div class="w-col">'
      +   '<div class="word" data-action="play">'+w+'</div>'
      +   '<div class="ipa">'+esc(e.ipa)+'</div>'
      +   badgeHTML(e.word)
      + '</div>'
      + defHtml
      + '<div class="btn-group">'
      +   '<button class="play-btn" data-action="play" title="播放发音">🔊</button>'
      +   '<button class="mark-btn'+(hasMark?' has':'')+'" data-action="mark" title="标记">📌</button>'
      + '</div>'
      + '</div>';
  }
  main.innerHTML = html;
}

/* 事件委托：播放 / 标记 / 显示释义 */
document.getElementById('list').addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const li = t.closest('.list-item');
  if(!li) return;
  const act = t.dataset.action;
  const word = li.dataset.word;
  if(act==='play'){ speak(word); }
  else if(act==='mark'){ openMarkModal(word); }
  else if(act==='reveal'){
    const d = t;
    if(quizMode){
      if(d.classList.contains('revealed')){ d.classList.remove('revealed'); d.textContent='👆 点击显示释义'; d.classList.add('hidden-def'); }
      else { d.textContent = li.querySelector('.def') ? DATA.find(x=>x.word===word).def : ''; d.classList.add('revealed'); d.classList.remove('hidden-def'); }
    }
  }
});

/* ================= 标记弹窗 ================= */
let modalWord = null;
function openMarkModal(word){
  modalWord = word;
  const e = DATA.find(x=>x.word===word);
  document.getElementById('mmWord').textContent = word;
  document.getElementById('mmIpa').textContent = e.ipa;
  document.getElementById('mmDef').textContent = e.def;
  syncMarkModal();
  document.getElementById('markModal').classList.add('open');
  document.getElementById('mmTagInput').value = '';
}
function closeMarkModal(){ document.getElementById('markModal').classList.remove('open'); modalWord=null; }
function syncMarkModal(){
  if(!modalWord) return;
  document.querySelectorAll('.mm-btn').forEach(b=>{
    b.classList.toggle('on', isMarked(modalWord, b.dataset.mark));
  });
  const box = document.getElementById('mmTags');
  const tags = wordMarks(modalWord).filter(m=>m.startsWith('c:')).map(m=>m.slice(2));
  box.innerHTML = '';
  if(!tags.length){ box.innerHTML = '<div class="mm-empty">暂无自定义标签</div>'; return; }
  for(const tg of tags){
    const chip = document.createElement('div');
    chip.className = 'mm-tag';
    chip.textContent = '#'+tg;
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '✕';
    x.onclick = ()=>{ removeCustomTag(modalWord, tg); };
    chip.appendChild(x);
    box.appendChild(chip);
  }
}
function removeCustomTag(w, tg){
  const arr = store.marks[w];
  if(arr) arr.splice(arr.indexOf('c:'+tg), 1);
  if(arr && arr.length===0) delete store.marks[w];
  saveStore(); updateStats(); render(); syncMarkModal(); buildTagChips();
}
document.getElementById('markModal').addEventListener('click', e => {
  const gridBtn = e.target.closest('.mm-btn');
  if(gridBtn && modalWord){ toggleMark(modalWord, gridBtn.dataset.mark); return; }
  if(e.target.closest('#mmDone')){ closeMarkModal(); return; }
  if(e.target.closest('#mmClear') && modalWord){
    if(confirm('确定清除「'+modalWord+'」的全部标记吗？')) clearMarks(modalWord);
    return;
  }
  if(e.target.id === 'markModal'){ closeMarkModal(); }
});
document.getElementById('mmTagAdd').addEventListener('click', ()=>{
  if(!modalWord) return;
  const v = document.getElementById('mmTagInput').value.trim();
  if(!v){ toast('请输入标签内容'); return; }
  addCustomTag(modalWord, v);
  document.getElementById('mmTagInput').value='';
});
document.getElementById('mmTagInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ document.getElementById('mmTagAdd').click(); }
});

/* ================= 美音/英音 + 自测 ================= */
document.getElementById('accent').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  accent = parseInt(b.dataset.type,10);
  document.querySelectorAll('#accent button').forEach(x=>x.classList.toggle('active', x===b));
  toast(accent===1?'已切换美音':'已切换英音');
});
document.getElementById('quizMode').addEventListener('click', ()=>{
  quizMode = !quizMode;
  document.getElementById('quizMode').classList.toggle('on', quizMode);
  render();
  toast(quizMode ? '自测模式已开启：释义已隐藏，点击查看' : '已关闭自测模式');
});

/* ================= 搜索 ================= */
const searchInput = document.getElementById('search');
let debounce;
searchInput.addEventListener('input', ()=>{
  clearTimeout(debounce);
  debounce = setTimeout(()=>{ searchTerm = searchInput.value.trim(); render(); }, 120);
});

/* ================= 字母导航 ================= */
let lettersContainer = null;
function buildLettersFixed(){
  const map = {};
  DATA.forEach(e=>{ const L=e.word[0].toUpperCase(); map[L]=(map[L]||0)+1; });
  if(!lettersContainer){
    lettersContainer = document.createElement('div');
    lettersContainer.className='filters';
    lettersContainer.style.marginTop='4px';
    document.getElementById('lettersWrap').appendChild(lettersContainer);
  }
  lettersContainer.innerHTML='';
  const mk = (L,label,cnt) => {
    const d=document.createElement('button');
    d.className='fbtn'+(activeLetter===L?' active':'');
    d.innerHTML = label + (cnt!==undefined?' <span class="n">'+cnt+'</span>':'');
    d.onclick = ()=>{ activeLetter=L; buildLettersFixed(); render(); };
    lettersContainer.appendChild(d);
  };
  mk('ALL','全部');
  Object.keys(map).sort().forEach(L=>mk(L, L, map[L]));
}

/* ================= 导出 / 导入 / 重置 ================= */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(store, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(); const ds = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  a.href = url; a.download = '专升本单词标记备份-'+ds+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 300);
  toast('已导出备份（'+(Object.keys(store.marks).length)+' 词标记）');
});
document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || !data.marks) throw new Error('格式错误');
      // 合并：逐词覆盖
      let n=0;
      for(const w in data.marks){ store.marks[w]=data.marks[w]; if(data.studied && data.studied[w]) store.studied[w]=data.studied[w]; n++; }
      saveStore(); updateStats(); render(); buildTagChips(); buildFilters();
      toast('导入成功：合并了 '+n+' 个单词的标记');
    }catch(err){ toast('导入失败：文件格式不正确'); }
    e.target.value='';
  };
  reader.readAsText(f);
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(confirm('确定清空所有单词的标记和学习进度吗？此操作不可恢复！')){
    store = {marks:{}, studied:{}};
    saveStore(); updateStats(); render(); buildTagChips(); buildFilters();
    toast('已清空全部标记');
  }
});

/* ================= 提示 ================= */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ================= 初始化 ================= */
loadStore();
document.getElementById('badge').textContent = DATA.length + ' 词';
document.getElementById('total').textContent = DATA.length;
buildLettersFixed();
buildFilters();
updateStats();
render();
</script>
